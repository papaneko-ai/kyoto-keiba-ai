name: Kyoto P1 three original dual-market offline integrity
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths:
      - '.github/workflows/kyoto-p1-three-original-dual.yml'
      - 'diagnostics/jra_p1_future_evidence.py'
      - 'diagnostics/jra_p1_offline_handoff.py'
      - 'diagnostics/jra_p1_snapshot_gate.py'
      - 'diagnostics/p1_dual_market_offline_audit.py'
      - 'diagnostics/p1_three_original_dual_intake.py'
      - 'tests/test_p1_three_original_dual_intake.py'
      - 'tests/test_p1_dual_market_offline_audit.py'
permissions:
  contents: read
jobs:
  bounded-independent-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile new three-original and older gates
        run: |
          python -m py_compile diagnostics/p1_three_original_dual_intake.py diagnostics/jra_p1_future_evidence.py diagnostics/jra_p1_offline_handoff.py diagnostics/p1_dual_market_offline_audit.py tests/test_p1_three_original_dual_intake.py
      - name: Check independent three originals, tamper, stale market and fail closed
        run: |
          python -m unittest discover -s tests -p 'test_p1_three_original_dual_intake.py' -v
          python -m unittest discover -s tests -p 'test_p1_dual_market_offline_audit.py' -v
      - name: Retain the older two-original backward-compatible gate
        run: |
          python -m unittest discover -s tests -p 'test_jra_p1_intake_bridge.py' -v
          python -m unittest discover -s tests -p 'test_p1_prerace_market_coverage.py' -v
