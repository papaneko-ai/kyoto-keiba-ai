name: Kyoto Nov28-29 afternoon auxiliary refresh
run-name: ${{ github.event_name == 'schedule' && format('kyoto-native:{0}', github.event.schedule) || github.event_name }}
on:
  workflow_dispatch:
    inputs:
      race_day:
        type: choice
        required: true
        options: ['20261128', '20261129']
      confirmation:
        description: Enter NOV28-29-AUXILIARY-SOURCE-ONLY
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('kyoto-20261128-29-source-{0}', inputs.race_day == '20261128' && '20261128' || '20261129') || format('kyoto-native-isolated-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max
jobs:
  afternoon-auxiliary-source:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'NOV28-29-AUXILIARY-SOURCE-ONLY') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: ${{ (github.event.schedule == '30 3 28 11 *' || github.event.schedule == '30 4 28 11 *' || github.event.schedule == '30 5 28 11 *' || github.event.schedule == '30 6 28 11 *' || inputs.race_day == '20261128') && '20261128' || '20261129' }}
      KYOTO_AUX_HTTP_APPROVED: 'YES'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.race_day == '20261129' && '74c823836b7099e959d885e1cca778f390fd2195' || 'c289c5ec4e6ad322a7e08acf173da3352ed23dba' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install the same exact dependency versions as tested collector
        run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Verify fixed source before afternoon refresh
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.race_day == '20261129' && '74c823836b7099e959d885e1cca778f390fd2195' || 'c289c5ec4e6ad322a7e08acf173da3352ed23dba' }}"
          python -m diagnostics.kyoto_impl30_auxiliary_refresh --day "$KYOTO_TARGET_DAY" --out auxiliary_sealed
      - name: Upload encrypted afternoon racecard and track originals only
        id: upload_auxiliary_primary
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-auxiliary-${{ github.run_id }}-${{ env.KYOTO_TARGET_DAY }}
          path: auxiliary_sealed/
          retention-days: 90
          if-no-files-found: error
      - name: Retry same encrypted auxiliary artifact after first upload failure
        if: ${{ always() && steps.upload_auxiliary_primary.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-auxiliary-${{ github.run_id }}-${{ env.KYOTO_TARGET_DAY }}
          path: auxiliary_sealed/
          retention-days: 90
          if-no-files-found: error
          overwrite: true
