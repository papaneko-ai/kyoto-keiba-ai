name: Kyoto P1-FB offline symmetric source gate
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/activate_p1_fb_offline_gate_20261106.txt']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jra-html-diagnostic-20261105
      - name: Compile offline source decision engine
        run: python -m compileall -q diagnostics/jra_p1_failover_offline.py tests/test_jra_p1_failover_offline.py
      - name: Test symmetric PC/SP fallback and fail-closed guards
        run: python -m unittest discover -s tests -p 'test_jra_p1_failover_offline.py' -v
      - name: Record offline-only source decision gate verification
        run: |
          mkdir -p docs/diagnostics/jra_p1_fb_offline_20261106
          python -c 'import json;from pathlib import Path;from hashlib import sha256;p=Path("diagnostics/jra_p1_failover_offline.py");r={"schema":"p1_fb_offline_gate.v1","state":"OFFLINE_GATE_TESTED","original_bytes_sha256":sha256(p.read_bytes()).hexdigest(),"pc_sp_bidirectional_synthetic_cases":15,"network_requests":0,"real_sp_profile_parser_verified":False,"live_automatic_switch_authorized":False,"prediction_ready":False,"training_ready":False};Path("docs/diagnostics/jra_p1_fb_offline_20261106/status.json").write_text(json.dumps(r,indent=2))'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/jra_p1_fb_offline_20261106/status.json
          git commit -m "Record P1-FB validated offline decision gate"
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
