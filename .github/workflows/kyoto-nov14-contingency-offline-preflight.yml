name: Kyoto Nov14 zero-network contingency fault rehearsal
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths:
      - diagnostics/kyoto_nov14_attempt_guard.py
      - tests/test_kyoto_nov14_fault_matrix_preflight.py
      - .github/workflows/kyoto-p1-nov14-one-shot-meeting-observation.yml
      - .github/workflows/kyoto-nov14-contingency-offline-preflight.yml
      - .github/workflows/kyoto-nov15-encrypted-observer.yml
      - diagnostics/kyoto_nov15_dispatch_guard.py
      - tests/test_kyoto_nov15_dispatch_guard.py
      - .github/workflows/kyoto-nov15-unattended-observer-launcher.yml
      - tests/test_kyoto_nov15_unattended_launcher.py
      - diagnostics/kyoto_race_day_http_gate.py
      - tests/test_kyoto_race_day_http_gate.py
      - .github/workflows/kyoto-nov15-second-day-observed-oneshot.yml
      - diagnostics/kyoto_nov15_observer_artifact_identity.py
      - tests/test_kyoto_nov15_observer_artifact_identity.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-external-jra-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONPATH: .:tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only existing offline HTML parser
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Run offline failure matrix and existing official-source/market validators
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preflight_report
          python -m unittest -v \
            tests.test_kyoto_nov14_fault_matrix_preflight \
            tests.test_kyoto_p1_nov14_official_one_shot_nav \
            tests.test_kyoto_p1_nov14_receipt_handoff \
            tests.test_jra_official_link_repair \
            tests.test_p1_atomic_dual_market_handoff \
            tests.test_jra_one_shot_market_capture \
            tests.test_kyoto_nov15_dispatch_guard \
            tests.test_kyoto_nov15_secure_workflow_gates \
            tests.test_kyoto_nov15_unattended_launcher \
            tests.test_kyoto_race_day_http_gate \
            tests.test_kyoto_nov15_observer_artifact_identity 2>&1 | tee preflight_report/unittest.log
          python - <<'PY'
          import hashlib,json,os,pathlib
          tests=pathlib.Path("preflight_report/unittest.log").read_bytes()
          assert b"\nOK\n" in tests or tests.rstrip().endswith(b"OK"),"offline_tests_not_accepted"
          report={
            "schema":"kyoto_nov14_contingency_offline_preflight.v1",
            "run_id":os.environ["GITHUB_RUN_ID"],
            "source_head":os.environ["GITHUB_SHA"],
            "result":"OFFLINE_FAULT_MATRIX_PASS",
            "unittest_log_sha256":hashlib.sha256(tests).hexdigest(),
            "actual_jra_http_requests":0,
            "prior_get_already_attempted":True,
            "no_repeat_get":True,
            "genuine_nov14_racecard_authenticated":False,
            "genuine_nov14_quinella_authenticated":False,
            "genuine_nov14_bracket_authenticated":False,
            "operational_credit":0
          }
          pathlib.Path("preflight_report/report.json").write_text(
            json.dumps(report,sort_keys=True,indent=2)+"\n",encoding="utf8")
          print("NOV14_PRELIMINARY_FAULT_REHEARSAL=PASS")
          print("NO_JRA_EXTERNAL_HTTP=TRUE")
          print("PRIOR_ONE_SHOT_RETRY_BLOCKED=TRUE")
          PY
      - name: Retain reproducible offline preflight proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-nov14-offline-fault-rehearsal-${{ github.run_id }}
          path: preflight_report/
          retention-days: 30
          if-no-files-found: warn
