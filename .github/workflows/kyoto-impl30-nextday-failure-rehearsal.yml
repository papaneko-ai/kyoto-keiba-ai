name: Kyoto Impl30 actual failure handoff rehearsal
on:
  pull_request:
    branches: ['fix/impl30-nextday-adaptation-20261124']
    paths: ['diagnostics/kyoto_impl30_nextday_adaptation.py', 'tests/test_kyoto_impl30_nextday_failure_rehearsal.py', '.github/workflows/kyoto-impl30-nextday-failure-rehearsal.yml']
permissions:
  contents: read
  actions: read
jobs:
  saturday-replay:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/impl30-nextday-rehearsal-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Targeted policy tests
        run: python -m unittest -v tests.test_kyoto_impl30_nextday_failure_rehearsal
      - name: Retrieve real prior failure metadata and create hypothetical Saturday handoff
        run: python -m tests.test_kyoto_impl30_nextday_failure_rehearsal prepare
      - uses: actions/upload-artifact@v4
        with:
          name: kyoto-handoff-${{ github.run_id }}-20261128
          path: rehearsal_handoff/
          if-no-files-found: error
          retention-days: 7
  sunday-replay:
    needs: saturday-replay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Real cross-job artifact download and actual Sunday entrypoint rehearsal
        run: python -m tests.test_kyoto_impl30_nextday_failure_rehearsal consume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-nextday-rehearsal-result-${{ github.run_id }}
          path: rehearsal_result/
          if-no-files-found: error
          retention-days: 90
