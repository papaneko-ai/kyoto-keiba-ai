name: Kyoto Impl32 isolated historical SP12 recovery
on:
  push:
    branches: ['fix/impl32-historical-sp12-proof-20261125']
permissions:
  contents: read
jobs:
  historical-sp:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: '20261122'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Isolated exact historical URL recovery
        env:
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
        run: python -m diagnostics.kyoto_impl32_historical_sp12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-impl32-historical-sp12-${{ github.run_id }}
          path: impl32_historical_sp/
          retention-days: 90
          if-no-files-found: error
