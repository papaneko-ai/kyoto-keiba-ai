name: Kyoto independent partial adaptation outcome and actual policy preflight
on:
  push:
    branches: ['fix/impl41-adaptation-outcome-20261128']
  pull_request:
    branches: [main]
    paths:
      - 'diagnostics/kyoto_partial_adaptation_outcome.py'
      - 'tests/test_kyoto_partial_adaptation_outcome.py'
      - '.github/workflows/kyoto-adaptation-outcome-review.yml'
  workflow_run:
    workflows: ['Kyoto Nov28-29 authenticated all-run handoff']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  test:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m unittest -v tests.test_kyoto_partial_adaptation_outcome
  review:
    needs: test
    if: ${{ always() && github.repository == 'papaneko-ai/kyoto-keiba-ai' && ((github.event_name == 'push' && github.ref == 'refs/heads/fix/impl41-adaptation-outcome-20261128' && needs.test.result == 'success') || (github.event_name == 'workflow_run' && github.ref == 'refs/heads/main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'workflow_dispatch' && startsWith(github.event.workflow_run.created_at, '2026-11-29') && needs.test.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_AUX_HTTP_APPROVED: 'NO'
      KYOTO_POSTRACE_HTTP_APPROVED: 'NO'
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 'fed005c89fcfa940c479538ee983f211598a6640'
          path: trusted-policy-reader
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Recover real signed policy or evaluate partial application without source HTTP
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python -m diagnostics.kyoto_partial_adaptation_outcome --reader trusted-policy-reader --out outcome --preflight
          else
            python -m diagnostics.kyoto_partial_adaptation_outcome --reader trusted-policy-reader --out outcome --sunday-run "$SOURCE_RUN_ID"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-adaptation-outcome
          path: outcome/
          if-no-files-found: error
          retention-days: 90
