name: Kyoto Impl33 workout production candidate contract
on:
  push:
    branches: ['fix/impl33-workout-production-candidate-20261126']
  pull_request:
    paths:
      - '.github/workflows/kyoto-20261128-29-workout-source.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Verify protected workout reader and dispatch-only trigger
        run: python -m unittest -v tests.test_kyoto_impl39_native_isolation.Isolation.test_exact_live_workflow_delta tests.test_kyoto_impl39_native_isolation.Isolation.test_legacy_event_and_lock_isolation
