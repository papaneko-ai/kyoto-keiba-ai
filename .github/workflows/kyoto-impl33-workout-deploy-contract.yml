name: Kyoto Impl33 workout production candidate contract
on:
  push:
    branches: ['fix/impl33-workout-production-candidate-20261126']
  pull_request:
    paths:
      - '.github/workflows/kyoto-20261128-29-workout-source.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify new workflow only; protected old schedules remain identical
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          workflow='.github/workflows/kyoto-20261128-29-workout-source.yml'
          if [ -n "$PR_BASE_SHA" ] && git cat-file -e "$PR_BASE_SHA:$workflow" 2>/dev/null; then
            # Existing production workflow: permit only one exact metadata label addition.
            git show "$PR_BASE_SHA:$workflow" > /tmp/kyoto-workout-before.yml
            python - <<'PY'
          from pathlib import Path
          old=Path('/tmp/kyoto-workout-before.yml').read_text()
          new=Path('.github/workflows/kyoto-20261128-29-workout-source.yml').read_text()
          marker="run-name: __EXPR_OPEN__ github.event_name == 'schedule' && format('kyoto-native:{0}', github.event.schedule) || github.event_name }}\\n".replace('\\n','\n').replace('__EXPR_OPEN__',chr(36)+'{{')
          assert new.count(marker)==1 and new.replace(marker,'',1)==old, 'WORKOUT_NON_METADATA_CHANGE'
          print('WORKOUT_METADATA_ONLY_CHANGE')
          PY
          else
            git diff --name-status '8813b6fccb4b236f37afb13af25084e5e8c46d31' HEAD
            test "$(git diff --name-only '8813b6fccb4b236f37afb13af25084e5e8c46d31' HEAD | sort)" = "$(printf '%s\n' .github/workflows/kyoto-20261128-29-workout-source.yml .github/workflows/kyoto-impl33-workout-deploy-contract.yml | sort)"
            test "$(git diff --name-only --diff-filter=MD '8813b6fccb4b236f37afb13af25084e5e8c46d31' HEAD)" = ''
          fi
          ruby -ryaml -e 'd=YAML.load_file(ARGV[0]); o=d["on"] || d[true]; abort unless o["schedule"].map{|s|s["cron"]} == ["30 11 27 11 *","30 22 27 11 *","30 11 28 11 *","30 22 28 11 *"]; abort unless o["workflow_run"]["branches"] == ["main"]; abort unless d["permissions"] == {"contents"=>"read","actions"=>"read"}; abort unless d["concurrency"]["cancel-in-progress"] == false; j=d["jobs"]["source-only"]; abort unless j["env"]["KYOTO_WEEKEND_HTTP_APPROVED"] == "NO"; abort unless j["env"]["KYOTO_AUX_HTTP_APPROVED"] == "NO"; abort unless j["steps"][0]["with"]["ref"] == "d254c0a69d434ceb962194471b968f239dbcf999"; abort unless j["steps"][0]["with"]["persist-credentials"] == false; puts "WORKOUT_CONTRACT_OK"' .github/workflows/kyoto-20261128-29-workout-source.yml
