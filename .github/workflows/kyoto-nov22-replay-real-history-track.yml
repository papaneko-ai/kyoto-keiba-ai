name: Nov22 independent replay 185 actual JRA profile history and Kyoto track
on:
  push:
    branches: [fix/nov22-remaining-full-acquisition-evidence-20261122]
    paths:
      - 'diagnostics/kyoto_nov22_actual_185_profile_history_track_replay.py'
      - '.github/workflows/kyoto-nov22-replay-real-history-track.yml'
permissions:
  contents: read
  actions: read
jobs:
  actual-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      KYOTO_JRA_ARCHIVE_AES256_HEX: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: rescue
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2dce4f5fa9d0ce48e460a95664fe3207c7f95ba6
          path: frozen
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Download actual source without additional JRA HTTP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frozen/real_source/profile frozen/real_source/track frozen/nov22_all12_source
          gh run download 44984067104 -R "$GITHUB_REPOSITORY" -n kyoto-nov22-observed-horse-profiles-44984067104 -D frozen/real_source/profile
          gh run download 44984408658 -R "$GITHUB_REPOSITORY" -n kyoto-nov22-real-ground-official-source-44984408658 -D frozen/real_source/track
          gh run download 44966013490 -R "$GITHUB_REPOSITORY" -n kyoto-nov22-real-observed-all12-encrypted-44966013490 -D frozen/nov22_all12_source
      - name: Verify bounded official administrative suffix under non-wager source only
        shell: bash
        run: |
          set -euo pipefail
          cd rescue
          python -m unittest -v tests.test_jra_horse_official_status_suffix
      - name: Replay 185 actual unique horse profile bytes with established G04 and repaired history reader
        shell: bash
        run: |
          set -euo pipefail
          cd frozen
          cp ../rescue/diagnostics/jra_prior_form_offline.py diagnostics/jra_prior_form_offline.py
          PYTHONPATH=.:../rescue python ../rescue/diagnostics/kyoto_nov22_actual_185_profile_history_track_replay.py
      - name: Persist exact rejected source identities and safe counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-nov22-185-real-history-track-${{ github.run_id }}
          path: frozen/real_history_track_report/
          if-no-files-found: warn
          retention-days: 90
