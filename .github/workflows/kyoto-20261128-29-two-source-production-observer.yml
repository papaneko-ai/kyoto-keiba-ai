name: Kyoto Nov28-29 independent encrypted original collection
run-name: ${{ github.event_name == 'schedule' && format('kyoto-native:{0}', github.event.schedule) || github.event_name }}
on:
  schedule:
    - cron: '15 0 28 11 *' # 09:15 JST pre-race first capture
    - cron: '15 1 28 11 *' # 10:15 JST official moisture/cushion publication hedge
    - cron: '5 2 28 11 *'
    - cron: '50 2 28 11 *' # pre-HTTP-failure-only backup
    - cron: '15 0 29 11 *' # 09:15 JST pre-race first capture
    - cron: '15 1 29 11 *' # 10:15 JST official moisture/cushion publication hedge
    - cron: '10 2 29 11 *'
    - cron: '55 2 29 11 *' # pre-HTTP-failure-only backup
  workflow_dispatch:
    inputs:
      race_day:
        description: Race day, must match actual UTC date
        type: choice
        required: true
        options:
          - '20261128'
          - '20261129'
      confirmation:
        description: Enter NOV28-29-OBSERVE-READ-ONLY
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: kyoto-20261128-29-source-${{ (github.event.schedule == '15 0 28 11 *' || github.event.schedule == '15 1 28 11 *' || github.event.schedule == '5 2 28 11 *' || github.event.schedule == '50 2 28 11 *' || inputs.race_day == '20261128') && '20261128' || '20261129' }}
  cancel-in-progress: false
  queue: max # preserve pending recovery attempts instead of replacing them

jobs:
  select-collector:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'NOV28-29-OBSERVE-READ-ONLY') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      collector_sha: ${{ steps.select.outputs.collector_sha }}
      selection_reason: ${{ steps.select.outputs.selection_reason }}
    env:
      KYOTO_TARGET_DAY: ${{ ((github.event.schedule == '15 0 28 11 *' || github.event.schedule == '15 1 28 11 *' || github.event.schedule == '5 2 28 11 *' || github.event.schedule == '50 2 28 11 *' || inputs.race_day == '20261128')) && '20261128' || '20261129' }}
      DEFAULT_COLLECTOR_SHA: '3f4b3d77357745ead05a9f78db34eb6ac2d78637'
      # Emergency Nov29 release: exact immutable SHA verified by existing preflight selector.
      # Preflight run 46102047091; the independent PC and SP lanes share this selected SHA.
      SUNDAY_OVERRIDE_SHA: 'd588d8a749d7bde37d62c742bfa201d31fc5cbea'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Select one immutable release for both source lanes
        id: select
        run: python -m diagnostics.kyoto_impl30_collector_selection

  pc-originals-independent:
    needs: select-collector
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'NOV28-29-OBSERVE-READ-ONLY') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: ${{ ((github.event.schedule == '15 0 28 11 *' || github.event.schedule == '15 1 28 11 *' || github.event.schedule == '5 2 28 11 *' || github.event.schedule == '50 2 28 11 *' || inputs.race_day == '20261128')) && '20261128' || '20261129' }}
      KYOTO_WEEKEND_HTTP_APPROVED: 'YES'
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
      # Disabled unless the operator provides separate production-only credentials.
      KYOTO_SHARED_CLAIM_ACTIVATE: ${{ vars.KYOTO_SHARED_CLAIM_ACTIVATE || 'NO' }}
      KYOTO_SHARED_CLAIM_TARGET: 'PRODUCTION'
      KYOTO_SHARED_CLAIM_PRODUCTION_APPROVED: ${{ vars.KYOTO_SHARED_CLAIM_PRODUCTION_APPROVED || 'NO' }}
      KYOTO_SHARED_CLAIM_APPROVED_PRODUCTION_HOST: ${{ vars.KYOTO_SHARED_CLAIM_APPROVED_PRODUCTION_HOST }}
      KYOTO_SHARED_CLAIM_TURSO_URL: ${{ vars.KYOTO_SHARED_CLAIM_TURSO_URL }}
      KYOTO_SHARED_CLAIM_TURSO_TOKEN: ${{ secrets.KYOTO_SHARED_CLAIM_TURSO_TOKEN }}
      COLLECTOR_SHA: ${{ needs.select-collector.outputs.collector_sha }}
    steps:
      - name: Record monotonic runner start for source preservation reserve
        shell: bash
        run: echo "KYOTO_JOB_START_SECONDS=$(cut -d. -f1 /proc/uptime)" >> "$GITHUB_ENV"
      - name: Checkout pinned verified development collector, not default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COLLECTOR_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install parser and authenticated encryption
        run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      # All former offline suites run on the exact fixed collector in the
      # pre-race-day release CI. Do not spend the live acquisition window on them.
      - name: Race date, immutable commit, secret, first attempt and non-replay guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re,subprocess
          from datetime import datetime,timezone
          day=os.environ['KYOTO_TARGET_DAY']
          now=datetime.now(timezone.utc)
          assert day in ('20261128','20261129'),'INVALID_DAY_NO_HTTP'
          assert now.strftime('%Y%m%d')==day and 0<=now.hour<4,'OUTSIDE_DAY_WINDOW_NO_HTTP'
          assert int(os.environ.get('GITHUB_RUN_ATTEMPT','0'))>=1,'RUN_ATTEMPT_INVALID_NO_HTTP'
          assert re.fullmatch(r'[0-9a-fA-F]{64}',os.environ.get('ARCHIVE_KEY','')),'ENCRYPTION_KEY_REQUIRED_NO_HTTP'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['COLLECTOR_SHA'],'SOURCE_REVISION_MISMATCH_NO_HTTP'
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['COLLECTOR_SHA']),'COLLECTOR_SHA_INVALID_NO_HTTP'
          if day=='20261128':
              assert os.environ['COLLECTOR_SHA']=='3f4b3d77357745ead05a9f78db34eb6ac2d78637','SATURDAY_SOURCE_UNEXPECTED_NO_HTTP'
          assert os.environ.get('GITHUB_EVENT_NAME') in ('schedule','workflow_dispatch'),'INVALID_EVENT_NO_HTTP'
          assert os.environ.get('KYOTO_WEEKEND_HTTP_APPROVED')=='YES','LIVE_HTTP_NOT_APPROVED'
          # The shared day-locked backup gate separately verifies GitHub
          # run/job metadata and capture-step execution.
          print('PC_STATIC_PRE_HTTP_GUARDS_ACCEPTED')
          PY
          python -m diagnostics.kyoto_weekend_retry_guard --day "$KYOTO_TARGET_DAY"
      - name: Verify opt-in remote Turso table before any PC market requests
        # G06 remote claims fail closed inside the collector if the optional
        # coordinator is unavailable. A failed optional schema probe must not
        # discard PC/G03/G04/G05 originals or block independent SP collection.
        # Only this preflight step is non-blocking; live data and race gates remain.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -m diagnostics.kyoto_impl23_claim_preflight --day "$KYOTO_TARGET_DAY"
      - name: Capture official PC observed originals (bounded no guessed URLs)
        shell: bash
        run: |
          set -euo pipefail
          # Reserve 120 seconds within the EXISTING hard job limit for
          # postflight, seal and upload. A capture timeout fails this step,
          # never suppresses always() preservation or the independent SP lane.
          elapsed=$(( $(cut -d. -f1 /proc/uptime) - KYOTO_JOB_START_SECONDS ))
          remaining=$(( 1200 - 120 - elapsed ))
          if (( remaining < 1 )); then remaining=1; fi
          echo "CAPTURE_SOFT_BUDGET_SECONDS=$remaining"
          timeout --signal=TERM --kill-after=5s "${remaining}s" python -m diagnostics.kyoto_weekend_capture --day "$KYOTO_TARGET_DAY" --channel PC --source pc_raw --destination pc_sealed
      - name: Offline postflight verify saved original SHA and UTC before evidence sealing
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m diagnostics.kyoto_weekend_postflight --day "$KYOTO_TARGET_DAY" --channel PC --root pc_raw
      - name: Always encrypt any source originals or save factual pre-HTTP stop
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m diagnostics.kyoto_weekend_capture --day "$KYOTO_TARGET_DAY" --channel PC --source pc_raw --destination pc_sealed --seal-only
      - name: Upload only AES-GCM ciphertext or safe-stop receipt
        id: upload_pc_primary
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-pc-${{ github.run_id }}-${{ env.KYOTO_TARGET_DAY }}
          path: pc_sealed/
          retention-days: 30
          if-no-files-found: error
      - name: Retry same encrypted artifact if the first upload fails
        if: ${{ always() && steps.upload_pc_primary.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-pc-${{ github.run_id }}-${{ env.KYOTO_TARGET_DAY }}
          path: pc_sealed/
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  sp-originals-independent:
    # Source lanes remain independent, but network execution is serialized.
    # PC failure must NOT prevent SP fallback.
    needs: [select-collector, pc-originals-independent]
    if: ${{ always() && needs.select-collector.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'NOV28-29-OBSERVE-READ-ONLY')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: ${{ ((github.event.schedule == '15 0 28 11 *' || github.event.schedule == '15 1 28 11 *' || github.event.schedule == '5 2 28 11 *' || github.event.schedule == '50 2 28 11 *' || inputs.race_day == '20261128')) && '20261128' || '20261129' }}
      KYOTO_WEEKEND_HTTP_APPROVED: 'YES'
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
      # SP navigation is independently observed from official pages; never use a guessed URL.
      GH_TOKEN: ${{ github.token }}
      GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
      COLLECTOR_SHA: ${{ needs.select-collector.outputs.collector_sha }}
    steps:
      - name: Record monotonic runner start for source preservation reserve
        shell: bash
        run: echo "KYOTO_JOB_START_SECONDS=$(cut -d. -f1 /proc/uptime)" >> "$GITHUB_ENV"
      - name: Checkout pinned verified development collector
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COLLECTOR_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install parser and authenticated encryption
        run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      # Same exact release CI covers SP. Keep live source integrity guards below.
      - name: Race date, immutable commit, secret, first attempt and non-replay guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,re,subprocess
          from datetime import datetime,timezone
          day=os.environ['KYOTO_TARGET_DAY']
          now=datetime.now(timezone.utc)
          assert day in ('20261128','20261129'),'INVALID_DAY_NO_HTTP'
          assert now.strftime('%Y%m%d')==day and 0<=now.hour<4,'OUTSIDE_DAY_WINDOW_NO_HTTP'
          assert int(os.environ.get('GITHUB_RUN_ATTEMPT','0'))>=1,'RUN_ATTEMPT_INVALID_NO_HTTP'
          assert re.fullmatch(r'[0-9a-fA-F]{64}',os.environ.get('ARCHIVE_KEY','')),'ENCRYPTION_KEY_REQUIRED_NO_HTTP'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['COLLECTOR_SHA'],'SOURCE_REVISION_MISMATCH_NO_HTTP'
          assert re.fullmatch(r'[0-9a-f]{40}',os.environ['COLLECTOR_SHA']),'COLLECTOR_SHA_INVALID_NO_HTTP'
          if day=='20261128':
              assert os.environ['COLLECTOR_SHA']=='3f4b3d77357745ead05a9f78db34eb6ac2d78637','SATURDAY_SOURCE_UNEXPECTED_NO_HTTP'
          assert os.environ.get('GITHUB_EVENT_NAME') in ('schedule','workflow_dispatch'),'INVALID_EVENT_NO_HTTP'
          # The shared day-locked backup gate separately verifies GitHub
          # run/job metadata and capture-step execution.
          print('SP_STATIC_PRE_HTTP_GUARDS_ACCEPTED')
          PY
          python -m diagnostics.kyoto_weekend_retry_guard --day "$KYOTO_TARGET_DAY"
      - name: Cross-job HTTP separation before any official SP request
        shell: bash
        run: sleep 3
      - name: Independently verified SP link, otherwise record zero-request stop
        shell: bash
        run: |
          set -euo pipefail
          # Reserve 120 seconds within the EXISTING hard job limit for
          # postflight, seal and upload. A capture timeout fails this step,
          # never suppresses always() preservation or the independent SP lane.
          elapsed=$(( $(cut -d. -f1 /proc/uptime) - KYOTO_JOB_START_SECONDS ))
          remaining=$(( 720 - 120 - elapsed ))
          if (( remaining < 1 )); then remaining=1; fi
          echo "CAPTURE_SOFT_BUDGET_SECONDS=$remaining"
          timeout --signal=TERM --kill-after=5s "${remaining}s" python -m diagnostics.kyoto_weekend_capture --day "$KYOTO_TARGET_DAY" --channel SP --source sp_raw --destination sp_sealed
      - name: Offline postflight verify saved original SHA and UTC before evidence sealing
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m diagnostics.kyoto_weekend_postflight --day "$KYOTO_TARGET_DAY" --channel SP --root sp_raw
      - name: Always encrypt SP originals or save factual pre-HTTP stop
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -m diagnostics.kyoto_weekend_capture --day "$KYOTO_TARGET_DAY" --channel SP --source sp_raw --destination sp_sealed --seal-only
      - name: Upload only AES-GCM ciphertext or safe-stop receipt
        id: upload_sp_primary
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-sp-${{ github.run_id }}-${{ env.KYOTO_TARGET_DAY }}
          path: sp_sealed/
          retention-days: 30
          if-no-files-found: error
      - name: Retry same encrypted artifact if the first upload fails
        if: ${{ always() && steps.upload_sp_primary.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-sp-${{ github.run_id }}-${{ env.KYOTO_TARGET_DAY }}
          path: sp_sealed/
          retention-days: 30
          if-no-files-found: error
          overwrite: true
