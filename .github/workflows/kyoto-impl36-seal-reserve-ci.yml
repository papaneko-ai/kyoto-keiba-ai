name: Kyoto Impl36 pre-hard timeout seal reserve
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kyoto-20261128-29-two-source-production-observer.yml'
      - 'tests/test_kyoto_impl36_seal_reserve.py'
  push:
    branches: ['release/impl36-prehard-timeout-seal-reserve-20261127']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python -m unittest -v tests.test_kyoto_impl36_seal_reserve
