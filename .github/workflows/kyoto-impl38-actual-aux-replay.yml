name: Impl38 actual saved auxiliary original A-B read-only replay
on:
  push:
    branches: ['repair/impl38-actual-aux-replay-20261128']
    paths: ['.github/workflows/kyoto-impl38-actual-aux-replay.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    if: github.repository == 'papaneko-ai/kyoto-keiba-ai' && github.ref == 'refs/heads/repair/impl38-actual-aux-replay-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      KYOTO_TARGET_DAY: '20261128'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_AUX_HTTP_APPROVED: 'NO'
      KYOTO_POSTRACE_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ba7d5bb4c05698dfb92119460b45e730b5eb512b
          path: old
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c3b15355ba5a184e22cd87c34bc645538ce33200
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Pin original run and authenticated artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C old rev-parse HEAD)" = ba7d5bb4c05698dfb92119460b45e730b5eb512b
          test "$(git -C candidate rev-parse HEAD)" = c3b15355ba5a184e22cd87c34bc645538ce33200
          mkdir -p replay-receipt "$RUNNER_TEMP/impl38-cipher"
          gh api repos/papaneko-ai/kyoto-keiba-ai/actions/runs/46112551733 > "$RUNNER_TEMP/impl38-run.json"
          gh api 'repos/papaneko-ai/kyoto-keiba-ai/actions/runs/46112551733/artifacts?per_page=100' > "$RUNNER_TEMP/impl38-artifacts.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])
          r=json.loads((p/"impl38-run.json").read_text()); d=json.loads((p/"impl38-artifacts.json").read_text())
          assert r["id"]==46112551733 and r["head_branch"]=="main" and r["head_repository"]["full_name"]=="papaneko-ai/kyoto-keiba-ai" and r["head_sha"]=="f0da276dabd197e5f12b00fed06300e7ea5c60ed" and r["path"]==".github/workflows/kyoto-20261128-29-auxiliary-refresh.yml" and r["created_at"].startswith("2026-11-28") and r["status"]=="completed"
          assert d["total_count"]==len(d["artifacts"])
          a=[x for x in d["artifacts"] if x["id"]==15250785307 and x["name"]=="kyoto-auxiliary-46112551733-20261128" and x["expired"] is False]
          assert len(a)==1 and a[0]["digest"]=="sha256:444a678b0c8a98f475b369bd3acd858b3be96e1adf64527bc8ca5f4adf780b2c"
          PY
          gh run download 46112551733 --repo papaneko-ai/kyoto-keiba-ai --name kyoto-auxiliary-46112551733-20261128 --dir "$RUNNER_TEMP/impl38-cipher"
      - name: Compare exact baseline and candidate without new source HTTP
        env:
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/impl38-replay.py" <<'PY'
          import hashlib,json,os,sys,tempfile,shutil
          from pathlib import Path
          from unittest.mock import patch
          sys.path.insert(0,os.getcwd())
          from diagnostics.kyoto_nov15_encrypted_evidence import decrypt_evidence
          from diagnostics.kyoto_g03_independent_partial import verify_partial
          from diagnostics.kyoto_g03_to_g06_input_adapter import records_from_g03
          from diagnostics.kyoto_impl30_day_coverage import extract_slot,combine
          from diagnostics.kyoto_impl30_postrace_runtime import auxiliary_inputs
          repo="papaneko-ai/kyoto-keiba-ai"; day="20261128"; rid=46112551733
          temp=Path(os.environ["RUNNER_TEMP"]); cipher=temp/"impl38-cipher"
          out=Path(sys.argv[1]); report={"day":day,"run_id":rid,"artifact_id":15250785307,"revision":sys.argv[2],"source_http_requests":0}
          safe_codes={"race_spec_unverified:unverified_official_racecard_url","post_start_source_not_reusable","g03_original_not_before_start","source_link_or_filename_mismatch","source_original_missing_or_invalid","source_sha_mismatch","source_content_mismatch","missing_or_unsafe_meeting_receipt","meeting_sha_mismatch","proof_day_mismatch","invalid_meeting_receipt","wrong_race_receipt_set","unknown_receipt_schema","NOT_VERIFIED_G03","INVALID_RECEIPT","INVALID_RACE_RECEIPT","authentication_tag_failed","manifest_inconsistent_or_tampered","unsafe_archive_member","archive_member_mismatch","archive_invalid","AES256_SECRET_REQUIRED"}
          def reason(v):return v if v in safe_codes else "OTHER_REDACTED"
          def blocked(*a,**k):raise AssertionError("source_network_forbidden")
          stage="authenticate"
          try:
              with tempfile.TemporaryDirectory(prefix="impl38_plain_") as td, patch("socket.create_connection",side_effect=blocked), patch("socket.socket.connect",side_effect=blocked):
                  raw=Path(td)/"raw"
                  auth=decrypt_evidence(cipher,raw,key_hex=os.environ["ARCHIVE_KEY"],repo=repo,run_id=str(rid))
                  report["aes_authenticated"]=auth["authentication_tag_verified"] is True
                  report["ciphertext_sha256"]=hashlib.sha256((cipher/"originals.tar.gz.aesgcm").read_bytes()).hexdigest()
                  stage="receipt"
                  receipt=json.loads((raw/"receipt.json").read_text())
                  assert receipt["day"]==day and receipt["schema"]=="kyoto_impl30_auxiliary_refresh.v1"
                  report["producer_verified_races"]=[x for x in receipt.get("verified_races",[]) if type(x) is int and 1<=x<=12]
                  stage="g03"
                  g03=verify_partial(raw,expected_day=day)
                  report["g03_verified_races"]=g03["verified_race_numbers"]
                  report["g03_excluded"]=[{"race":x["race"],"reason":reason(x.get("detail",x["reason"]))} for x in g03["excluded_races"]]
                  stage="adapter"
                  rejected={}; records=records_from_g03(raw,day=day,skip_invalid_races=True,rejections=rejected)
                  report["adapter_accepted_races"]=[n for n in g03["verified_race_numbers"] if records[n] is not None]
                  report["adapter_rejections"]={k:{"error_class":v["error_class"],"reason_code":reason(v["reason_code"])} for k,v in rejected.items()}
                  stage="coverage"
                  slot=extract_slot(raw,day,rid); combined=combine(day,[slot])
                  report["coverage_races"]=[int(n) for n,v in combined["races"].items() if v["state"]=="ROSTER_VERIFIED"]
                  report["coverage_totals"]=combined["totals"]
                  stage="postrace_auxiliary"
                  run=json.loads((temp/"impl38-run.json").read_text()); artifacts=json.loads((temp/"impl38-artifacts.json").read_text())
                  def api(endpoint):
                      if "/actions/workflows/" in endpoint:return {"total_count":1,"workflow_runs":[run]}
                      if endpoint==f"repos/{repo}/actions/runs/{rid}/artifacts?per_page=100":return artifacts
                      raise AssertionError("unexpected_api")
                  def download(run_id,name,target,repository):
                      assert (run_id,name,repository)==(rid,f"kyoto-auxiliary-{rid}-{day}",repo)
                      for p in cipher.iterdir():shutil.copyfile(p,target/p.name)
                  found,seed,proof=auxiliary_inputs(day,repo,os.environ["ARCHIVE_KEY"],api=api,download=download)
                  report["postrace_roster_races"]=sorted(found)
                  report["postrace_seed_available"]=seed is not None
                  report["postrace_errors"]=[{"run_id":x.get("run_id"),"error_class":x["error_class"]} for x in proof["errors"]]
                  report["completed"]=True
          except Exception as exc:
              report["failed_stage"]=stage
              report["error_class"]=type(exc).__name__
              report["reason_code"]=reason(str(exc))
              report["completed"]=False
          out.write_text(json.dumps(report,sort_keys=True,indent=2)+"\n")
          print(json.dumps(report,sort_keys=True))
          PY
          for item in old candidate; do
            (cd "$item" && python "$RUNNER_TEMP/impl38-replay.py" "$GITHUB_WORKSPACE/replay-receipt/$item.json" "$(git rev-parse HEAD)")
          done
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("replay-receipt")
          a,b=(json.loads((p/f"{x}.json").read_text()) for x in ("old","candidate"))
          comparable=all(x.get("aes_authenticated") and x.get("completed") for x in (a,b)) and a.get("ciphertext_sha256")==b.get("ciphertext_sha256")
          observed={"same_authenticated_original":bool(comparable),"baseline_coverage":a.get("coverage_races"),"candidate_coverage":b.get("coverage_races"),"baseline_adapter_rejections":a.get("adapter_rejections"),"candidate_adapter_rejections":b.get("adapter_rejections"),"candidate_recovers_10_11":bool(comparable and {10,11}<=set(b.get("coverage_races",[])) and {10,11}<=set(b.get("postrace_roster_races",[]))),"full_acquisition_certified":False}
          (p/"comparison.json").write_text(json.dumps(observed,sort_keys=True,indent=2)+"\n")
          print(json.dumps(observed,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impl38-actual-aux-replay
          path: replay-receipt/
          retention-days: 90
          if-no-files-found: error
