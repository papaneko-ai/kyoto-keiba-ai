name: Kyoto F17 second independent eight EVO original witness audit
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths:
      - diagnostics/kyoto_f17_second_independent_eight_evo_auditor.py
      - .github/workflows/kyoto-f17-second-independent-evo-audit.yml
permissions:
  contents: read
  actions: read
jobs:
  independent-eight-evo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read original 8-EVO source and F18-bound evidence from different GitHub run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 0 --max-time 35 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/papaneko-ai/kyoto-keiba-ai/actions/artifacts/13911709766/zip" \
            -o F17_original_witness.zip
          python - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile("F17_original_witness.zip") as z:
              assert z.namelist()==["eight_evo_lab_original.json"],z.namelist()
              Path("eight_evo_lab_original.json").write_bytes(z.read("eight_evo_lab_original.json"))
          PY
      - name: Independently recompute all eight EVO outputs and reject eight corruptions
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import copy,json,os
          from pathlib import Path
          from diagnostics.kyoto_f17_second_independent_eight_evo_auditor import (
              verify,F17SecondRejected,dig)
          w=json.loads(Path("eight_evo_lab_original.json").read_text())
          rubric=Path("docs/diagnostics/kyoto_final_completion_criteria_v1.json").read_bytes()
          result=verify(w,rubric)
          rejected=0
          def block(label,data,source=rubric):
              global rejected
              try:verify(data,source)
              except F17SecondRejected:
                  rejected+=1
                  print("F17_INDEPENDENT_ATTACK_REJECTED="+label)
              else:raise AssertionError("independent auditor missed "+label)
          fake=copy.deepcopy(w)
          fake["integrated_result"]["EVO_results"]["EVO-01"]["net_research_value"]=999.
          fake["integrated_result"]["receipt_sha256"]=dig({k:v for k,v in fake["integrated_result"].items() if k!="receipt_sha256"})
          block("rehashed_EVO01_value",fake)
          fake=copy.deepcopy(w)
          fake["integrated_result"]["EVO_results"]["EVO-05"]["observed_F18_last_state"]="SHADOW_CANDIDATE_UNDER_TEST"
          fake["integrated_result"]["receipt_sha256"]=dig({k:v for k,v in fake["integrated_result"].items() if k!="receipt_sha256"})
          block("rehashed_false_drift_rollback",fake)
          fake=copy.deepcopy(w)
          fake["integrated_result"]["real_JRA_EVO_certification"]=True
          fake["integrated_result"]["receipt_sha256"]=dig({k:v for k,v in fake["integrated_result"].items() if k!="receipt_sha256"})
          block("rehashed_false_live",fake)
          fake=copy.deepcopy(w)
          fake["packet"]["evo_inputs"]["EVO-07"]["audit_plan_sha256"]="f"*64
          fake["packet"]["source_sha256"]=dig({k:v for k,v in fake["packet"].items() if k!="source_sha256"})
          block("rehashed_unbound_plan",fake)
          fake=copy.deepcopy(w);fake["ci_run_id"]="other"
          block("origin_run_changed",fake)
          block("rubric_change",w,rubric+b" ")
          fake=copy.deepcopy(w)
          fake["packet"]["research_streams"]["portfolios"][0]["net_returns_per_unit"][1]=-.8
          fake["packet"]["source_sha256"]=dig({k:v for k,v in fake["packet"].items() if k!="source_sha256"})
          block("raw_counterfactual_silent_rehash",fake)
          fake=copy.deepcopy(w)
          fake["packet"]["research_streams"]["experiments"][0]["lab_gain"]=0
          fake["packet"]["source_sha256"]=dig({k:v for k,v in fake["packet"].items() if k!="source_sha256"})
          block("raw_research_experiment_rehash",fake)
          assert rejected==8
          result["independent_ci_run_id"]=int(os.environ["GITHUB_RUN_ID"])
          result["independent_ci_head"]=os.environ["GITHUB_SHA"]
          result["destructive_forgery_cases_rejected"]=rejected
          folder=Path("F17_second_independent_audit")
          folder.mkdir()
          (folder/"F17_independent_eight_evo_receipt.json").write_text(
              json.dumps(result,ensure_ascii=False,sort_keys=True,indent=2)+"\n")
          print("F17_SECOND_INDEPENDENT_EIGHT_EVO_MATH_SOURCE_AUDIT=PASS")
          print("ACTUAL_JRA_EVO_VALIDATION=NOT_PROVEN")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kyoto-F17-second-independent-eight-EVO-verdict
          path: F17_second_independent_audit/
          retention-days: 7
          if-no-files-found: error
