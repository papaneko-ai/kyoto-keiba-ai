name: Kyoto Impl36 isolated official cushion crosscheck
on:
  push:
    branches: ['impl36-cushion-official-crosscheck-20261127']
    paths: ['.github/workflows/kyoto-impl36-cushion-official-crosscheck.yml']
permissions:
  contents: read
  actions: read
jobs:
  official-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse prior actual supplementary evidence and capture referenced official source once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime as dt, hashlib, io, json, os, pathlib, subprocess, urllib.request, urllib.error, zipfile
          root=pathlib.Path('crosscheck')
          root.mkdir()
          report={'schema':'kyoto_impl36_cushion_official_raw.v1','production_mutations':0,'official_measurement_verified':False,'requests':[]}
          def utc(): return dt.datetime.now(dt.timezone.utc).isoformat()
          def sha(b): return hashlib.sha256(b).hexdigest()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          try:
              endpoint='repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts/15172668570/zip'
              b=subprocess.check_output(['gh','api',endpoint],timeout=30)
              assert sha(b)=='89ace8ca5433fb494a8fa05b6adc2736e9cbd7852ca0773dce1b985302265e95','prior_artifact_digest'
              with zipfile.ZipFile(io.BytesIO(b)) as z:
                  assert z.testzip() is None
                  names=[n for n in z.namelist() if n.endswith('report.json')]
                  assert len(names)==1
                  prior=json.loads(z.read(names[0]))
                  rec=prior['days']['20261127']['candidates'][0]
                  assert rec['day']=='20261127' and rec['venue']=='京都' and rec['cushion_value']=='9.5'
                  links=rec['official_reference_urls']
                  assert links==['https://www.jra.go.jp/keiba/baba/_data_cushion.html']
                  (root/'prior_report.json').write_bytes(z.read(names[0]))
                  report['prior_artifact']={'id':15172668570,'sha256':sha(b),'candidate':rec}
              url=links[0]
              request={'url':url,'requested_at_utc':utc()}
              report['requests'].append(request)
              opener=urllib.request.build_opener(NoRedirect())
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'KyotoAI research evidence check/1.0','Accept':'text/html','Accept-Encoding':'identity'})
                  with opener.open(req,timeout=15) as resp:
                      request['http_status']=resp.status
                      assert resp.geturl()==url and resp.status==200
                      data=resp.read(2000001)
                      request['captured_at_utc']=utc()
                      assert 0<len(data)<=2000000
                  (root/'official_cushion.html').write_bytes(data)
                  request.update(state='RAW_SAVED',bytes=len(data),sha256=sha(data))
                  report['state']='OFFICIAL_RAW_SAVED_REQUIRES_SEMANTIC_REVIEW'
              except Exception as e:
                  request.update(state='UNAVAILABLE',error_type=type(e).__name__,error=str(e)[:250])
                  if isinstance(e,urllib.error.HTTPError):request['http_status']=e.code
                  report['state']='OFFICIAL_UNAVAILABLE'
          except Exception as e:
              report.update(state='PRIOR_EVIDENCE_UNAVAILABLE',error_type=type(e).__name__,error=str(e)[:250])
          finally:
              (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,sort_keys=True,indent=2))
              print('IMPL36_OFFICIAL_REPORT',json.dumps(report,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impl36-official-cushion-crosscheck-${{ github.run_id }}
          path: crosscheck/
          if-no-files-found: error
          retention-days: 90
