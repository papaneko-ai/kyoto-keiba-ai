name: Kyoto implementation21 migration full-source checkpoint archive
on:
  push:
    branches:
      - experiment/multisource-hybrid-20261117
    paths:
      - .github/workflows/kyoto-impl20-g06-checkpoint-archive.yml
      - diagnostics/kyoto_extensible_market_quotes.py
      - diagnostics/kyoto_g06_item_level_recovery.py
      - diagnostics/kyoto_g06_all12_capture.py
      - tests/test_kyoto_g06_item_level_recovery.py
      - .github/workflows/kyoto-g06-all12-capture-preflight.yml
      - .github/workflows/kyoto-weekend-actual-main-release-acceptance.yml
      - tests/test_kyoto_weekend_day21_day22_continuity_acceptance.py
      - docs/KYOTO_AI_IMPL21_PRE_EVENT_READINESS_MILESTONE_20261118.md
      - docs/KYOTO_AI_IMPL21_PRE_EVENT_READINESS_50PCT_MILESTONE_20261118.md
      - docs/KYOTO_AI_IMPL21_PRE_EVENT_READINESS_70PCT_MILESTONE_20261118.md
      - docs/KYOTO_AI_IMPL21_PRE_EVENT_READINESS_80PCT_MILESTONE_20261118.md
      - diagnostics/kyoto_g06_weekend_release_review.py
      - diagnostics/kyoto_shared_capture_reservation.py
      - diagnostics/kyoto_shared_capture_http_lab.py
      - tests/test_kyoto_shared_capture_reservation.py
      - tests/test_kyoto_shared_capture_http_lab.py
      - diagnostics/kyoto_g03_to_g06_input_adapter.py
      - diagnostics/kyoto_g06_nested_bundle.py
      - tests/test_kyoto_g06_full_twelve_reparse_e2e.py
      - tests/test_kyoto_g06_nested_bundle.py
      - tests/test_kyoto_g03_to_g06_input_adapter.py
      - .github/workflows/kyoto-g06-weekend-release-review.yml
      - .github/workflows/kyoto-weekend-shared-claim-preflight.yml
      - docs/KYOTO_AI_IMPL21_PRE_EVENT_80PCT_REMOTE_CLAIM_AND_APPROVAL_GATE_20261118.md
      - docs/KYOTO_AI_IMPL21_PR3_MAIN_MERGE_VERIFIED_90PCT_20261118.md
      - diagnostics/kyoto_turso_capture_claims.py
      - tests/test_kyoto_turso_capture_claims.py
      - diagnostics/kyoto_turso_claim_manual_crossrunner.py
      - tests/test_kyoto_turso_claim_manual_crossrunner.py
      - diagnostics/kyoto_weekend_remote_claim_runtime.py
      - tests/test_kyoto_weekend_remote_claim_runtime.py
      - tests/test_kyoto_g06_claim_execution.py
      - .github/workflows/kyoto-weekend-turso-manual-two-runner-proof.yml
      - .github/workflows/kyoto-weekend-turso-readonly-preflight.yml
      - diagnostics/kyoto_g06_missing_market_retry.py
      - diagnostics/kyoto_g06_downstream_intake.py
      - diagnostics/kyoto_g06_four_stage_inboxes.py
      - tests/test_kyoto_g06_live_recovery_batch.py
      - tests/test_kyoto_g06_four_stage_inboxes.py
      - tests/test_kyoto_weekend_sp_full_path_acceptance.py
      - diagnostics/kyoto_weekend_reversible_promotion.py
      - tests/test_kyoto_weekend_reversible_promotion.py
      - diagnostics/kyoto_weekend_two_job_encrypted_recovery.py
      - .github/workflows/kyoto-weekend-two-job-crypto-e2e.yml
      - tests/test_kyoto_extensible_market_quotes.py
      - tests/test_kyoto_g06_full_real_roster_pair_matrix.py
      - docs/KYOTO_AI_IMPLEMENTATION20_G06_CAPTURE_AND_MARKET_SCHEMA_CHECKPOINT_20261118.md
      - docs/KYOTO_AI_G06_ITEM_LEVEL_HYBRID_RECOVERY_REQUIRED_WORKPLAN_20261118.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact branch source and SHA manifest
        run: |
          set -euo pipefail
          git fetch origin main jra-html-diagnostic-20261105 experiment/multisource-hybrid-20261117 release-candidate/nov21-22-g06-full12-20261118 release-review/nov21-22-full12-g06-20261118
          mkdir -p package/experiment-source
          git archive HEAD | tar -xf - -C package/experiment-source
          git bundle create package/all-active-branches.bundle origin/main origin/jra-html-diagnostic-20261105 origin/experiment/multisource-hybrid-20261117 origin/release-candidate/nov21-22-g06-full12-20261118 origin/release-review/nov21-22-full12-g06-20261118
          git bundle verify package/all-active-branches.bundle
          python - <<'PY'
          import subprocess,hashlib,json,pathlib
          root=pathlib.Path("package")
          heads={b:subprocess.check_output(["git","rev-parse","origin/"+b],text=True).strip()
                 for b in ("main","jra-html-diagnostic-20261105","experiment/multisource-hybrid-20261117","release-candidate/nov21-22-g06-full12-20261118","release-review/nov21-22-full12-g06-20261118")}
          digests={}
          for p in sorted(root.rglob("*")):
              if p.is_file():digests[str(p.relative_to(root))]={"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()}
          (root/"MANIFEST.json").write_text(json.dumps({"schema":"kyoto_impl21_source_checkpoint.v1","heads":heads,"files":digests,"secrets_included":False,"turso_database_included":False},indent=2)+"\n")
          print(json.dumps({"heads":heads,"files":len(digests)}))
          PY
          python - <<'PY'
          import pathlib,zipfile,hashlib
          root=pathlib.Path("package")
          target=pathlib.Path("KYOTO_IMPLEMENTATION21_FULL_SOURCE_CHECKPOINT.zip")
          with zipfile.ZipFile(target,"w",zipfile.ZIP_DEFLATED,compresslevel=7) as z:
              for p in sorted(root.rglob("*")):
                  if p.is_file():z.write(p,arcname=str(p))
          print("ZIP_SHA256",hashlib.sha256(target.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kyoto-impl21-current-source-${{ github.run_id }}
          path: KYOTO_IMPLEMENTATION21_FULL_SOURCE_CHECKPOINT.zip
          if-no-files-found: error
          retention-days: 90
