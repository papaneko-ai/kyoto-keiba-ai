name: Kyoto Impl32 historical SP12 independent PC parity
on:
  push:
    branches: ['fix/impl32-sp12-historical-parity-20261125']
permissions:
  contents: read
  actions: read
jobs:
  historical-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: '20261122'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Retrieve prior immutable archives; no JRA HTTP
        run: |
          gh run download 44966013490 --name kyoto-nov22-real-observed-all12-encrypted-44966013490 --repo "$GITHUB_REPOSITORY" --dir pc_archive
          gh run download 45558381201 --name kyoto-impl32-historical-sp12-45558381201 --repo "$GITHUB_REPOSITORY" --dir sp_archive
      - name: Recheck originals and compare exact registered roster
        env:
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
        run: python -m diagnostics.kyoto_impl32_sp12_historical_parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-impl32-sp12-parity-${{ github.run_id }}
          path: sp12_parity/
          retention-days: 90
          if-no-files-found: error
