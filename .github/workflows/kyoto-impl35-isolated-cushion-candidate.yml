name: Impl35 isolated cushion candidate synthetic tests
on:
  push:
    branches: ['impl35-cushion-source-isolated-20261127']
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_kyoto_impl35_cushion_candidate.py' -v
