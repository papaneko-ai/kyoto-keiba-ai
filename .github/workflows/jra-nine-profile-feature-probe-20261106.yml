name: JRA nine additional source-backed pre-race profile samples
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/nine_profile_activation_20261106.txt']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Only nine distinct official profile requests with spacing
        run: python diagnostics/jra_nine_profile_feature_probe.py --out nine_profiles
      - name: Persist only structured source-derived feature results
        if: always()
        run: |
          mkdir -p docs/diagnostics/jra_nine_profiles_20261106
          cp nine_profiles/*.json docs/diagnostics/jra_nine_profiles_20261106/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/jra_nine_profiles_20261106/
          git commit -m "Record real JRA profile-form validation across nine more Kyoto races" || true
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
      - name: Short-lived original source bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-nine-horse-official-profiles-20261106
          path: nine_profiles/
          retention-days: 3
