name: Impl38 evening repaired exact saved seed proof
on:
  push:
    branches: ['repair/impl38-evening-origin-fixed-proof-20261128']
    paths: ['.github/workflows/kyoto-impl38-evening-origin-fixed-proof.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'papaneko-ai/kyoto-keiba-ai' && github.ref == 'refs/heads/repair/impl38-evening-origin-fixed-proof-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      KYOTO_TARGET_DAY: '20261128'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_POSTRACE_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'b800308169173d9e82cf93db9bf7b381e361cc76'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Bind and download exact already saved auxiliary archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p proof "$RUNNER_TEMP/aux"
          gh api 'repos/papaneko-ai/kyoto-keiba-ai/actions/runs/46117060392/artifacts?per_page=100' > "$RUNNER_TEMP/index.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"index.json").read_text())
          assert d["total_count"]==len(d["artifacts"])
          a=[x for x in d["artifacts"] if x["id"]==15252141771 and x["name"]=="kyoto-auxiliary-46117060392-20261128" and x["expired"] is False]
          assert len(a)==1 and a[0]["digest"]=="sha256:e1d2c29a26b62adde8d743b9aee77aeae8cc071830f4fb586976fba0ebc44e1f"
          PY
          gh run download 46117060392 --repo papaneko-ai/kyoto-keiba-ai --name kyoto-auxiliary-46117060392-20261128 --dir "$RUNNER_TEMP/aux"
      - name: Compare observed result menu origin against saved seed origin without source HTTP
        env:
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
        run: |
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          from urllib.parse import urlsplit
          from unittest.mock import patch
          from diagnostics.kyoto_impl30_postrace_runtime import auxiliary_inputs,recover_inputs,saved_seed_origin
          from diagnostics.kyoto_impl30_postrace_day import observed_actions,MENU
          repo="papaneko-ai/kyoto-keiba-ai";day="20261128";rid=46117060392
          src=Path(os.environ["RUNNER_TEMP"])/"aux";key=os.environ["ARCHIVE_KEY"]
          run={"id":rid,"name":"workflow_dispatch","created_at":"2026-11-28T06:32:13Z","status":"completed","event":"workflow_dispatch","head_branch":"main","head_repository":{"full_name":repo},"path":".github/workflows/kyoto-20261128-29-auxiliary-refresh.yml"}
          def api(endpoint):
              if "/runs?" in endpoint:return {"total_count":1,"workflow_runs":[run]}
              return {"total_count":1,"artifacts":[{"id":15252141771,"name":f"kyoto-auxiliary-{rid}-{day}","expired":False}]}
          def download(run_id,name,target,repository):
              assert (run_id,name,repository)==(rid,f"kyoto-auxiliary-{rid}-{day}",repo)
              for p in src.iterdir():shutil.copyfile(p,target/p.name)
          def denied(*a,**kw):raise AssertionError("network_forbidden")
          with patch("socket.socket.connect",side_effect=denied),patch("socket.create_connection",side_effect=denied):
              found,seed,proof=auxiliary_inputs(day,repo,key,api=api,download=download)
              assert set(found)=={11} and saved_seed_origin(seed,proof)=="https://www.jra.go.jp"
              with patch("diagnostics.kyoto_impl30_postrace_runtime._gh",side_effect=TimeoutError),patch("diagnostics.kyoto_impl30_postrace_runtime.auxiliary_inputs",return_value=(found,seed,proof)):
                  roster,starts,recovered,full=recover_inputs(day,repo,key,allow_missing_seed=True)
              origin=saved_seed_origin(recovered,full)
              assert origin=="https://www.jra.go.jp" and recovered==seed
              menus={market:[[x[2],urlsplit(x[3]).netloc] for x in observed_actions(recovered,path,origin=origin) if x[0]==label] for market,(path,label) in MENU.items()}
              assert all(x==[["POST","www.jra.go.jp"]] for x in menus.values())
              bad={**full,"saved_seed":{**full["saved_seed"],"origin":"https://jra.jp"}}
              assert saved_seed_origin(recovered,bad) is None
              out={"source_http_requests":0,"recovered_races":sorted(starts),"origin":origin,"menus":menus,"wrong_origin_rejected":True}
          Path("proof/report.json").write_text(json.dumps(out,sort_keys=True,indent=2)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impl38-evening-origin-fixed-proof
          path: proof/
          retention-days: 90
          if-no-files-found: error
