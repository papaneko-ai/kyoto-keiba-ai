name: Kyoto Nov14 unattended encrypted official observer launcher
on:
  schedule:
    - cron: '0 2 14 11 *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: kyoto-nov14-source-acquisition-single-coordinator
  cancel-in-progress: false
jobs:
  observed-only:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONPATH: .
      SP_INDEPENDENT_OFFICIAL_R12_URL: 'https://sp.jra.jp/JRADB/accessD.html?CNAME=sw01dde0108202605031220261114%2F5E'
      KYOTO_TARGET_DAY: '20261114'
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout fixed verified development source (never default branch code)
        uses: actions/checkout@v4
        with:
          ref: 9fa967c70238668a47cab3b06bec85f44fdef1c6
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser and crypto
        run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Verify new source acquisition and encryption regressions without JRA HTTP
        run: |
          set -euo pipefail
          KYOTO_TARGET_DAY=20261115 python -m unittest discover -s tests -p 'test_kyoto_nov15_two_original_observer.py' -q
          KYOTO_TARGET_DAY=20261115 python -m unittest discover -s tests -p 'test_kyoto_nov15_offline_race_links.py' -q
          KYOTO_TARGET_DAY=20261115 python -m unittest discover -s tests -p 'test_kyoto_nov15_encrypted_evidence.py' -q
      - name: Verify 14 November dynamic date and encrypted archive binding without HTTP
        run: |
          python - <<'PY'
          from diagnostics.kyoto_nov15_two_original_observer import DAY,BEGIN,END
          from diagnostics.kyoto_nov15_offline_race_links import DAY as LINKS_DAY
          from diagnostics.kyoto_nov15_encrypted_evidence import DAY as CRYPTO_DAY
          from datetime import datetime,timezone
          assert DAY==LINKS_DAY==CRYPTO_DAY=="20261114"
          assert BEGIN < datetime(2026,11,14,2,0,tzinfo=timezone.utc) < END
          print("NOV14_SHARED_COLLECTOR_DATE_AND_ARCHIVE_BOUND")
          PY
      - name: Verify SP observed source and parity regression without official HTTP
        run: |
          KYOTO_TARGET_DAY=20261115 python -m unittest discover -s tests -p 'test_kyoto_sp_observed_source.py' -q
      - name: Pre-HTTP date, source revision and encryption guard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nov14_unattended_evidence
          python - <<'PY'
          import os,re,subprocess
          from datetime import datetime,timezone
          from diagnostics.kyoto_nov15_two_original_observer import BEGIN,END
          now=datetime.now(timezone.utc)
          if os.environ.get("GITHUB_EVENT_NAME") not in ("schedule","workflow_dispatch"):
              raise SystemExit("NOV14_UNEXPECTED_TRIGGER_NO_HTTP")
          if now.strftime("%Y-%m-%d")!="2026-11-14" or not BEGIN <= now < END:
              raise SystemExit("NOV14_OUTSIDE_FIXED_OBSERVATION_WINDOW_NO_HTTP")
          if not re.fullmatch(r"[0-9a-fA-F]{64}",os.environ.get("ARCHIVE_KEY","")):
              raise SystemExit("NOV14_ARCHIVE_SECRET_INVALID_NO_HTTP")
          actual=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          if actual!="9fa967c70238668a47cab3b06bec85f44fdef1c6":
              raise SystemExit("NOV14_SOURCE_REVISION_MISMATCH_NO_HTTP")
          print("NOV14_UNATTENDED_OBSERVER_DATE_AND_KEY_GATES_PASS")
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf8") as e:
              e.write("NOV_SOURCE_PRECHECK_OK=1\\n")
          PY
      - name: At most EIGHT bounded original-only official PC HTTP requests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime,timezone
          from diagnostics.kyoto_nov15_two_original_observer import observe
          r=observe("nov14_work_originals",
                    now_utc=datetime.now(timezone.utc).isoformat(),allowed=True,
                    include_observed_racecard=True,
                    include_observed_odds_menu=True)
          print("NOV14_OBSERVATION_STATE="+r["state"])
          print("NOV14_ATTEMPTED_GET="+str(r["http_requests_started"]))
          import os
          if r["state"] in ("NOV15_MEETING_ORIGINALS_OBSERVED_NOT_RACECARD",
                              "NOV15_RACECARD_ORIGINAL_OBSERVED_ROSTER_UNVERIFIED"):
              with open(os.environ["GITHUB_ENV"],"a",encoding="utf8") as e:
                  e.write("PC_CAPTURE_OK=1\\n")
          else:
              print("PC_CAPTURE_FAILED_SP_WILL_STILL_BE_ATTEMPTED")
          PY
      - name: Capture independently observed official SP 12R even if PC failed
        if: ${{ always() && env.NOV_SOURCE_PRECHECK_OK == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nov14_work_originals
          python - <<'PY'
          import os,json
          from pathlib import Path
          from http.cookiejar import CookieJar
          from urllib.request import build_opener, HTTPCookieProcessor
          from diagnostics.kyoto_p1_nov14_official_one_shot_nav import NoRedirect
          from diagnostics.kyoto_sp_observed_source import capture_verified_sp_seed,compare_saved_pc_sp
          root=Path("nov14_work_originals")
          r=capture_verified_sp_seed(
              root,race_day=os.environ["KYOTO_TARGET_DAY"],
              race_number=12,source_url=os.environ["SP_INDEPENDENT_OFFICIAL_R12_URL"],
              opener=build_opener(NoRedirect(),HTTPCookieProcessor(CookieJar())))
          report=compare_saved_pc_sp(root,race_day=os.environ["KYOTO_TARGET_DAY"])
          (root/"pc_sp_comparison.json").write_text(
              json.dumps(report,ensure_ascii=False,sort_keys=True,indent=2)+"\\n",
              encoding="utf8")
          print("SP_ORIGINAL_CAPTURE_STATE="+r["state"])
          print("PC_SP_OFFLINE_COMPARE="+report["state"])
          PY
      - name: Verify and index observed race links offline before encrypted evidence sealing
        if: ${{ env.PC_CAPTURE_OK == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m diagnostics.kyoto_nov15_offline_race_links \
            --originals nov14_work_originals \
            --output nov14_work_originals/observed_race_links.json
          echo NOV14_LINK_INDEX_FROM_SAVED_ORIGINALS_ONLY=TRUE
      - name: Encrypt observation originals before artifact retention
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          from diagnostics.kyoto_nov15_encrypted_evidence import encrypt_evidence
          source=Path("nov14_work_originals")
          dest=Path("nov14_unattended_evidence")
          if not source.is_dir():
              (dest/"safe_stop.json").write_text(json.dumps({"state":"NO_CAPTURE_OR_PRE_HTTP_STOP","JRA_success":False})+"\n")
          else:
              shutil.rmtree(dest)
              encrypt_evidence(source,dest,key_hex=os.environ["ARCHIVE_KEY"],
                  repo=os.environ["GITHUB_REPOSITORY"],run_id=os.environ["GITHUB_RUN_ID"])
              shutil.rmtree(source)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-nov14-unattended-encrypted-observation-${{ github.run_id }}
          path: nov14_unattended_evidence/
          retention-days: 30
          if-no-files-found: error
