name: Kyoto Impl32 evidence-based FMEA adjudication
on:
  push:
    branches: ['fix/impl32-fmea-evidence-closure-20261125']
permissions:
  contents: read
  actions: read
jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '88ae67220260fe511e0f7743c44a2955e3206662'
          path: collector
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install PyYAML==6.0.2
      - name: Verify new adjudication and adverse cases
        run: |
          set -euo pipefail
          mkdir -p adjudication
          python -m unittest -v tests.test_kyoto_impl32_fmea_adjudication 2>&1 | tee adjudication/tests.log
      - name: Read original exact CI evidence; no acquisition or repeated prior tests
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45561532491" > adjudication/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45561532491/jobs?per_page=100" > adjudication/jobs.json
          gh run view 45561532491 --job 139026143297 --log --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/verified-ci.log"
          python -m diagnostics.kyoto_impl32_fmea_adjudication --collector collector --run adjudication/run.json --jobs adjudication/jobs.json --log "$RUNNER_TEMP/verified-ci.log" --out adjudication/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-impl32-fmea-adjudication-${{ github.run_id }}
          path: adjudication/
          retention-days: 90
          if-no-files-found: error
