name: Impl27 R08 early SP no-overlap targeted gate
on:
  pull_request:
    paths:
      - '.github/workflows/kyoto-20261121-22-two-source-production-observer.yml'
      - 'audit/impl27_r08_pc_source_barrier.py'
      - 'tests/test_kyoto_impl27_r08_source_barrier.py'
      - '.github/workflows/kyoto-impl27-r08-early-sp-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r08-early-sp-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove SP cannot start before PC capture step ends
        run: python -m unittest -v tests.test_kyoto_impl27_r08_source_barrier
      - name: Parse YAML and enforce protected schedule
        run: |
          python -m pip install 'PyYAML>=6,<7'
          python - <<'PY'
          import pathlib,yaml
          raw=pathlib.Path(".github/workflows/kyoto-20261121-22-two-source-production-observer.yml").read_text()
          doc=yaml.safe_load(raw)
          assert set(doc["jobs"])=={"pc-originals-independent","sp-originals-independent"}
          assert "needs" not in doc["jobs"]["sp-originals-independent"]
          assert doc["jobs"]["pc-originals-independent"]["timeout-minutes"]==20
          assert doc["jobs"]["sp-originals-independent"]["timeout-minutes"]==35
          assert len([s for s in raw.splitlines() if "- cron: '" in s])==8
          assert "cancel-in-progress: false" in raw
          print("R08_NO_OVERLAP_WORKFLOW_GUARD_PASS")
          PY
