name: Kyoto P1 reuse actual PC and SP roster parsers
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths:
      - 'diagnostics/jra_multi_capture_20261106.py'
      - 'diagnostics/jra_pc_sp_benchmark.py'
      - 'tests/test_jra_pc_sp_saved_reconciliation.py'
      - '.github/workflows/kyoto-p1-existing-pc-sp-reuse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-parser-reuse-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - name: Verify reused parser bytecode
        run: python -m py_compile diagnostics/jra_multi_capture_20261106.py diagnostics/jra_pc_sp_benchmark.py tests/test_jra_pc_sp_saved_reconciliation.py
      - name: Run PC/SP fallback and future-date regressions
        run: python -m unittest discover -s tests -p 'test_jra_pc_sp_saved_reconciliation.py' -v
      - name: Preserve previous PC/SP benchmark decision tests
        run: python -m unittest discover -s tests -p 'test_jra_benchmark_acceptance.py' -v
