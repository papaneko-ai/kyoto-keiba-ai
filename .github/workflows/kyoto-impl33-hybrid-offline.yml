name: Kyoto Impl33 offline hybrid recovery and partial fields
on:
  push:
    branches: ['fix/impl33-hybrid-workout-offline-final-20261126']
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Verify affected formats and partial fields
        run: |
          set -euo pipefail
          mkdir -p offline_hybrid
          git rev-parse HEAD > offline_hybrid/head.txt
          python -m unittest discover -s tests -p 'test_kyoto_impl33_hybrid_workout*.py' -v 2>&1 | tee offline_hybrid/tests.log
      - name: Restore authenticated original evidence
        run: |
          gh run download 44966013490 --name kyoto-nov22-real-observed-all12-encrypted-44966013490 --repo "$GITHUB_REPOSITORY" --dir pc_archive
          gh run download 45755248661 --name kyoto-impl33-all12-workout-45755248661 --repo "$GITHUB_REPOSITORY" --dir previous_all12
          gh run download 45755450768 --name kyoto-impl33-missing-workout-45755450768 --repo "$GITHUB_REPOSITORY" --dir missing_workout
          gh run download 45756109438 --name kyoto-impl33-hybrid-workout-45756109438 --repo "$GITHUB_REPOSITORY" --dir previous_hybrid
          gh run download 45756250180 --name kyoto-impl33-hybrid-recovery-45756250180 --repo "$GITHUB_REPOSITORY" --dir previous_recovery
      - name: Offline replay only, no source HTTP
        env:
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
        run: python -m diagnostics.kyoto_impl33_hybrid_workout_offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-impl33-offline-hybrid-${{ github.run_id }}
          path: offline_hybrid/
          retention-days: 90
          if-no-files-found: error
