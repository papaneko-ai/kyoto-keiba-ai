name: JRA existing odds capturer regression (no HTTP)
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths:
      - diagnostics/jra_one_shot_market_capture.py
      - diagnostics/jra_p1_failover_offline.py
      - tests/test_jra_p1_failover_offline.py
      - tests/test_jra_one_shot_market_capture.py
      - .github/workflows/jra-observed-odds-manual-oneshot.yml
      - .github/workflows/jra-existing-odds-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile modified acquisition and P1-FB modules before tests
        run: python -m compileall -q diagnostics/jra_one_shot_market_capture.py diagnostics/jra_p1_failover_offline.py tests/test_jra_one_shot_market_capture.py tests/test_jra_p1_failover_offline.py
      - name: Install existing parser
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Existing live-odds navigation and cutoff regression
        run: python -m unittest -v tests.test_jra_one_shot_market_capture
      - name: Reuse existing P1-FB controls, complementary sources and conflict tests
        run: python -m unittest -v tests.test_jra_p1_failover_offline
      - name: Explicitly prohibit live source certification from offline CI
        run: |
          echo "REAL_JRA_PRERACE_ODDS=NOT_VERIFIED"
          echo "FIXED_F04_ACCEPTANCE=NOT_VERIFIED"
          echo "REAL_HTTP_REQUESTS_IN_THIS_WORKFLOW=0"

      - name: Generate immutable-run offline evidence receipt (no Git push)
        if: success()
        run: |
          mkdir -p /tmp/kyoto_offline_odds_ci
          python - <<'PY'
          import json,os
          from pathlib import Path
          record={
            "schema":"jra_existing_odds_regression_ci.v2",
            "run_id":os.environ["GITHUB_RUN_ID"],
            "source_commit_sha":os.environ["GITHUB_SHA"],
            "verification_scope":"EXISTING_P1_FB_AND_ODDS_OFFLINE_REGRESSIONS_ONLY",
            "test_modules":["tests.test_jra_one_shot_market_capture",
                            "tests.test_jra_p1_failover_offline"],
            "test_steps_completed_before_receipt":True,
            "real_jra_prerace_market_verified":False,
            "real_pc_sp_failover_verified":False,
            "independent_f04_pass":False,
            "repository_mutated":False
          }
          target=Path("/tmp/kyoto_offline_odds_ci")/("run_"+os.environ["GITHUB_RUN_ID"]+".json")
          with target.open("x",encoding="utf8") as output:
              output.write(json.dumps(record,indent=2,sort_keys=True)+"\n")
          PY
      - name: Upload same-run evidence without changing development HEAD
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-offline-odds-ci-${{ github.run_id }}
          path: /tmp/kyoto_offline_odds_ci/
          if-no-files-found: error
          retention-days: 30
