name: JRA PC and SP official odds navigation proof
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/odds_nav_activation_20261106.txt']
permissions:
  contents: write
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Inspect current official odds navigation without fetching odds
        run: python diagnostics/jra_odds_nav_probe.py --out jra_odds_nav
      - name: Persist verified links and origin receipts only
        if: always()
        run: |
          mkdir -p docs/diagnostics
          cp jra_odds_nav/navigation.json docs/diagnostics/JRA_ODDS_NAV_DISCOVERY_20261106.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/JRA_ODDS_NAV_DISCOVERY_20261106.json
          git commit -m "Record JRA PC and SP real odds navigation" || true
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
      - name: Temporary source originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-official-odds-nav-original-20261106
          path: jra_odds_nav/
          retention-days: 3
