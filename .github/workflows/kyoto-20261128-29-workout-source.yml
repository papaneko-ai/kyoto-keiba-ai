name: Kyoto Nov28-29 independent workout source collection
run-name: ${{ github.event_name == 'schedule' && format('kyoto-native:{0}', github.event.schedule) || github.event_name }}
on:
  schedule:
    - cron: '30 11 27 11 *' # Nov27 20:30 JST, Nov28 preview
    - cron: '30 22 27 11 *' # Nov28 07:30 JST
    - cron: '30 11 28 11 *' # Nov28 20:30 JST, Nov29 preview
    - cron: '30 22 28 11 *' # Nov29 07:30 JST
  workflow_run:
    workflows: ['Kyoto Nov28-29 independent encrypted original collection', 'Kyoto Nov28-29 afternoon auxiliary refresh']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      race_day:
        type: choice
        required: true
        options: ['20261128', '20261129']
      confirmation:
        required: true
        description: Enter NOV28-29-WORKOUT-SOURCE-ONLY
permissions:
  contents: read
  actions: read
concurrency:
  group: kyoto-nov28-29-workout-${{ (github.event_name == 'schedule' && (github.event.schedule == '30 11 27 11 *' || github.event.schedule == '30 22 27 11 *') || github.event_name == 'workflow_dispatch' && inputs.race_day == '20261128' || github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.created_at, '2026-11-28')) && '20261128' || '20261129' }}
  cancel-in-progress: false
  queue: max
jobs:
  source-only:
    if: ${{ github.repository == 'papaneko-ai/kyoto-keiba-ai' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'NOV28-29-WORKOUT-SOURCE-ONLY') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch') && (startsWith(github.event.workflow_run.created_at, '2026-11-28') || startsWith(github.event.workflow_run.created_at, '2026-11-29')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: ${{ (github.event_name == 'schedule' && (github.event.schedule == '30 11 27 11 *' || github.event.schedule == '30 22 27 11 *') || github.event_name == 'workflow_dispatch' && inputs.race_day == '20261128' || github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.created_at, '2026-11-28')) && '20261128' || '20261129' }}
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_AUX_HTTP_APPROVED: 'NO'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'a2feebc1f718116e98c665edfd54555ffce75b7d'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install tested dependencies
        run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Capture and bind workout sources, separately from official core capture
        env:
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'a2feebc1f718116e98c665edfd54555ffce75b7d'
          python -m diagnostics.kyoto_impl33_workout_runtime
      - name: Upload encrypted source and normalized evidence
        id: upload_workout
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-workout-${{ github.run_id }}-${{ env.KYOTO_TARGET_DAY }}
          path: workout_sealed/
          retention-days: 90
          if-no-files-found: error
      - name: Retry same artifact on upload failure
        if: ${{ always() && steps.upload_workout.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-workout-${{ github.run_id }}-${{ env.KYOTO_TARGET_DAY }}
          path: workout_sealed/
          retention-days: 90
          if-no-files-found: error
          overwrite: true
