name: Kyoto P1 official batch08 six horse profiles
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/p1_batch08_activation_20261106.txt']
permissions:
  contents: write
concurrency:
  group: kyoto-p1-batch08
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Refuse if batch07 receipt and independent replay missing
        run: python -m unittest discover -s tests -p 'test_jra_p1_batches07_08_probe.py' -v
      - name: Fetch at most six genuine official sources
        run: python diagnostics/jra_p1_batches07_08_probe.py --batch batch_08 --out source_08
      - name: Save original source receipt only
        if: always()
        run: |
          mkdir -p docs/diagnostics/jra_p1_profile_batches_20261106
          if test -f source_08/batch_receipt.json; then
            cp source_08/batch_receipt.json docs/diagnostics/jra_p1_profile_batches_20261106/batch_08_receipt.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/diagnostics/jra_p1_profile_batches_20261106/batch_08_receipt.json
            git commit -m "Record Kyoto P1 official batch08 source receipts" || true
            git pull --rebase origin jra-html-diagnostic-20261105
            git push origin HEAD:jra-html-diagnostic-20261105
          fi
      - name: Store source HTML 3 days only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-p1-batch08-20261106
          path: source_08/
          retention-days: 3
