name: Kyoto P1 official batch07 six horse profiles
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/p1_batch07_activation_20261106.txt']
permissions:
  contents: write
concurrency:
  group: kyoto-p1-batch07
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Validate fixed source and expiry safety
        run: python -m unittest discover -s tests -p 'test_jra_p1_batches07_08_probe.py' -v
      - name: Fetch at most six official horse profiles
        run: python diagnostics/jra_p1_batches07_08_probe.py --batch batch_07 --out source_07
      - name: Commit only provenance receipt
        if: always()
        run: |
          mkdir -p docs/diagnostics/jra_p1_profile_batches_20261106
          if test -f source_07/batch_receipt.json; then
            cp source_07/batch_receipt.json docs/diagnostics/jra_p1_profile_batches_20261106/batch_07_receipt.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/diagnostics/jra_p1_profile_batches_20261106/batch_07_receipt.json
            git commit -m "Capture stage P1 six JRA profiles batch07 with original receipts" || true
            git pull --rebase origin jra-html-diagnostic-20261105
            git push origin HEAD:jra-html-diagnostic-20261105
          fi
      - name: Keep original bytes in short retention artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-p1-batch07-20261106
          path: source_07/
          retention-days: 3
