name: Kyoto P1-FB second SP original invalid row evidence
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/activate_p1_fb_second_sp_inspect.txt']
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jra-html-diagnostic-20261105
      - uses: actions/download-artifact@v4
        with:
          run-id: 42174986970
          name: kyoto-p1-fb-sp-second-profile-original
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original
      - run: python -m pip install beautifulsoup4
      - run: python diagnostics/jra_p1_fb_sp_second_invalid_inspect.py --artifact original --out docs/diagnostics/jra_p1_fb_offline_20261106/sp_second_invalid_evidence.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/jra_p1_fb_offline_20261106/sp_second_invalid_evidence.json
          git commit -m "Preserve exact official SP abnormal history rows for isolated root-cause repair"
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
