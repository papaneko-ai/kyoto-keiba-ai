name: Impl24 production Turso synthetic claim write proof (manual only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type IMPL24-PROVE-PRODUCTION-CLAIMS-ONLY; synthetic key only, never a race key"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: kyoto-impl24-production-claim-proof
  cancel-in-progress: false
jobs:
  prove-production-claim:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirmation == 'IMPL24-PROVE-PRODUCTION-CLAIMS-ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      KYOTO_IMPL24_PROOF_CONFIRMATION: ${{ inputs.confirmation }}
      KYOTO_SHARED_CLAIM_APPROVED_PRODUCTION_HOST: ${{ vars.KYOTO_SHARED_CLAIM_APPROVED_PRODUCTION_HOST }}
      KYOTO_SHARED_CLAIM_TURSO_URL: ${{ vars.KYOTO_SHARED_CLAIM_TURSO_URL }}
      KYOTO_SHARED_CLAIM_TURSO_TOKEN: ${{ secrets.KYOTO_SHARED_CLAIM_TURSO_TOKEN }}
    steps:
      - name: Checkout proof script at exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: impl24_proof
          persist-credentials: false
      - name: Checkout immutable proven claim runtime separately
        uses: actions/checkout@v4
        with:
          ref: ba6b62bdbb25abf5605ea3b2b2ecb7f288b1d320
          path: verified_collector
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove production-only synthetic write, competing owners, receipt, cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f impl24_proof/diagnostics/kyoto_impl24_production_claim_write_proof.py
          test -f verified_collector/diagnostics/kyoto_turso_capture_claims.py
          test -f verified_collector/diagnostics/kyoto_weekend_remote_claim_runtime.py
          cp impl24_proof/diagnostics/kyoto_impl24_production_claim_write_proof.py verified_collector/diagnostics/
          cd verified_collector
          PYTHONPATH=. python -m diagnostics.kyoto_impl24_production_claim_write_proof
