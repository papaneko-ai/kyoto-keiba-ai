name: Nov22 keep saved official R1 and preserve AES/12R source checks
on:
  push:
    branches: [fix/nov22-sp-reuse-saved-real-r1-20261122]
  pull_request:
permissions:
  contents: read
jobs:
  saved-r1-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Assert saved source re-use, HTML provenance, no wrong day/venue, no duplicate HTTP
        run: python -m unittest -v tests.test_kyoto_nov22_preserve_saved_sp_r1 tests.test_kyoto_nov22_real_sp_token_source tests.test_kyoto_sp_all12_observed_capture tests.test_kyoto_weekend_sp_discovery
      - name: Existing source-only AES/UTC acceptance
        run: python -m unittest -v tests.test_kyoto_weekend_postflight tests.test_kyoto_nov15_encrypted_evidence
