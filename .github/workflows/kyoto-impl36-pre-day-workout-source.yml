name: Kyoto Impl36 pre-day workout source evidence
on:
  push:
    branches: ['impl36-p05-pre-day-source-20261127']
    paths: ['.github/workflows/kyoto-impl36-pre-day-workout-source.yml']
permissions:
  contents: read
  actions: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: '20261128'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_AUX_HTTP_APPROVED: 'NO'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'a2feebc1f718116e98c665edfd54555ffce75b7d'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Capture newly available pre-day source and reuse retained complete previews
        env:
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'a2feebc1f718116e98c665edfd54555ffce75b7d'
          test "$(TZ=Asia/Tokyo date +%Y%m%d)" = 20261127
          python -m diagnostics.kyoto_impl33_workout_runtime
      - name: Report non-identifying raw coverage counts only
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('workout_sealed/receipt.json')
          if p.is_file():
              r=json.loads(p.read_text())
              print('PREDAY_COUNTS='+json.dumps({'day':r['day'],'races_with_primary':sorted({x['race'] for x in r['snapshots'] if x['kind']=='PRIMARY'}),'snapshots':len(r['snapshots']),'source_errors':r['source_errors'],'source_requests':r.get('source_requests'),'jra_requests':r['jra_requests'],'production_coverage_authorized':r['production_coverage_authorized']}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impl36-preday-workout-${{ github.run_id }}-20261128
          path: workout_sealed/
          if-no-files-found: error
          retention-days: 90
