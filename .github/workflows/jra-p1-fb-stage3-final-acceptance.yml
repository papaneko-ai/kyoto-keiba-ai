name: Kyoto P1-FB Stage3 final two SP SHA originals regression
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/activate_p1_fb_stage3_final.txt']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jra-html-diagnostic-20261105
      - uses: actions/download-artifact@v4
        with:
          run-id: 42173462385
          name: kyoto-p1-fb-sp-profile-original
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: first_original
      - uses: actions/download-artifact@v4
        with:
          run-id: 42174986970
          name: kyoto-p1-fb-sp-second-profile-original
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: second_original
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Validate parsers and independent source-choice safety, no HTTP
        run: |
          python -m compileall -q diagnostics/jra_p1_sp_profile_offline.py diagnostics/jra_p1_fb_request_budget_policy.py
          python -m unittest discover -s tests -p 'test_jra_p1_fb_sp_special_regressions.py' -v
          python -m unittest discover -s tests -p 'test_jra_p1_fb_request_budget_policy.py' -v
          python -m unittest discover -s tests -p 'test_jra_p1_failover_offline.py' -v
      - name: Parse real first SP and compare to PC 210 cells
        run: python diagnostics/jra_p1_fb_pc_sp_row_parity.py --artifact first_original --out docs/diagnostics/jra_p1_fb_offline_20261106/sp_first_final_identity_parity.json
      - name: Parse real second SP with local races and exact identity
        run: python diagnostics/jra_p1_fb_second_sp_replay_fixed.py --artifact second_original --out docs/diagnostics/jra_p1_fb_offline_20261106/sp_second_final_identity_replay.json
      - name: Save final fail-closed stage3 evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/jra_p1_fb_offline_20261106/sp_first_final_identity_parity.json docs/diagnostics/jra_p1_fb_offline_20261106/sp_second_final_identity_replay.json
          git commit -m "Verify exact SP horse identity and both real original parsers with offline guards"
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
