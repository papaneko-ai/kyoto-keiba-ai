name: Kyoto Impl32 P05 targeted offline verification
on:
  push:
    branches: ['fix/impl32-p05-track-reserve-20261125']
permissions:
  contents: read
jobs:
  p05-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: '20261121'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_AUX_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install same locked libraries as Impl31 preflight
        run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Exact SHA and affected auxiliary source tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p impl32_p05
          git rev-parse HEAD | tee impl32_p05/head.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git hash-object diagnostics/kyoto_impl30_auxiliary_refresh.py | tee impl32_p05/source_blob.txt
          test "$(cat impl32_p05/source_blob.txt)" = "1e6985a9a21effd0b3968e1f1dcf28d8cc32b51e"
          python -m unittest -v tests.test_kyoto_impl32_auxiliary_track_reserve tests.test_kyoto_impl31_auxiliary_priority tests.test_kyoto_impl31_independent_track_union tests.test_kyoto_g05_official_track tests.test_kyoto_g05_conditions tests.test_kyoto_impl30_day_coverage 2>&1 | tee impl32_p05/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-impl32-p05-offline-${{ github.run_id }}
          path: impl32_p05/
          retention-days: 30
          if-no-files-found: error
