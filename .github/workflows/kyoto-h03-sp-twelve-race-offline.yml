name: Kyoto H03 SP all-race offline regression
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/multisource-hybrid-20261117
    paths:
      - diagnostics/kyoto_h03_all_races_sp.py
      - tests/test_kyoto_h03_all_races_sp.py
      - .github/workflows/kyoto-h03-sp-twelve-race-offline.yml
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline parser dependency
        run: python -m pip install beautifulsoup4
      - name: Test H03 and preceding H02 SP adapter (zero HTTP)
        run: |
          mkdir -p h03_proof
          python -m unittest -v tests.test_kyoto_h03_all_races_sp tests.test_kyoto_hybrid_multi_source tests.test_kyoto_sp_observed_source 2>&1 | tee h03_proof/test_log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-h03-sp-offline-${{ github.run_id }}
          path: h03_proof/
