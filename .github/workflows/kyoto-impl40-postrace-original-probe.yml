name: Kyoto Impl40 exact evening original probe
on:
  push:
    branches: ['repair/impl40-postrace-original-probe-20261128']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: ${{ github.repository == 'papaneko-ai/kyoto-keiba-ai' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      KYOTO_TARGET_DAY: '20261128'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_POSTRACE_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Authenticate and inspect only exact saved source
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
        run: python -m diagnostics.kyoto_impl40_postrace_original_probe
