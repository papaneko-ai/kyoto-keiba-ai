name: Kyoto Impl36 replay alternate source link context
on:
  push:
    branches: ['impl36-p05-alternate-source-20261127']
    paths: ['.github/workflows/kyoto-impl36-alternate-workout-replay.yml']
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'a2feebc1f718116e98c665edfd54555ffce75b7d'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Reopen archived raw index, identify contextual race links
        env:
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
        run: |
          set -euo pipefail
          mkdir -p input replay
          gh run download 45947862176 --repo "$GITHUB_REPOSITORY" --name impl36-alternate-workout-45947862176 --dir input
          python - <<'PY'
          import json,os,pathlib,hashlib,re
          from urllib.parse import urljoin,urlsplit
          from bs4 import BeautifulSoup
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          p=pathlib.Path('input')
          r=json.loads((p/'receipt.json').read_text())
          assert r['day']=='20261128' and r['run_id']=='45947862176'
          v=r['observations'][0];b=(p/'index.aesgcm').read_bytes()
          aad=b'kyoto-alt-workout-v1|45947862176|index.aesgcm'
          assert v['aad'].encode()==aad and hashlib.sha256(b).hexdigest()==v['ciphertext_sha256']
          raw=AESGCM(bytes.fromhex(os.environ['ARCHIVE_KEY'])).decrypt(b[:12],b[12:],aad)
          assert hashlib.sha256(raw).hexdigest()==v['source_sha256']
          s=BeautifulSoup(raw,'html.parser')
          candidates={};shapes={};link_rows=0
          for tr in s.find_all('tr'):
              cells=[' '.join(c.stripped_strings) for c in tr.find_all(['td','th'],recursive=False)]
              if '京都' not in cells:continue
              races={int(m.group(1)) for c in cells if (m:=re.fullmatch(r'(1[0-2]|[1-9])\s*(?:R|レース)',c))}
              if len(races)!=1:continue
              n=next(iter(races))
              for a in tr.find_all('a',href=True):
                  u=urljoin(v['url'],a['href']);q=urlsplit(u)
                  if q.scheme!='https' or q.netloc!='www.keiba-analysis.jp' or q.fragment:continue
                  label=' '.join(a.stripped_strings)
                  # Do not infer a race URL from a horse or sire link.
                  if re.fullmatch(r'(1[0-2]|[1-9])\s*(?:R|レース)',label) or label=='京都':
                      candidates.setdefault(str(n),set()).add(u)
                      link_rows+=1
                  shape=re.sub(r'[0-9]+','{n}',q.path)
                  shapes[shape]=shapes.get(shape,0)+1
          out={'schema':'kyoto_impl36_alternate_context.v1','raw_sha256':v['source_sha256'],'race_candidates':{k:sorted(v) for k,v in candidates.items()},'context_link_count':link_rows,'path_shapes':shapes,'jra_requests':0,'source_http_requests':0,'full_workout_records_proved':False}
          pathlib.Path('replay/report.json').write_text(json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2))
          print('CONTEXT_REPLAY='+json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: impl36-alternate-context-${{ github.run_id }}
          path: replay/
          retention-days: 90
