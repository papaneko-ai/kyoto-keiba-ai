name: Nov22 remaining races actual JRA odds original source capture
on:
  push:
    branches: [capture/nov22-remaining-races-real-market-originals-20261122]
    paths:
      - 'diagnostics/kyoto_nov22_market_followup_actual.py'
      - '.github/workflows/kyoto-nov22-real-market-followup.yml'
permissions:
  contents: read
  actions: read
jobs:
  live-observed-source-odds-menu-and-paired-market:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      KYOTO_JRA_ARCHIVE_AES256_HEX: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing parsing and AES-GCM
        run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Download exact archived JRA all12 originals, never generate race links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nov22_all12_source
          gh run download 44966013490 --repo "$GITHUB_REPOSITORY" --name kyoto-nov22-real-observed-all12-encrypted-44966013490 --dir nov22_all12_source
      - name: Execute actual JRA odds source capture for remaining races and seal original bytes
        shell: bash
        run: |
          set -euo pipefail
          python -m diagnostics.kyoto_nov22_market_followup_actual
      - name: Always retain ciphertext SHA/UTC and truthful failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-nov22-actual-market-originals-${{ github.run_id }}
          path: nov22_market_followup/sealed/
          retention-days: 30
          if-no-files-found: warn
