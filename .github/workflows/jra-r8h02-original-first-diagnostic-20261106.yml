name: Kyoto P1 R8 horse02 one-shot original-first diagnosis
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/activation_r8h02_diagnostic_20261106.txt']
permissions:
  contents: write
concurrency:
  group: kyoto-p1-r8h02-one-shot
  cancel-in-progress: false
jobs:
  diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jra-html-diagnostic-20261105
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Offline regression of one-shot and no-HTTP cutoff
        run: python -m unittest tests/test_jra_batch13_r8h02_diagnostic.py
      - name: Single approved diagnosis GET, original saved BEFORE parsing
        run: python diagnostics/jra_batch13_r8h02_one_shot_diagnostic.py --out r8h02_incident_original
      - name: Preserve diagnosis receipt in development branch
        if: always()
        run: |
          if test -f r8h02_incident_original/diagnostic_receipt.json; then
            mkdir -p docs/diagnostics/jra_p1_r8h02_diagnosis_20261106
            cp r8h02_incident_original/diagnostic_receipt.json docs/diagnostics/jra_p1_r8h02_diagnosis_20261106/receipt.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/diagnostics/jra_p1_r8h02_diagnosis_20261106/receipt.json
            git commit -m "Record r8h02 one-shot JRA incident evidence and invalid row reasons"
            git pull --rebase origin jra-html-diagnostic-20261105
            git push origin HEAD:jra-html-diagnostic-20261105
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-r8h02-original-first-diagnostic
          path: r8h02_incident_original/
          retention-days: 3
