name: Nov22 inspect five mismatched horse identity and track table exact originals
on:
  push:
    branches: [fix/nov22-remaining-full-acquisition-evidence-20261122]
    paths:
      - 'diagnostics/kyoto_nov22_five_horses_track_exact_layout.py'
      - '.github/workflows/kyoto-nov22-five-horses-track-exact-layout.yml'
permissions:
  contents: read
  actions: read
jobs:
  exact-official-layouts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      KYOTO_JRA_ARCHIVE_AES256_HEX: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: 2dce4f5fa9d0ce48e460a95664fe3207c7f95ba6
          path: frozen
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Reopen actual independently authenticated horse and ground originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p real_source/profile real_source/track nov22_all12_source
          gh run download 44984067104 -R "$GITHUB_REPOSITORY" -n kyoto-nov22-observed-horse-profiles-44984067104 -D real_source/profile
          gh run download 44984408658 -R "$GITHUB_REPOSITORY" -n kyoto-nov22-real-ground-official-source-44984408658 -D real_source/track
          gh run download 44966013490 -R "$GITHUB_REPOSITORY" -n kyoto-nov22-real-observed-all12-encrypted-44966013490 -D nov22_all12_source
      - name: Extract exact source alias, malformed history, track structure without JRA HTTP
        shell: bash
        run: |
          set -euo pipefail
          for f in jra_prior_form_offline.py kyoto_g04_all_horse_profiles.py kyoto_g05_official_track.py; do
            cp "frozen/diagnostics/$f" "diagnostics/$f"
          done
          python -m diagnostics.kyoto_nov22_five_horses_track_exact_layout
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nov22-five-horse-track-exact-layout-${{ github.run_id }}
          path: actual_layout_forensic/
          if-no-files-found: warn
          retention-days: 90
