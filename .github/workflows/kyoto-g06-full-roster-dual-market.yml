name: Kyoto G06 12R 148-horse full paired-market readiness
on:
  push:
    branches:
      - experiment/multisource-hybrid-20261117
    paths:
      - tests/test_kyoto_g06_full_real_roster_pair_matrix.py
      - .github/workflows/kyoto-g06-full-roster-dual-market.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4 cryptography
      - name: Test 12R real runner shapes with both full synthetic odds markets
        run: |
          set -o pipefail
          mkdir -p g06_full_roster_proof
          python -m unittest -v tests.test_kyoto_g06_full_real_roster_pair_matrix tests.test_kyoto_g06_roster_aware_bracket tests.test_kyoto_g06_twelve_race_dual_market_gate tests.test_jra_market_source_chain 2>&1 | tee g06_full_roster_proof/tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-g06-148runner-bothmarkets-${{ github.run_id }}
          path: g06_full_roster_proof/
          if-no-files-found: error
