name: Kyoto Impl30 deployment contract offline
on:
  push:
    branches: ['fix/impl30-nov28-29-production-integration-20261124']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kyoto-20261128-29-*.yml'
      - '.github/workflows/kyoto-impl30-*.yml'
      - 'diagnostics/kyoto_impl30_collector_selection.py'
      - 'tests/test_kyoto_impl30_production_workflows.py'
      - 'tests/test_kyoto_impl30_collector_selection.py'
permissions:
  contents: read
jobs:
  offline-deployment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Verify exact candidate scheduler and selection without JRA HTTP
        run: |
          set -euo pipefail
          mkdir -p deployment_contract
          git rev-parse HEAD | tee deployment_contract/head.txt
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m unittest -v tests.test_kyoto_impl30_production_workflows tests.test_kyoto_impl30_collector_selection 2>&1 | tee deployment_contract/tests.log
      - name: Preserve deployment contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-impl30-deployment-contract-${{ github.run_id }}
          path: deployment_contract/
          retention-days: 30
          if-no-files-found: error
