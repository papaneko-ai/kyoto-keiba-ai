name: Nov22 exact observed JRA official result and payouts menu live capture
on:
  push:
    branches: [fix/nov22-remaining-full-acquisition-evidence-20261122]
    paths:
      - 'diagnostics/kyoto_nov22_actual_postrace_menu_capture.py'
      - '.github/workflows/kyoto-nov22-actual-postrace-menu-capture.yml'
permissions:
  contents: read
  actions: read
jobs:
  actual-JRA-postrace-menus:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      KYOTO_JRA_ARCHIVE_AES256_HEX: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Prior exact source and original SHA receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nov22_all12_source
          gh run download 44966013490 -R "$GITHUB_REPOSITORY" -n kyoto-nov22-real-observed-all12-encrypted-44966013490 -D nov22_all12_source
      - name: Observe two exact JRA menu actions and AES-seal actual official response
        shell: bash
        run: |
          set -euo pipefail
          python -m diagnostics.kyoto_nov22_actual_postrace_menu_capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-nov22-actual-postrace-menu-originals-${{ github.run_id }}
          path: result_menus/sealed/
          retention-days: 90
          if-no-files-found: warn
