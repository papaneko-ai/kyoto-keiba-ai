name: Kyoto Nov28-29 postrace result and payout evidence
run-name: ${{ github.event_name == 'schedule' && format('kyoto-native:{0}', github.event.schedule) || github.event_name }}
on:
  workflow_dispatch:
    inputs:
      race_day:
        type: choice
        required: true
        options: ['20261128', '20261129']
      confirmation:
        description: Enter NOV28-29-POSTRACE-SOURCE-ONLY
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('kyoto-20261128-29-source-{0}', inputs.race_day == '20261128' && '20261128' || '20261129') || format('kyoto-native-isolated-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max
jobs:
  postrace-source-evidence:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirmation == 'NOV28-29-POSTRACE-SOURCE-ONLY') }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: ${{ (github.event.schedule == '0 10 28 11 *' || github.event.schedule == '0 13 28 11 *' || inputs.race_day == '20261128') && '20261128' || '20261129' }}
      KYOTO_POSTRACE_HTTP_APPROVED: 'YES'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'b800308169173d9e82cf93db9bf7b381e361cc76'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install the same exact dependency versions as tested collector
        run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Verify fixed source before postrace original collection
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'b800308169173d9e82cf93db9bf7b381e361cc76'
          python -m diagnostics.kyoto_impl30_postrace_runtime --day "$KYOTO_TARGET_DAY" --out postrace_sealed
      - name: Upload encrypted original sources and revision history only
        id: upload_postrace_primary
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-postrace-${{ github.run_id }}-${{ env.KYOTO_TARGET_DAY }}
          path: postrace_sealed/
          retention-days: 90
          if-no-files-found: error
      - name: Retry same encrypted postrace artifact after first upload failure
        if: ${{ always() && steps.upload_postrace_primary.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-postrace-${{ github.run_id }}-${{ env.KYOTO_TARGET_DAY }}
          path: postrace_sealed/
          retention-days: 90
          if-no-files-found: error
          overwrite: true
