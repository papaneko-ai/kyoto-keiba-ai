name: Kyoto AI objective progress and continuity gate
on:
  push:
    branches: [jra-html-diagnostic-20261105]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  existing-capability-first:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing PC/SP parser dependency
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Validate existing feature inventory and change intent
        run: python -m diagnostics.kyoto_development_preflight --root .
      - name: Regression tests for historical source and duplicates
        run: python -m unittest discover -s tests -p 'test_kyoto_development_preflight.py' -v
      - name: Verify historical evidence and recovery artifact
        run: |
          gh api 'repos/papaneko-ai/kyoto-keiba-ai/actions/artifacts/13482994623' > /tmp/kyoto_recovery_metadata.json
          python -m diagnostics.kyoto_resume_gate --root . --artifact-json /tmp/kyoto_recovery_metadata.json --out /tmp/kyoto_resume.json
      - name: Test progress scorer and destructive regressions
        run: python -m unittest discover -s tests -p 'test_kyoto_progress_metrics.py' -v
      - name: Verify real manual market and ratio Streamlit controls
        run: |
          python -m pip install 'streamlit>=1.37,<2'
          python -m unittest discover -s tests -p 'test_p5_manual_allocation.py' -v
          python -m unittest discover -s tests -p 'test_p8_mobile_readonly_planner.py' -v
          python -m unittest discover -s tests -p 'test_p8_official_source_status.py' -v
          python -m unittest discover -s tests -p 'test_p4_research_market_risk.py' -v
          python -m unittest discover -s tests -p 'test_p4_temporal_market_controls.py' -v
          python -m unittest discover -s tests -p 'test_p4_source_bound_model_ev_research.py' -v
          python -m unittest discover -s tests -p 'test_p3_same_cutoff_market_model_bridge.py' -v
          python -m unittest discover -s tests -p 'test_p3_full_16_runner_same_cutoff_research.py' -v
          python -m unittest discover -s tests -p 'test_p5_source_bound_race_ranking_lab.py' -v
          python -m unittest discover -s tests -p 'test_p5_bounded_risk_capital_lab.py' -v
          python -m unittest discover -s tests -p 'test_p8_uploaded_archive_replay_lab.py' -v
          python -m unittest discover -s tests -p 'test_p8_cloud_release_gate.py' -v
          python -m unittest discover -s tests -p 'test_p6_source_bound_ranked_freeze_lab.py' -v
          python -m unittest discover -s tests -p 'test_p5_p6_risk_allocated_freeze_bridge.py' -v
          python -m unittest discover -s tests -p 'test_p5_p6_risk_final_settlement_e2e.py' -v
          python -m unittest discover -s tests -p 'test_f12_p6_manual_allocation_freeze_settlement_bridge.py' -v
          python -m unittest discover -s tests -p 'test_p6_final_html_settlement_lab.py' -v
          python -m unittest discover -s tests -p 'test_p1_authorized_pc_sp_fallback.py' -v
          python -m unittest discover -s tests -p 'test_p1_atomic_dual_market_handoff.py' -v
          python -m unittest discover -s tests -p 'test_p7_approved_evo_capability_screen.py' -v
          python -m unittest discover -s tests -p 'test_p7_hybrid_model_registry.py' -v
          python -m unittest discover -s tests -p 'test_kyoto_nov14_fault_matrix_preflight.py' -v
          python -m unittest discover -s tests -p 'test_kyoto_nov14_nov15_second_day_handoff.py' -v
          python -m unittest discover -s tests -p 'test_kyoto_nov15_workflow_safety.py' -v
          python -m unittest discover -s tests -p 'test_kyoto_nov15_readiness_check.py' -v
          python -m unittest discover -s tests -p 'test_kyoto_nov15_capture_acceptance.py' -v
          python -m unittest discover -s tests -p 'test_p3_hybrid_prediction_contract.py' -v
      - name: Reject research-CI inflation of operational completion
        run: |
          python -m unittest discover -s tests -p 'test_kyoto_operational_readiness.py' -v
          python -m diagnostics.kyoto_operational_readiness --out /tmp/kyoto-operational.json
      - name: Reuse existing three-original intake and PC/SP parser regressions
        run: |
          python -m unittest discover -s tests -p 'test_jra_p1_offline_handoff.py' -v
          python -m unittest discover -s tests -p 'test_p1_three_original_dual_intake.py' -v
          python -m unittest discover -s tests -p 'test_p1_three_original_content_binding.py' -v
          python -m unittest discover -s tests -p 'test_p1_operator_original_handoff.py' -v
          python -m unittest discover -s tests -p 'test_jra_one_shot_market_capture.py' -v
          python -m unittest discover -s tests -p 'test_p2_three_way_discovery.py' -v
          python -m unittest discover -s tests -p 'test_p3_research_calibration.py' -v
          python -m unittest discover -s tests -p 'test_p6_fixture_temporal_aggregate.py' -v
          python -m unittest discover -s tests -p 'test_p7_evo_candidate_falsification.py' -v
          python -m unittest discover -s tests -p 'test_p7_guarded_research_rollback.py' -v
          python -m unittest discover -s tests -p 'test_p7_independent_holdout_research.py' -v
          python -m unittest discover -s tests -p 'test_p7_independent_research_certification.py' -v
          python -m unittest discover -s tests -p 'test_rg02_dual_market_integrated_lab.py' -v
          python -m unittest discover -s tests -p 'test_rg01_prediction_freeze_settlement_lab.py' -v
          python -m unittest discover -s tests -p 'test_rg03_temporal_journal_walkforward_lab.py' -v
          python -m unittest discover -s tests -p 'test_rg04_integrated_evolution_cycle_lab.py' -v
          python -m unittest discover -s tests -p 'test_rg05_original_market_safe_pipeline_lab.py' -v
          python -m unittest discover -s tests -p 'test_rg06_repeatable_mobile_e2e_lab.py' -v
          python -m unittest discover -s tests -p 'test_jra_pc_sp_saved_reconciliation.py' -v
      - name: RG06 responsive mobile-width Chromium control acceptance
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install chromium
          python tests/rg06_mobile_browser_check.py
      - name: P8-04 local shadow deployment and restart acceptance (not public Cloud)
        run: |
          KYOTO_P8_04_OUT=/tmp/kyoto-p8-local-deployment-restart.json python tests/p8_local_deployment_restart_check.py
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('/tmp/kyoto-p8-local-deployment-restart.json').read_text())
          assert receipt['restart_cycles']==2
          assert receipt['same_controls_on_restart']
          assert not receipt['actual_public_url_deployed_verified']
          assert not receipt['actual_cloud_cost_zero_verified']
          assert not receipt['live_jra_market_verified']
          assert not receipt['actual_purchase_authorized']
          print('P8_04_LOCAL_ONLY_CI_GATE_PASS=TRUE')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kyoto-ai-p8-04-local-deploy-restart-receipt
          path: /tmp/kyoto-p8-local-deployment-restart.json
          if-no-files-found: error
          retention-days: 90
      - name: Calculate objective P1-P8 score with real GitHub CI evidence
        run: |
          python -m diagnostics.kyoto_progress_metrics --root . --out /tmp/kyoto-progress.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads(Path('/tmp/kyoto_resume.json').read_text(encoding='utf-8'))
          assert result['decision']=='RESUME_EVIDENCE_ACCEPTED_NOT_LIVE_AUTHORIZATION'
          score=json.loads(Path('/tmp/kyoto-progress.json').read_text(encoding='utf-8'))
          assert score['source_commit']==os.environ['GITHUB_SHA']
          assert score['score_percent']==sum(p['earned'] for p in score['phases'].values())
          assert score['total_points']==100 and score['score_percent']<=100
          print('KYOTO_FIXED_RUBRIC_SHA256='+score['rubric_sha256'])
          print('CONTINUITY_AND_PROGRESS_PASS_AT_SHA='+os.environ['GITHUB_SHA'])
          PY
      - name: Measure separately fixed research-graduation prerequisites
        run: |
          python -m unittest discover -s tests -p 'test_kyoto_research_graduation.py' -v
          python -m diagnostics.kyoto_research_graduation --root . --progress /tmp/kyoto-progress.json --out /tmp/kyoto-graduation.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/kyoto-graduation.json').read_text(encoding='utf-8'))
          assert x['graduation_total_conditions']==12
          assert x['graduation_passed_conditions']==sum(int(r['component_pass'])+int(r['integration_pass']) for r in x['areas'])
          assert x['graduation_percent']==round(x['graduation_passed_conditions']*100/12,1)
          assert x['graduation_eligible']==(x['graduation_passed_conditions']==12)
          print('GRADUATION_PROOF_SEPARATE_FROM_P1_P8=TRUE')
          PY
      - name: Independently account for research to live transition
        run: |
          python -m unittest discover -s tests -p 'test_kyoto_research_to_live_bridge.py' -v
          python -m diagnostics.kyoto_research_to_live_bridge --root . --graduation /tmp/kyoto-graduation.json --operational /tmp/kyoto-operational.json --out /tmp/kyoto-live-crosswalk.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/kyoto-live-crosswalk.json').read_text(encoding='utf8'))
          assert x['total_areas']==6 and not x['real_purchase_authorized']
          assert x['operational_verified_points']==0
          assert x['research_to_live_verified_areas']==0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kyoto-ai-research-to-live-crosswalk
          path: /tmp/kyoto-live-crosswalk.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: kyoto-ai-research-graduation-report
          path: /tmp/kyoto-graduation.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: kyoto-ai-operational-readiness-report
          path: /tmp/kyoto-operational.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: kyoto-ai-progress-report
          path: /tmp/kyoto-progress.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: kyoto-ai-always-run-continuity-receipt
          path: /tmp/kyoto_resume.json
          if-no-files-found: error
          retention-days: 30
