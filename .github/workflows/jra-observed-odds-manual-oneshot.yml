name: JRA observed PC-SP prereace odds one-shot (manual diagnostic only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type ONE-SHOT-READ-ONLY after checking actual JRA page and usage conditions'
        required: true
        default: 'NO'
      hybrid:
        description: 'Use existing PC/SP one-fallback if primary has source failure'
        type: boolean
        default: true
      independent_crosscheck:
        description: 'Explicitly observe both independent channels; no cross-time market price merging'
        type: boolean
        default: false
      auto_repair_broken_pc_link:
        description: 'Single PC mode only: on 404/410 rediscover official racecard, verify roster, or safe-stop'
        type: boolean
        default: false
      channel:
        description: 'AUTO uses already-verified SP candidate benchmark; SP/PC override'
        required: true
        type: choice
        options: [AUTO, SP, PC]
        default: AUTO
      spec_path:
        description: 'Previously verified race identity + observed PC/SP official URLs (inside docs/diagnostics/)'
        required: true
      roster_path:
        description: 'Current official numbered roster snapshot (inside docs/diagnostics/)'
        required: true
      snapshot_path:
        description: 'Optional independently checked P1 three-original snapshot JSON; if present, run existing immutable offline handoff after capture'
        required: false
        default: ''
      verified_start_utc:
        description: 'Race official start time UTC, e.g. 2026-11-14T06:45:00Z (verify first)'
        required: true
permissions:
  contents: read
concurrency:
  group: kyoto-official-odds-observed-manual-one-shot
  cancel-in-progress: false
jobs:
  verified-one-shot:
    if: github.event.inputs.confirmation == 'ONE-SHOT-READ-ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
      OBSERVED_SPEC: ${{ inputs.spec_path }}
      OBSERVED_ROSTER: ${{ inputs.roster_path }}
      THREE_ORIGINAL_SNAPSHOT: ${{ inputs.snapshot_path }}
      OBSERVED_START: ${{ inputs.verified_start_utc }}
      OBSERVED_CHANNEL: ${{ inputs.channel }}
      HYBRID: ${{ inputs.hybrid }}
      CROSSCHECK: ${{ inputs.independent_crosscheck }}
      REPAIR_PC: ${{ inputs.auto_repair_broken_pc_link }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the existing source parser
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Offline evidence gates before any network
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          from diagnostics.jra_one_shot_market_capture import ObservedRaceSpec
          import json
          for key in ("OBSERVED_SPEC","OBSERVED_ROSTER"):
              value=os.environ[key]
              if not re.fullmatch(r"docs/diagnostics/[A-Za-z0-9_./-]+\.json",value) or ".." in value.split("/"):
                  raise SystemExit("VERIFIED_REPOSITORY_EVIDENCE_PATH_REQUIRED")
              if not Path(value).is_file():
                  raise SystemExit("EVIDENCE_FILE_NOT_FOUND")
          channels=("PC","SP") if os.environ["HYBRID"]=="true" else (os.environ["OBSERVED_CHANNEL"],)
          spec=ObservedRaceSpec(**json.loads(Path(os.environ["OBSERVED_SPEC"]).read_text(encoding="utf8"))).validate(require_channels=channels)
          if not re.fullmatch(r"20\d{2}-\d\d-\d\dT\d\d:\d\d:\d\dZ",os.environ["OBSERVED_START"]):
              raise SystemExit("VERIFIED_START_UTC_REQUIRED")
          print("OFFLINE_SOURCE_SPEC_VALIDATED_FOR_DIAGNOSTIC_ONLY")
          print("NO_JRA_REQUESTS_SO_FAR=TRUE")
          PY
      - name: One-shot JRA original-market diagnostic (never submit wagers)
        run: |
          if [ "$HYBRID" = "true" ]; then
            if [ "$REPAIR_PC" = "true" ]; then
              echo "::error title=Invalid repair mode::PC repair requires single-channel PC mode"
              exit 1
            fi
            CROSSCHECK_ARG=""
            if [ "$CROSSCHECK" = "true" ]; then CROSSCHECK_ARG="--independent-crosscheck"; fi
            python diagnostics/jra_one_shot_market_capture.py \
              --hybrid \
              ${CROSSCHECK_ARG:+$CROSSCHECK_ARG} \
              --channel "$OBSERVED_CHANNEL" \
              --verified-start-utc "$OBSERVED_START" \
              --active-roster-json "$OBSERVED_ROSTER" \
              --race-spec-json "$OBSERVED_SPEC" \
              --authorized-live-http \
              --out jra_odds_observed_one_shot
          else
            REPAIR_ARG=""
            if [ "$REPAIR_PC" = "true" ]; then
              if [ "$OBSERVED_CHANNEL" != "PC" ]; then
                echo "::error title=Invalid repair channel::PC link repair requires PC selection"
                exit 1
              fi
              REPAIR_ARG="--auto-repair-broken-pc-link"
            fi
            python diagnostics/jra_one_shot_market_capture.py \
              ${REPAIR_ARG:+$REPAIR_ARG} \
              --channel "$OBSERVED_CHANNEL" \
              --verified-start-utc "$OBSERVED_START" \
              --active-roster-json "$OBSERVED_ROSTER" \
              --race-spec-json "$OBSERVED_SPEC" \
              --authorized-live-http \
              --out jra_odds_observed_one_shot
          fi
      - name: Report link recovery status with GitHub Actions annotations
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          outputs=list(Path("jra_odds_observed_one_shot").glob("**/receipt.json"))
          for p in outputs:
              try:
                  alert=json.loads(p.read_text(encoding="utf8")).get("operator_alert")
              except (OSError,ValueError):
                  continue
              if not isinstance(alert,dict):
                  continue
              severity="error" if alert.get("severity")=="ERROR" else "notice"
              message=str(alert.get("message","JRA link status")).replace("\\n"," ")
              print(f"::{severity} title={alert.get('code','JRA_LINK_STATUS')}::{message}")
          PY
      - name: Existing P1 immutable three-original handoff (optional, source-only)
        if: success()
        run: |
          python - <<'PY'
          import json,os,re,subprocess,sys
          from pathlib import Path
          from diagnostics.jra_one_shot_market_capture import ObservedRaceSpec
          snapshot=os.environ.get("THREE_ORIGINAL_SNAPSHOT","")
          if not snapshot:
              print("P1_THREE_ORIGINAL_HANDOFF=SKIPPED_NO_INDEPENDENT_SNAPSHOT")
              sys.exit(0)
          if (not re.fullmatch(r"docs/diagnostics/[A-Za-z0-9_./-]+\.json",snapshot)
                  or ".." in snapshot.split("/")):
              raise SystemExit("INVALID_THREE_ORIGINAL_SNAPSHOT_PATH")
          if not Path(snapshot).is_file():
              raise SystemExit("THREE_ORIGINAL_SNAPSHOT_NOT_FOUND")
          channels=("PC","SP") if os.environ["HYBRID"]=="true" else (os.environ["OBSERVED_CHANNEL"],)
          spec=ObservedRaceSpec(**json.loads(Path(os.environ["OBSERVED_SPEC"]).read_text(encoding="utf8"))).validate(require_channels=channels)
          selected=Path("jra_odds_observed_one_shot")
          if os.environ["HYBRID"]=="true":
              receipt=json.loads((selected/"hybrid_receipt.json").read_text(encoding="utf8"))
              channel=receipt.get("selected_channel")
              if channel not in ("PC","SP"):
                  print("P1_THREE_ORIGINAL_HANDOFF=SKIPPED_SOURCE_NOT_FROZEN")
                  sys.exit(0)
              selected/=channel.lower()
          source_receipt=json.loads((selected/"receipt.json").read_text(encoding="utf8"))
          if source_receipt.get("state")!="SOURCE_FROZEN":
              print("P1_THREE_ORIGINAL_HANDOFF=SKIPPED_SOURCE_NOT_FROZEN")
              sys.exit(0)
          original=json.loads(Path(snapshot).read_text(encoding="utf8"))
          if (original.get("meeting_date")!=
                 f"{spec.race_day[:4]}-{spec.race_day[4:6]}-{spec.race_day[6:]}"
                or original.get("race")!=spec.race_number):
              raise SystemExit("INDEPENDENT_SNAPSHOT_NOT_SAME_RACE")
          cmd=[sys.executable,"-m","diagnostics.p1_atomic_dual_market_handoff",
               "--capture-directory",str(selected),"--snapshot",snapshot,
               "--observed-utc",source_receipt["ended_at_utc"],
               "--output-archive","jra_odds_observed_one_shot/verified_three_originals.zip"]
          subprocess.run(cmd,check=True)
          print("P1_THREE_ORIGINAL_HANDOFF=OFFLINE_CONTENT_VERIFIED_ONLY")
          PY
      - name: Preserve originals and immutable source-only receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-observed-prerace-odds-${{ github.run_id }}
          path: jra_odds_observed_one_shot/
          retention-days: 30
          if-no-files-found: warn
