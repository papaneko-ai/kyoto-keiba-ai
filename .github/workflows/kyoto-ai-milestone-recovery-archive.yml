name: Kyoto AI research milestone recovery archive
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths:
      - 'docs/KYOTO_AI_20261110_P7_INDEPENDENT_RESEARCH_64PCT_MILESTONE.md'
      - 'docs/KYOTO_AI_20261110_RG02_DUAL_MARKET_58P3_GRADUATION_MILESTONE.md'
      - 'docs/KYOTO_AI_20261110_RG01_FREEZE_SETTLEMENT_66P7_MILESTONE.md'
      - 'docs/KYOTO_AI_20261110_RG03_TEMPORAL_75PCT_MILESTONE.md'
      - 'docs/KYOTO_AI_20261110_RG04_EVOLUTION_83P3_MILESTONE.md'
      - 'docs/KYOTO_AI_20261110_RG05_SAFETY_91P7_MILESTONE.md'
      - 'docs/KYOTO_AI_20261110_RG06_RESEARCH_GRADUATION_100PCT_MILESTONE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zip-git-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create exact development-commit recovery ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/kyoto-recovery
          git archive --format=zip --output=/tmp/kyoto-recovery/kyoto-ai-branch-source.zip HEAD
          cd /tmp/kyoto-recovery
          sha256sum kyoto-ai-branch-source.zip > SHA256SUMS.txt
          printf '%s\n' "repo=papaneko-ai/kyoto-keiba-ai" \
            "branch=jra-html-diagnostic-20261105" \
            "commit=$GITHUB_SHA" \
            "research_score_claim=64/100 (subject to same-commit continuity CI)" \
            "research_graduation_claim=100.0/100 (subject to same-commit continuity CI)" \
            "operational_score_claim=0/100 verified lower bound" \
            "separate_historical_original_recovery_artifact=13482994623" \
            "main_turso_secrets_untouched=true" > RECOVERY_MANIFEST.txt
          unzip -t kyoto-ai-branch-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kyoto-ai-rg06-100pct-graduation-source-recovery
          path: /tmp/kyoto-recovery/
          retention-days: 90
          if-no-files-found: error
