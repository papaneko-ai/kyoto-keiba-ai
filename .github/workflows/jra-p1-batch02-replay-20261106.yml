name: Kyoto P1 replay batch 02 official source originals
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/p1_batch02_replay_activation_20261106.txt']
permissions:
  contents: write
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 42166104655
          name: jra-p1-profile-batch-02-originals-20261106
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: official_originals
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Replay source SHA from original six HTML responses, no network
        run: |
          python diagnostics/jra_next_batches_original_replay.py --batch batch_02 \
            --artifact official_originals \
            --out docs/diagnostics/jra_p1_profile_batches_20261106/replayed_batch_02
      - name: Persist normalized proof and complete run receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/jra_p1_profile_batches_20261106/replayed_batch_02
          git commit -m "Independently replay all six batch02 JRA horse profile originals" || true
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
