name: Four real Kyoto pre-race snapshot acceptance gate
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/fourrace_validation_activation_20261106.txt']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check 4 frozen real JRA racecard sources
        id: test
        continue-on-error: true
        run: |
          python -m unittest discover -s tests -p 'test_jra_real_4race_milestone.py' -v > /tmp/fourrace-tests.log 2>&1
          cat /tmp/fourrace-tests.log
      - name: Persist test receipt to diagnostics branch
        if: always()
        env:
          RESULT: ${{ steps.test.outcome }}
        run: |
          mkdir -p docs/diagnostics
          python - <<'PY'
          import json,datetime,os
          data={'verification':'2026-11-07 Kyoto four actual pre-race structured snapshots',
            'test_pattern':'test_jra_real_4race_milestone.py',
            'outcome':os.environ['RESULT'],
            'completed_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'verified_in_scope':'4 race structured source JSON; not downloaded original HTML, no live odds'}
          open('docs/diagnostics/JRA_FOURRACE_CI_RECEIPT_20261106.json','w').write(json.dumps(data,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/JRA_FOURRACE_CI_RECEIPT_20261106.json
          git commit -m "Record four-race JRA source acceptance result" || true
          git push origin HEAD:jra-html-diagnostic-20261105
