name: Kyoto P1-FB real SP horse history PC source parity
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/activate_p1_fb_sp_profile_replay.txt']
permissions:
  contents: write
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jra-html-diagnostic-20261105
      - uses: actions/download-artifact@v4
        with:
          run-id: 42173462385
          name: kyoto-p1-fb-sp-profile-original
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: saved_sp_original
      - run: python -m pip install beautifulsoup4
      - run: python -m compileall -q diagnostics/jra_p1_sp_profile_offline.py diagnostics/jra_p1_fb_sp_profile_replay.py
      - run: python diagnostics/jra_p1_fb_sp_profile_replay.py --artifact saved_sp_original --out docs/diagnostics/jra_p1_fb_offline_20261106/sp_profile_real_parity.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/jra_p1_fb_offline_20261106/sp_profile_real_parity.json
          git commit -m "Prove independent SP horse history parser against verified PC source"
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
