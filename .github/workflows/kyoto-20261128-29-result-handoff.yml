name: Kyoto Nov28-29 authenticated all-run handoff
run-name: ${{ github.event_name == 'schedule' && format('kyoto-native:{0}', github.event.schedule) || github.event_name }}
on:
  schedule:
    - cron: '0 12 28 11 *'
    - cron: '0 12 29 11 *'
  workflow_dispatch:
    inputs:
      race_day:
        type: choice
        required: true
        options: ['20261128', '20261129']
      confirmation:
        required: true
        description: Enter NOV28-29-HANDOFF-ONLY
permissions:
  contents: read
  actions: read
jobs:
  authenticated-handoff:
    if: ${{ github.event_name == 'schedule' || inputs.confirmation == 'NOV28-29-HANDOFF-ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: ${{ (github.event.schedule == '0 12 28 11 *' || inputs.race_day == '20261128') && '20261128' || '20261129' }}
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
      GH_TOKEN: ${{ github.token }}
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'f88f55c46ec03749dc71329abddb5c75f79d68a1'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install authenticated evidence readers
        run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Reconcile exact-day run identities and authenticated evidence (no JRA HTTP)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          python -m diagnostics.kyoto_impl25_c12_all_runs_handoff --day "$KYOTO_TARGET_DAY" --repo "$GITHUB_REPOSITORY" --out handoff/report.json
          sha256sum handoff/report.json > handoff/report.sha256
      - name: Authenticate Saturday policy for automatic Sunday adoption
        if: ${{ env.KYOTO_TARGET_DAY == '20261128' }}
        continue-on-error: true
        run: python -m diagnostics.kyoto_impl30_nextday_adaptation --report handoff/report.json --out handoff/nextday_policy.json
      - name: Evaluate observed Sunday acquisition improvement
        if: ${{ env.KYOTO_TARGET_DAY == '20261129' }}
        continue-on-error: true
        timeout-minutes: 1
        run: python -m diagnostics.kyoto_impl31_improvement_evaluation --report handoff/report.json --out handoff/improvement_evaluation.json
      - name: Upload summary only
        id: upload_handoff_primary
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-handoff-${{ github.run_id }}-${{ env.KYOTO_TARGET_DAY }}
          path: handoff/
          if-no-files-found: error
          retention-days: 30
      - name: Retry the same authenticated handoff after first upload failure
        if: ${{ always() && steps.upload_handoff_primary.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-handoff-${{ github.run_id }}-${{ env.KYOTO_TARGET_DAY }}
          path: handoff/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  cushion-day-reconciliation:
    needs: authenticated-handoff
    if: ${{ always() && needs.authenticated-handoff.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: ${{ (github.event.schedule == '0 12 28 11 *' || inputs.race_day == '20261128') && '20261128' || '20261129' }}
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
      GH_TOKEN: ${{ github.token }}
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_CUSHION_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '301916719e5bc0e3a8e392368434f952c16c05db'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Reopen exact same-run handoff and replay authenticated cushion evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '301916719e5bc0e3a8e392368434f952c16c05db'
          mkdir -p handoff cushion_day
          timeout 30 gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "kyoto-handoff-$GITHUB_RUN_ID-$KYOTO_TARGET_DAY" --dir handoff
          sha256sum --check handoff/report.sha256
          python -m diagnostics.kyoto_impl36_cushion_day --day "$KYOTO_TARGET_DAY" --report handoff/report.json --out cushion_day/report.json
          sha256sum cushion_day/report.json > cushion_day/report.sha256
      - name: Upload independent cushion reconciliation only
        id: upload_cushion_day
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-cushion-day-${{ github.run_id }}-${{ env.KYOTO_TARGET_DAY }}
          path: cushion_day/
          if-no-files-found: error
          retention-days: 90
      - name: Retry independent summary upload only on first failure
        if: ${{ always() && steps.upload_cushion_day.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-cushion-day-${{ github.run_id }}-${{ env.KYOTO_TARGET_DAY }}
          path: cushion_day/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
