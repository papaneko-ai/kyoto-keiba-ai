name: Impl30 Nov22 actual historical result payout evidence
on:
  pull_request:
    types: [synchronize]
    branches: ['fix/impl29-weekend-20261128-29']
    paths:
      - 'diagnostics/kyoto_impl30_actual_postrace_replay.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: kyoto-nov22-historical-read-only
  cancel-in-progress: false
jobs:
  historical-source:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/impl30-postrace-actual-20261124' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
      KYOTO_TARGET_DAY: '20261122'
      KYOTO_HISTORICAL_READ_APPROVED: 'NO'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_POSTRACE_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Restore exact Nov22 archived racecards
        run: gh run download 44966013490 --repo "$GITHUB_REPOSITORY" --name kyoto-nov22-real-observed-all12-encrypted-44966013490 --dir nov22_cards
      - name: Restore previously captured historical result evidence, no JRA HTTP
        run: gh run download 45338040161 --repo "$GITHUB_REPOSITORY" --name nov22-historical-result-encrypted-45338040161 --dir prior_sealed
      - name: Re-open real payout structure and refund rows offline
        run: |
          python - <<'PY'
          import tempfile,os,re
          from pathlib import Path
          from bs4 import BeautifulSoup
          from diagnostics.kyoto_nov15_encrypted_evidence import decrypt_evidence
          from diagnostics.kyoto_impl30_final_reconcile import _text
          with tempfile.TemporaryDirectory() as d:
              root=Path(d)/'raw'
              decrypt_evidence('prior_sealed',root,key_hex=os.environ['ARCHIVE_KEY'],repo=os.environ['GITHUB_REPOSITORY'],run_id='45338040161')
              for name in ('payout_meeting.html','r01_result.html','r05_result.html'):
                  raw=(root/name).read_bytes()
                  soup=BeautifulSoup(raw.decode('cp932','strict'),'html.parser')
                  print('LAYOUT',name)
                  for t in soup.select('table'):
                      text=t.get_text(' ',strip=True)
                      if '馬連' in text and '枠連' in text:
                          print('TABLE',t.get('class'),t.get('id'), 'parent',t.parent.name,t.parent.get('class'), 'rows',len(t.select('tr')), 'start',text[:360])
                          for tr in t.select('tr'):
                              z=tr.get_text(' ',strip=True)
                              if '返還' in z: print('REFUND_ROW',tr.get('class'),z[:280])
                  for tag in soup.find_all(['h1','h2','h3','h4','caption']):
                      text=tag.get_text(' ',strip=True)
                      if re.search(r'(?:レース|[0-9]R|払戻|返還|確定)',text):
                          print('HEADING',tag.name,tag.get('class'),text[:120])
                  if name=='payout_meeting.html':
                      for cap in soup.select('caption.simple'):
                          if cap.get_text(' ',strip=True)!='レース結果':continue
                          print('CAPTION_ANCESTORS')
                          for x in list(cap.parents)[:6]:
                              t=x.get_text(' ',strip=True)
                              print('ANC',x.name,x.get('id'),x.get('class'),len(t),t.count('馬連'),t.count('枠連'),'imgs',[i.get('alt') for i in x.select('img[alt]')][:10],'head',t[:160])
                  else:
                      for h in soup.find_all('h2'):
                          if h.get_text(' ',strip=True)=='払戻金':
                              for x in list(h.parents)[:4]:
                                  t=x.get_text(' ',strip=True)
                                  print('RESULT_ANC',x.name,x.get('id'),x.get('class'),len(t),t.count('馬連'),t.count('枠連'),t[:180])
                  for el in soup.find_all(string=re.compile('返還馬番')):
                      print('REFUND_ANCESTORS',[(x.name,x.get('id'),x.get('class'),x.get_text(' ',strip=True)[:120]) for x in list(el.parents)[:4]])
                  t=_text(raw)
                  print('REFUND_CONTEXTS',[t[max(0,m.start()-35):m.start()+100] for m in re.finditer('返還',t)][:18])
                  print('FINAL_MARKERS',[t[max(0,m.start()-20):m.start()+25] for m in re.finditer('確定|審議中|速報',t)][:12])
          PY
      - name: Reparse existing historical originals only
        run: python -m diagnostics.kyoto_impl30_actual_postrace_replay --replay-only --prior-run 45338040161
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nov22-historical-result-summary-${{ github.run_id }}
          path: historical_report/report.json
          if-no-files-found: error
          retention-days: 90
