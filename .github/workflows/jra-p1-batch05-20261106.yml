name: Kyoto P1 strict batch05 capture
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/p1_batch05_activation_20261106.txt']
permissions:
  contents: write
concurrency:
  group: kyoto-p1-05
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: No-HTTP safety test
        run: python -m unittest discover -s tests -p 'test_jra_p1_batches05_06_probe.py' -v
      - name: Six strictly pre-race requests maximum
        run: python diagnostics/jra_p1_batches05_06_probe.py --batch batch_05 --out fresh_source05
      - name: Commit only source receipt
        if: always()
        run: |
          mkdir -p docs/diagnostics/jra_p1_profile_batches_20261106
          if test -f fresh_source05/batch_receipt.json; then
            cp fresh_source05/batch_receipt.json docs/diagnostics/jra_p1_profile_batches_20261106/batch_05_receipt.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/diagnostics/jra_p1_profile_batches_20261106/batch_05_receipt.json
            git commit -m "Prove P1 official batch05 source capture" || true
            git pull --rebase origin jra-html-diagnostic-20261105
            git push origin HEAD:jra-html-diagnostic-20261105
          fi
      - name: Short-lived actual source originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-p1-batch05-source-20261106
          path: fresh_source05/
          retention-days: 3
