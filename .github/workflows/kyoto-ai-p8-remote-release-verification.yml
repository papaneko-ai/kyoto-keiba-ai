name: Kyoto P8 external shadow deployment identity acceptance (readonly)
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths:
      - '.github/workflows/kyoto-ai-p8-remote-release-verification.yml'
      - 'diagnostics/p8_cloud_release_gate.py'
      - 'tests/test_p8_cloud_release_gate.py'
      - 'docs/KYOTO_AI_20261111_P8_CLOUD_PREP_94PCT_NOT_MILESTONE.md'
  workflow_dispatch:
    inputs:
      app_url:
        description: "Already deployed separate P8 shadow app HTTPS URL (*.streamlit.app)"
        type: string
        required: true
permissions:
  contents: read
jobs:
  external-shadow-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      APP_URL: ${{ inputs.app_url || 'https://kyoto-keiba-ai-5opazxhrw7xwh4imfemey6.streamlit.app' }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jra-html-diagnostic-20261105
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure checked-out SHA is exactly GitHub workflow SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install remote browser verifier only
        run: |
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install chromium
      - name: Check public separate Streamlit source identity, no wagers or JRA requests
        shell: bash
        run: |
          set -euo pipefail
          python -m diagnostics.p8_cloud_release_gate --url "$APP_URL" --sha "$SOURCE_SHA" --out /tmp/kyoto-cloud-p8-shadow-source.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/kyoto-cloud-p8-shadow-source.json').read_text())
          assert x['public_shadow_deployment_git_sha_verified']
          assert not x['actual_cloud_instance_reboot_verified']
          assert not x['cloud_billing_and_free_tier_account_verified']
          assert not x['P8_04_full_release_certified']
          assert not x['actual_purchase_authorized']
          print('P8_NEW_PUBLIC_SHADOW_PRESENT_NOT_FULL_RELEASE=TRUE')
          PY
      - name: Preserve remote browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-p8-remote-browser-observation
          path: |
            /tmp/kyoto-cloud-p8-shadow-source.json
            /tmp/kyoto-p8-external-failure-*.png
          if-no-files-found: warn
          retention-days: 90
