name: Impl42 targeted prior navigation fallback proof
on:
  push:
    branches: ['fix/impl42-postrace-feedback-proof-20261128']
    paths: ['.github/workflows/impl42-postrace-feedback-proof.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: '20261121'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_POSTRACE_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '0d46856ad831ab644df92914e6338a5e65914e20'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Install existing exact dependencies
        run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Target only newly changed recovery cases
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '0d46856ad831ab644df92914e6338a5e65914e20'
          python -m unittest -v tests.test_kyoto_impl30_postrace_runtime.RuntimeTests.test_prior_navigation_falls_back_only_after_failed_reopen
          echo 'EXACT_SOURCE=0d46856ad831ab644df92914e6338a5e65914e20; JRA_HTTP_REQUESTS=0; PROOF_ONLY=TRUE'
