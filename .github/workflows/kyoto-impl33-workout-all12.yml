name: Kyoto Impl33 historical all12 workout binding
on:
  push:
    branches: ['fix/impl33-workout-all12-20261126']
permissions:
  contents: read
  actions: read
jobs:
  historical:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Exact regression and new format tests
        run: |
          set -euo pipefail
          mkdir -p all12_workout
          git rev-parse HEAD > all12_workout/head.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m unittest discover -s tests -p 'test_kyoto_impl33_*.py' -v 2>&1 | tee all12_workout/tests.log
      - name: Reuse official encrypted archive and previous R1 sample
        run: |
          gh run download 44966013490 --name kyoto-nov22-real-observed-all12-encrypted-44966013490 --repo "$GITHUB_REPOSITORY" --dir pc_archive
          gh run download 45754622928 --name kyoto-impl33-workout-binding-45754622928 --repo "$GITHUB_REPOSITORY" --dir previous_binding
      - name: Bind all observed historical race pages; no JRA HTTP
        env:
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
        run: python -m diagnostics.kyoto_impl33_workout_all12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-impl33-all12-workout-${{ github.run_id }}
          path: all12_workout/
          retention-days: 90
          if-no-files-found: error
