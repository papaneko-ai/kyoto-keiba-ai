name: Kyoto P1 all R1 R2 R3 horse-profile acceptance
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/p1_three_races_activation_20261106.txt']
permissions:
  contents: write
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Offline source-receipt integrity and 3 complete races regression
        run: python -m unittest discover -s tests -p 'test_jra_p1_three_complete_races.py' -v
      - name: Produce latest stable 148-horse registry and checked checkpoint
        run: |
          python diagnostics/jra_p1_three_complete_races.py \
            --out docs/diagnostics/jra_p1_three_complete_races_20261106
      - name: Persist 48 known official horse profiles and 100 missing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/jra_p1_three_complete_races_20261106
          git commit -m "Accept JRA Kyoto 1R 2R 3R full profiles and 48 source-verified entries" || true
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
