name: Kyoto Nov21 result classification and Nov22 repair handoff
on:
  schedule:
    - cron: '0 12 21 11 *'
  workflow_run:
    workflows: ['Kyoto Nov21-22 independent encrypted original collection']
    types: [completed]
  workflow_dispatch:
    inputs:
      observed_run_id:
        description: Completed observation run ID to classify
        required: true
permissions:
  contents: read
  actions: read
jobs:
  independent-day-result-triage:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.event.workflow_run.created_at, '2026-11-21') || startsWith(github.event.workflow_run.created_at, '2026-11-22') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      OBSERVED_RUN: ${{ github.event.workflow_run.id || inputs.observed_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 980365257e2bbe4b5b44d63f708a6ce761cf1ad5
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact scheduled run, jobs and artifact metadata from GitHub API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p day_result_handoff
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/kyoto-20261121-22-two-source-production-observer.yml/runs?created=2026-11-21&per_page=100" > day_result_handoff/day21_runs.json
            OBSERVED_RUN="$(python - <<'PY'
          import json
          from pathlib import Path
          runs=json.loads(Path('day_result_handoff/day21_runs.json').read_text()).get('workflow_runs',[])
          completed=[r for r in runs if r.get('status')=='completed']
          print(completed[0]['id'] if completed else '0')
          PY
          )"
          fi
          [[ "$OBSERVED_RUN" =~ ^[0-9]+$ ]] || { echo INVALID_RUN_ID; exit 1; }
          if [ "$OBSERVED_RUN" = "0" ]; then
            printf '%s\n' '{"event":"schedule","created_at":"2026-11-21T12:00:00Z","id":null,"conclusion":null,"actual_run_observed":false,"name":"Kyoto Nov21-22 independent encrypted original collection","status":"completed"}' > day_result_handoff/run.json
            printf '%s\n' '{"jobs":[]}' > day_result_handoff/jobs.json
            printf '%s\n' '{"artifacts":[]}' > day_result_handoff/artifacts.json
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$OBSERVED_RUN" > day_result_handoff/run.json
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$OBSERVED_RUN/jobs?per_page=100" > day_result_handoff/jobs.json
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$OBSERVED_RUN/artifacts?per_page=100" > day_result_handoff/artifacts.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path('day_result_handoff/run.json').read_text())
          if run.get('name')!='Kyoto Nov21-22 independent encrypted original collection':
              raise SystemExit('WRONG_WORKFLOW_IDENTITY')
          if run.get('status')!='completed':
              raise SystemExit('SOURCE_RUN_NOT_COMPLETED')
          stamp=run.get('created_at','')
          day=stamp[:10].replace('-','')
          if day not in ('20261121','20261122'):
              raise SystemExit('UNEXPECTED_RACE_DAY')
          Path('day_result_handoff/day.txt').write_text(day)
          PY
      - name: Inspect actual AES-GCM PC and SP artifact contents privately before Nov22
        shell: bash
        env:
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
        run: |
          set -euo pipefail
          day="$(cat day_result_handoff/day.txt)"
          mkdir -p day21_ephemeral/pc day21_ephemeral/sp
          if [ "$OBSERVED_RUN" != "0" ]; then
            for lane in pc sp; do
              artifact="kyoto-$lane-$OBSERVED_RUN-$day"
              if jq -e --arg artifact "$artifact" '.artifacts[] | select(.name == $artifact and .expired == false)' day_result_handoff/artifacts.json >/dev/null; then
                if ! gh run download "$OBSERVED_RUN" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "day21_ephemeral/$lane" >/dev/null 2>&1; then
                  echo "$lane:DOWNLOAD_FAILED" >> day_result_handoff/artifact_download_errors.txt
                fi
              else
                echo "$lane:ARTIFACT_MISSING" >> day_result_handoff/artifact_download_errors.txt
              fi
            done
          fi
          KYOTO_TARGET_DAY="$day" python -m diagnostics.kyoto_weekend_day21_artifact_triage \
            --day "$day" --run-id "$OBSERVED_RUN" \
            --pc day21_ephemeral/pc --sp day21_ephemeral/sp \
            --out day_result_handoff/source_assessment.json
          # Never archive plaintext originals or the temporary decrypted folder.
          rm -rf day21_ephemeral
      - name: Classify each failure type without inventing successful JRA retrieval
        shell: bash
        run: |
          set -euo pipefail
          python -m diagnostics.kyoto_weekend_day21_triage \
            --day "$(cat day_result_handoff/day.txt)" \
            --run day_result_handoff/run.json \
            --jobs day_result_handoff/jobs.json \
            --artifacts day_result_handoff/artifacts.json \
            --out day_result_handoff/diagnostic.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('day_result_handoff/diagnostic.json').read_text())
          lines=['## Kyoto day-result fault classification', '',
                 'Day: '+r['day'], 'Run: '+str(r['run_id']), '',
                 '| Lane | Evidence status | Failure stage |',
                 '|---|---|---|']
          for lane in ('PC','SP'):
              d=r['lanes'][lane]
              lines.append('| '+lane+' | '+d['state']+' | '+d['stage']+' |')
          source_file=Path('day_result_handoff/source_assessment.json')
          source=json.loads(source_file.read_text()) if source_file.is_file() else {"lanes":{}}
          lines += ['', '## Decrypted-source assessment (no raw HTML published)', '',
                    '| Lane | AES evidence state | Both raw market files |',
                    '|---|---|---|']
          for lane in ('PC','SP'):
              proof=source.get('lanes',{}).get(lane,{})
              lines.append('| '+lane+' | '+str(proof.get('state','NOT_AVAILABLE'))+
                           ' | '+str(proof.get('both_raw_market_originals_present',False))+' |')
          strategy=r['day22_strategy']
          lines += ['', '## Prevalidated next-day fallback', '',
                    'PC: '+strategy['PC'],
                    'SP: '+strategy['SP'],
                    'Manual intervention before Nov22: '+str(strategy['requires_manual_intervention']),
                    'Run actually observed: '+str(r['observed_workflow_run_exists']),
                    'This is not a claim that official racecard or odds are authenticated.',
                    'For next-day code repairs: validate the new exact SHA in offline CI before setting KYOTO_NOV22_VERIFIED_COLLECTOR_SHA.']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('\n'.join(lines)+'\n')
          PY
          sha256sum day_result_handoff/diagnostic.json > day_result_handoff/diagnostic.sha256
      - name: Retain exact run metadata and next-day repair decision support
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-day-result-triage-${{ github.run_id }}
          path: day_result_handoff/
          retention-days: 30
          if-no-files-found: warn
