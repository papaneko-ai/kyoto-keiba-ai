name: Kyoto G05 pre-event condition evidence regression
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths:
      - 'diagnostics/kyoto_g05_conditions.py'
      - 'diagnostics/kyoto_g05_official_track.py'
      - 'diagnostics/kyoto_weekend_capture.py'
      - 'diagnostics/kyoto_nov15_encrypted_evidence.py'
      - 'tests/test_kyoto_g05_conditions.py'
      - 'tests/test_kyoto_g05_official_track.py'
      - 'tests/test_kyoto_g05_weekend_bridge.py'
      - '.github/workflows/kyoto-g05-conditions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g05-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: '20261121'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: All 12R G05 source and missingness regression; zero external HTTP
        run: python -m unittest -v tests.test_kyoto_g05_conditions tests.test_kyoto_g05_official_track tests.test_kyoto_g05_weekend_bridge
      - name: Guard G03/G04 and encrypted source archive against regression
        run: python -m unittest -q tests.test_kyoto_g03_all_races tests.test_kyoto_g03_proof_verify tests.test_kyoto_g04_all_horse_profiles tests.test_kyoto_g03_weekend_bridge tests.test_kyoto_weekend_capture tests.test_kyoto_nov15_encrypted_evidence
      - name: Preserve evidence scope and unresolved official source
        run: |
          mkdir -p g05_proof
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          data={"gate":"G05","scope":"ZERO_HTTP_ALL_12R_SAVED_RACECARD_GROUND_WEATHER_WEIGHT_MISSINGNESS",
                "real_saved_conditions_source_bytes_replayed":False,
                "published_workout_source_discovered":False,
                "official_kyoto_track_page_same_day_synthetic_replay":True,
                "official_publication_timestamps_verified":False,
                "historical_training_values_fabricated":False,
                "live_nov21_nov22_acquired":False,
                "gate_pass":True, "gate_scope":"PRE_EVENT_SOURCE_AND_MISSINGNESS_CONTRACT_ONLY",
                "all_workout_values_acquired":False,
                "predictive_feature_completeness_verified":False,
                "source_sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()}
          Path("g05_proof/receipt.json").write_text(json.dumps(data,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-g05-saved-source-regression-${{ github.run_id }}
          path: g05_proof/
          if-no-files-found: ignore
