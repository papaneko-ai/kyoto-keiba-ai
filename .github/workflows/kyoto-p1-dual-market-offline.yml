name: Kyoto P1 dual market and withdrawal offline acceptance
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths:
      - 'diagnostics/p1_dual_market_offline_audit.py'
      - 'tests/test_p1_dual_market_offline_audit.py'
      - '.github/workflows/kyoto-p1-dual-market-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-network-dual-market:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile diagnostics/p1_dual_market_offline_audit.py tests/test_p1_dual_market_offline_audit.py
      - run: python -m unittest discover -s tests -p 'test_p1_dual_market_offline_audit.py' -v
      - run: python -m unittest discover -s tests -p 'test_p1_prerace_market_coverage.py' -v
