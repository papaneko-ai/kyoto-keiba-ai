name: Kyoto Impl33 workout runtime isolated verification
on:
  push:
    branches: ['fix/impl33-workout-runtime-20261126']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Exact runtime and canonical contract tests
        run: |
          set -euo pipefail
          mkdir -p workout_runtime_ci
          git rev-parse HEAD > workout_runtime_ci/head.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m unittest discover -s tests -p 'test_kyoto_impl33_workout_runtime.py' -v 2>&1 | tee workout_runtime_ci/runtime.log
          python -m unittest discover -s tests -p 'test_kyoto_impl33_workout_generic.py' -v 2>&1 | tee workout_runtime_ci/generic.log
          python -m unittest discover -s tests -p 'test_kyoto_impl31_workout_intake.py' -v 2>&1 | tee workout_runtime_ci/intake.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-impl33-workout-runtime-ci-${{ github.run_id }}
          path: workout_runtime_ci/
          retention-days: 30
          if-no-files-found: error
