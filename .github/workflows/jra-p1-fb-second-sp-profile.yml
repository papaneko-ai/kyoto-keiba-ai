name: Kyoto P1-FB second SP profile source-first bounded proof
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/activate_p1_fb_second_sp_profile.txt']
permissions:
  contents: write
jobs:
  one-sp-source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jra-html-diagnostic-20261105
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Run SP special type regression and no duplicate check
        run: |
          python -m compileall -q diagnostics/jra_p1_sp_profile_offline.py diagnostics/jra_p1_fb_second_sp_profile_probe.py
          python -m unittest discover -s tests -p 'test_jra_p1_fb_sp_special_regressions.py' -v
          python -m unittest discover -s tests -p 'test_jra_p1_failover_offline.py' -v
      - name: Capture one already listed official SP profile with source-first evidence
        run: python diagnostics/jra_p1_fb_second_sp_profile_probe.py --out sp_profile02_proof
      - name: Preserve bounded SP proof even on parser failure
        if: always()
        run: |
          if test -f sp_profile02_proof/receipt.json; then
            cp sp_profile02_proof/receipt.json docs/diagnostics/jra_p1_fb_offline_20261106/sp_profile_second_receipt.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/diagnostics/jra_p1_fb_offline_20261106/sp_profile_second_receipt.json
            git commit -m "Preserve second SP official profile one-shot source-first incident proof"
            git pull --rebase origin jra-html-diagnostic-20261105
            git push origin HEAD:jra-html-diagnostic-20261105
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-p1-fb-sp-second-profile-original
          path: sp_profile02_proof/
          retention-days: 3
