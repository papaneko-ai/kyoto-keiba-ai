name: Kyoto P1-FB archived SP horse-profile link inspection
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/activate_p1_fb_sp_link_discovery.txt']
permissions:
  contents: write
  actions: read
jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jra-html-diagnostic-20261105
      - uses: actions/download-artifact@v4
        with:
          run-id: 42159644686
          name: jra-paired-pc-sp-source-evidence-20261106
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: archived_source
      - run: python -m pip install beautifulsoup4
      - run: python diagnostics/jra_p1_sp_profile_link_from_archived_racecard.py --source archived_source/race_11_sp.html --out docs/diagnostics/jra_p1_fb_offline_20261106/sp_11r_profile_links.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/jra_p1_fb_offline_20261106/sp_11r_profile_links.json
          git commit -m "Inspect official SP horse profile links from existing archived HTML"
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
