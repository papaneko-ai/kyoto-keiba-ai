name: JRA Kyoto 11R guarded one-shot odds capture
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths:
      - 'diagnostics/odds_preflight_activation_20261106.txt'
      - 'diagnostics/odds_post_sales_activation_20261106.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jra-kyoto-11r-odds-once-20261106
  cancel-in-progress: false
jobs:
  capture_once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - name: Install parser only
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Bounded PC official 11R market capture, no retries or production use
        run: |
          python diagnostics/jra_one_shot_market_capture.py \
            --channel PC \
            --verified-start-utc 2026-11-07T06:45:00Z \
            --active-roster-json docs/diagnostics/remaining8_20261106/kyoto_11_snapshot.json \
            --out jra_odds_one_shot
      - name: Append unique diagnostic metadata receipt, preserving prior runs
        if: always()
        run: |
          mkdir -p docs/diagnostics/odds_one_shot_20261106
          if test -f jra_odds_one_shot/receipt.json; then
            cp jra_odds_one_shot/receipt.json docs/diagnostics/odds_one_shot_20261106/receipt_${GITHUB_RUN_ID}.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/diagnostics/odds_one_shot_20261106/
            git commit -m "Record immutable-name JRA odds one-shot status receipt" || true
            git pull --rebase origin jra-html-diagnostic-20261105
            git push origin HEAD:jra-html-diagnostic-20261105
          fi
      - name: Temporary original-byte evidence, never publish raw HTML to repo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-one-shot-odds-evidence-${{ github.run_id }}
          path: jra_odds_one_shot/
          retention-days: 3
          if-no-files-found: warn
