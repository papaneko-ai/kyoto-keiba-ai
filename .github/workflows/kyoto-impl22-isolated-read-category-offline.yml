name: Kyoto impl22 isolated read category offline acceptance
on:
  push:
    branches:
      - diagnostic/impl22-read-failure-categories-20261119
    paths:
      - diagnostics/kyoto_turso_capture_claims.py
      - tests/test_kyoto_impl22_select_error_categories.py
      - .github/workflows/kyoto-impl22-isolated-read-category-offline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-network-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v tests.test_kyoto_impl22_select_error_categories tests.test_kyoto_impl22_real_collision_read_reconciliation tests.test_kyoto_turso_capture_claims tests.test_kyoto_turso_claim_manual_crossrunner
