name: Inspect real JRA hurdle-course special format offline
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/obstacle_course_inspection_activation_20261106.txt']
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 42163450529
          name: jra-nine-horse-official-profiles-20261106
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: archived_official_profiles
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Inspect source row course labels without JRA requests
        run: python diagnostics/jra_obstacle_course_original_inspect.py --original archived_official_profiles/kyoto_08_horse_01.html --out docs/diagnostics/JRA_OBSTACLE_COURSE_LABELS_20261106.json
      - name: Persist structured discrepancy evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/JRA_OBSTACLE_COURSE_LABELS_20261106.json
          git commit -m "Record actual JRA obstacle surface course labels" || true
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
