name: Kyoto Impl36 cushion day sidecar offline
on:
  push:
    branches: ['impl36-cushion-day-coverage-20261127']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      KYOTO_TARGET_DAY: '20261128'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - run: python -m unittest -v tests.test_kyoto_impl36_cushion_day
