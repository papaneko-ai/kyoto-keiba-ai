name: Kyoto emergency authenticated source diagnosis
on:
  push:
    branches: ['fix/impl30-nov29-source-diagnostics-20261128']
    paths: ['.github/workflows/kyoto-emergency-nov28-diagnosis.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KYOTO_TARGET_DAY: '20261128'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3f4b3d77357745ead05a9f78db34eb6ac2d78637
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Authenticate stored originals and emit only bounded diagnostic codes and counts
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
        shell: bash
        run: |
          python - <<'PY'
          import os,json,re,subprocess,tempfile
          from pathlib import Path
          from diagnostics.kyoto_nov15_encrypted_evidence import decrypt_evidence
          from diagnostics.jra_official_link_repair import observed_links
          from diagnostics.kyoto_weekend_sp_discovery import official_sp_anchors
          from diagnostics.kyoto_p1_nov14_official_one_shot_nav import SOURCE
          repo=os.environ["GITHUB_REPOSITORY"]
          day="20261128"
          def code(x):
              return x if isinstance(x,str) and re.fullmatch(r"[A-Za-z0-9_]{1,120}",x) else "OTHER_OR_MISSING"
          for rid in ("46087080554","46092343351","46096495437","46100155324"):
              for lane in ("pc","sp"):
                  with tempfile.TemporaryDirectory() as tmp:
                      try:
                          base=Path(tmp)
                          subprocess.run(["gh","run","download",rid,"--repo",repo,"--name",f"kyoto-{lane}-{rid}-{day}","--dir",str(base/"sealed")],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=20)
                          raw=base/"raw"
                          decrypt_evidence(base/"sealed",raw,key_hex=os.environ["ARCHIVE_KEY"],repo=repo,run_id=rid)
                          out={"run":rid,"lane":lane,"authenticated":True}
                          for name in ("receipt.json","observer_partial_receipt.json","sp_discovery_receipt.json","g03_receipt.json"):
                              p=raw/name
                              if p.is_file():
                                  d=json.loads(p.read_text())
                                  out[name]={k:code(d.get(k)) for k in ("state","error_class","error_code")}
                                  if name=="sp_discovery_receipt.json":
                                      out["sp_attempts"]=[{k:code(a.get(k)) for k in ("state","error_class")} for a in d.get("attempts",[])]
                                      out["sp_candidates"]={str(i):d.get("per_race_observed_navigation_candidates",{}).get(str(i),{}).get("candidate_count",0) for i in range(1,13)}
                          p=raw/"official_selection.html"
                          if p.is_file():
                              b=p.read_bytes()
                              out["pc_selection_bytes"]=len(b)
                              try:
                                  anchors=observed_links(b,SOURCE)
                                  out["pc_anchor_count"]=len(anchors)
                                  out["pc_target_day_count"]=sum(day in t for u,l,t in anchors)
                                  out["pc_kyoto_target_count"]=len({u for u,l,t in anchors if day in t and "京都" in l})
                              except Exception as exc:
                                  out["pc_parse_error"]=type(exc).__name__
                          p=raw/"official_sp_discovery_1.html"
                          if p.is_file():
                              b=p.read_bytes()
                              out["sp_seed_bytes"]=len(b)
                              from bs4 import BeautifulSoup
                              from urllib.parse import urljoin,urlsplit
                              soup=BeautifulSoup(b,"html.parser")
                              nav=[]
                              for tag in soup.select("a[href]"):
                                  label=tag.get_text(" ",strip=True)
                                  if not any(k in label for k in ("出馬表","レース情報","競馬メニュー","開催","オッズ")): continue
                                  u=urlsplit(urljoin("https://sp.jra.jp/",tag["href"]))
                                  if u.scheme=="https" and u.hostname in ("sp.jra.jp","app.jra.jp","www.jra.go.jp","jra.jp") and not u.username and not u.password:
                                      nav.append({"host":u.hostname,"path":u.path,"query_present":bool(u.query),"category":next(k for k in ("出馬表","レース情報","競馬メニュー","開催","オッズ") if k in label)})
                              out["sp_navigation"]=nav[:30]
                              try:
                                  anchors=official_sp_anchors(b,"https://sp.jra.jp/",day)
                                  out["sp_anchor_count"]=len(anchors)
                                  out["sp_target_day_count"]=sum(day in t for u,l,t in anchors)
                              except Exception as exc:
                                  out["sp_parse_error"]=type(exc).__name__
                          print("EMERGENCY_DIAG="+json.dumps(out,sort_keys=True))
                      except Exception as exc:
                          print("EMERGENCY_DIAG="+json.dumps({"run":rid,"lane":lane,"error_class":type(exc).__name__}))
          PY
