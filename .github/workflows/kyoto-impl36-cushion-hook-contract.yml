name: Kyoto Impl36 cushion hook exact deployment check
on:
  push:
    branches: ['release/impl36-cushion-independent-hook-20261127']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kyoto-20261128-29-cushion-source.yml'
      - 'tests/test_kyoto_impl36_cushion_deploy.py'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Verify new hook and protected original workflow bytes
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_kyoto_impl39_native_isolation.Isolation.test_exact_live_workflow_delta
          python -m unittest -v tests.test_kyoto_impl36_cushion_deploy
