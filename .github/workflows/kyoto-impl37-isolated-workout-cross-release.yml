name: Impl37 isolated workout cross-release offline regression
on:
  push:
    branches: ['repair/impl37-workout-reader-20261128']
  pull_request:
    branches: ['repair/impl37-workout-reader-base-20261128']
permissions:
  contents: read
jobs:
  offline-workout-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ".:tests"
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_AUX_HTTP_APPROVED: 'NO'
      KYOTO_CUSHION_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Block external requests and run offline regressions
        run: |
          python - <<'PY'
          import socket, unittest
          from unittest.mock import patch
          names=['tests.test_kyoto_impl37_workout_cross_release','tests.test_kyoto_impl33_workout_runtime','tests.test_kyoto_g03_all_races','tests.test_kyoto_nov15_encrypted_evidence']
          def denied(*args,**kwargs):
              raise AssertionError("network forbidden in offline regression")
          with patch.object(socket.socket,'connect',denied), patch.object(socket,'create_connection',denied):
              suite=unittest.defaultTestLoader.loadTestsFromNames(names)
              result=unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
