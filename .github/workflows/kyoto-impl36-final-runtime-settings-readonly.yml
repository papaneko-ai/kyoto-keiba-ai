name: Kyoto Impl36 final read-only production settings proof
on:
  push:
    branches: ['impl36-final-runtime-settings-readonly-20261127']
    paths: ['.github/workflows/kyoto-impl36-final-runtime-settings-readonly.yml']
permissions:
  contents: read
  actions: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_AUX_HTTP_APPROVED: 'NO'
      KYOTO_SHARED_CLAIM_ACTIVATE: ${{ vars.KYOTO_SHARED_CLAIM_ACTIVATE || 'NO' }}
      KYOTO_SHARED_CLAIM_TARGET: 'PRODUCTION'
      KYOTO_SHARED_CLAIM_PRODUCTION_APPROVED: ${{ vars.KYOTO_SHARED_CLAIM_PRODUCTION_APPROVED || 'NO' }}
      KYOTO_SHARED_CLAIM_APPROVED_PRODUCTION_HOST: ${{ vars.KYOTO_SHARED_CLAIM_APPROVED_PRODUCTION_HOST }}
      KYOTO_SHARED_CLAIM_TURSO_URL: ${{ vars.KYOTO_SHARED_CLAIM_TURSO_URL }}
      KYOTO_SHARED_CLAIM_TURSO_TOKEN: ${{ secrets.KYOTO_SHARED_CLAIM_TURSO_TOKEN }}
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'de0a5ce4333feb8edf6308f6f6a4a2a5e42febfb'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - name: Check workflow state and existing coordinator with SELECT only
        run: |
          python - <<'PY'
          import os,re,json,subprocess,pathlib
          from diagnostics.kyoto_impl23_claim_preflight import check
          repo='papaneko-ai/kyoto-keiba-ai'
          assert os.environ['GITHUB_REPOSITORY']==repo
          names=['auxiliary-refresh','cushion-source','postrace-evidence','result-handoff','two-source-production-observer','workout-source']
          out={'schema':'kyoto_impl36_final_runtime_settings.v1','main_reviewed':'351d702da1be9de07733f83ebada4fecd29f4110','core_pin':'de0a5ce4333feb8edf6308f6f6a4a2a5e42febfb','archive_key_format_ok':bool(re.fullmatch('[0-9a-fA-F]{64}',os.environ.get('ARCHIVE_KEY',''))),'coordinator_enabled':os.environ.get('KYOTO_SHARED_CLAIM_ACTIVATE')=='YES','coordinator_approved':os.environ.get('KYOTO_SHARED_CLAIM_PRODUCTION_APPROVED')=='YES','workflow_states':{},'jra_requests':0,'database_writes':0,'settings_writes':0,'event_context':'isolated simulated schedule, actual read-only remote query'}
          for n in names:
              try:
                  x=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/workflows/kyoto-20261128-29-{n}.yml'],stderr=subprocess.DEVNULL,timeout=10))
                  out['workflow_states'][n]=x.get('state','unknown')
              except Exception as exc:out['workflow_states'][n]=type(exc).__name__
          env=dict(os.environ,GITHUB_EVENT_NAME='schedule',GITHUB_EVENT_SCHEDULE='15 0 29 11 *')
          try:out['coordinator_read']=check('20261129',environ=env)
          except Exception as exc:out['coordinator_read']={'status':'READ_NOT_VERIFIED','error_class':type(exc).__name__}
          p=pathlib.Path('settings_receipt');p.mkdir()
          (p/'receipt.json').write_text(json.dumps(out,sort_keys=True,indent=2))
          print('FINAL_RUNTIME_SETTINGS='+json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: impl36-final-runtime-settings-${{ github.run_id }}
          path: settings_receipt/
          retention-days: 90
          if-no-files-found: error
