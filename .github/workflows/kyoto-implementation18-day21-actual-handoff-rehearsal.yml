name: Kyoto implementation18 day21-to-day22 actual no-source handoff rehearsal
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kyoto-implementation18-day21-actual-handoff-rehearsal.yml'
permissions:
  contents: read
  actions: write
jobs:
  dispatch-safe-no-source-case:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Request actual handoff workflow_dispatch using no-source receipt case only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p day21_handoff_request_proof
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          from datetime import datetime,timezone
          from pathlib import Path
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/kyoto-20261121-22-result-handoff.yml/dispatches'
          body={'ref':'main','inputs':{'observed_run_id':'0'}}
          req=urllib.request.Request(url,method='POST',data=json.dumps(body).encode(),
               headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                        'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28',
                        'User-Agent':'Kyoto-no-JRA-handoff-rehearsal'})
          status=None
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  status=response.status
          except urllib.error.HTTPError as exc:
              status=exc.code
          proof={'sent_utc':datetime.now(timezone.utc).isoformat(),
                 'status':status,'source_run_id':os.environ['GITHUB_RUN_ID'],
                 'trigger_workflow':'kyoto-20261121-22-result-handoff.yml',
                 'target_observation_run_id':'0','no_real_source':True,
                 'actual_jra_http_requests':0,'real_day21_event':False}
          Path('day21_handoff_request_proof/receipt.json').write_text(json.dumps(proof,indent=2,sort_keys=True))
          print('HANDOFF_NO_SOURCE_DISPATCH_HTTP_STATUS='+str(status))
          if status!=204:raise SystemExit('HANDOFF_MOCK_DISPATCH_REJECTED')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto18-handoff-dispatch-request-${{ github.run_id }}
          path: day21_handoff_request_proof/
          if-no-files-found: warn
          retention-days: 30
