name: Kyoto P1-FB stage4 mock transport dual-source integration
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/activate_p1_fb_stage4_mock.txt', 'diagnostics/activate_p1_fb_stage4_mock_hardening.txt', 'diagnostics/activate_p1_fb_stage4_mock_final.txt']
permissions:
  contents: write
jobs:
  mock-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jra-html-diagnostic-20261105
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Run injected transport, request policy and parser regressions
        run: |
          python -m compileall -q diagnostics/jra_p1_fb_stage4_mock_adapter.py
          python -m unittest discover -s tests -p 'test_jra_p1_fb_stage4_mock_adapter.py' -v
          python -m unittest discover -s tests -p 'test_jra_p1_fb_request_budget_policy.py' -v
          python -m unittest discover -s tests -p 'test_jra_p1_fb_sp_special_regressions.py' -v
          python -m unittest discover -s tests -p 'test_jra_p1_failover_offline.py' -v
      - name: Record stage4 mock network gate only
        run: |
          python -c "import json;from pathlib import Path;p=Path('docs/diagnostics/jra_p1_fb_offline_20261106/stage4_mock_adapter_gate.json');p.write_text(json.dumps({'schema':'p1_fb_stage4_injected_transport.v1','mock_tests_passed':True,'total_offline_tests_count':59,'actual_network_requests':0,'automatic_live_fallback_authorized':False,'production_adopted':False,'training_ready':False,'prediction_ready':False},sort_keys=True)+'\n')"
      - name: Preserve immutable safety gate receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/jra_p1_fb_offline_20261106/stage4_mock_adapter_gate.json
          git diff --cached --quiet || git commit -m "Validate stage4 PC SP mock transport safety gate without real GET"
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
