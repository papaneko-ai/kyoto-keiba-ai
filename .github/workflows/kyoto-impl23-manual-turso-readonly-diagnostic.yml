name: Impl23 manually verify production Turso coordinator READ ONLY
on:
  workflow_dispatch:
    inputs:
      race_day:
        description: Select date for safe synthetic key (no real capture)
        required: true
        type: choice
        options:
          - '20261121'
          - '20261122'
      confirmation:
        description: Enter IMPL23-READ-ONLY-TURSO-PROBE
        required: true
permissions:
  contents: read
jobs:
  verify-read-only:
    if: ${{ inputs.confirmation == 'IMPL23-READ-ONLY-TURSO-PROBE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
      KYOTO_READONLY_PROBE_CONFIRMATION: ${{ inputs.confirmation }}
      KYOTO_SHARED_CLAIM_ACTIVATE: ${{ vars.KYOTO_SHARED_CLAIM_ACTIVATE || 'NO' }}
      KYOTO_SHARED_CLAIM_TARGET: PRODUCTION
      KYOTO_SHARED_CLAIM_PRODUCTION_APPROVED: ${{ vars.KYOTO_SHARED_CLAIM_PRODUCTION_APPROVED || 'NO' }}
      KYOTO_SHARED_CLAIM_APPROVED_PRODUCTION_HOST: ${{ vars.KYOTO_SHARED_CLAIM_APPROVED_PRODUCTION_HOST }}
      KYOTO_SHARED_CLAIM_TURSO_URL: ${{ vars.KYOTO_SHARED_CLAIM_TURSO_URL }}
      KYOTO_SHARED_CLAIM_TURSO_TOKEN: ${{ secrets.KYOTO_SHARED_CLAIM_TURSO_TOKEN }}
    steps:
      - name: Fetch immutable reviewed diagnostic only
        uses: actions/checkout@v4
        with:
          ref: adff6efba191c5e08f272e37c2cf30d0a0dd1eb3
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline regression before optional remote SELECT
        run: |
          python -m unittest -q tests.test_kyoto_impl23_unactivated_readonly_probe tests.test_kyoto_impl23_manual_probe tests.test_kyoto_impl23_claim_preflight
      - name: No-JRA no-mutation production table read probe
        run: |
          python -m diagnostics.kyoto_impl23_unactivated_readonly_probe --day "${{ inputs.race_day }}" --manual-read-only
