name: Kyoto Nov15 gated official links observation encrypted originals
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/nov15_observation_explicit_activation.txt']
permissions:
  contents: read
  actions: read
concurrency:
  group: kyoto-nov15-source-acquisition-single-coordinator
  cancel-in-progress: false
jobs:
  capture-encrypted:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed offline source parsers and authenticated encryption
        run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Confirm explicit activation, encryption key and run history BEFORE JRA GET
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p nov15_encrypted_evidence
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          from urllib.request import Request,urlopen
          gate=Path("diagnostics/nov15_observation_explicit_activation.txt")
          if not gate.is_file() or gate.is_symlink() or gate.read_text().strip()!="NOV15-OBSERVE-TWO-ORIGINALS":
              raise SystemExit("NOV15_OBSERVATION_NOT_EXPLICITLY_ACTIVATED")
          if os.getenv("GITHUB_RUN_ATTEMPT")!="1":
              raise SystemExit("NOV15_OBSERVATION_RERUN_BLOCKED")
          secret=os.environ.get("ARCHIVE_KEY","")
          if not re.fullmatch(r"[0-9a-fA-F]{64}",secret):
              raise SystemExit("NOV15_ENCRYPTED_ARCHIVE_SECRET_MISSING_OR_INVALID_NO_HTTP")
          # Repository-level API avoids depending on workflow presence in main.
          repo=os.environ["GITHUB_REPOSITORY"]
          own="Kyoto Nov15 gated official links observation encrypted originals"
          previous=[]
          seen=False
          complete=False
          for page in range(1,26):
              url=f"https://api.github.com/repos/{repo}/actions/runs?branch=jra-html-diagnostic-20261105&per_page=100&page={page}"
              request=Request(url,headers={
                  "Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "User-Agent":"KyotoAI-Nov15-SafeObserver"
              })
              with urlopen(request,timeout=12) as result:
                  record=json.load(result)
              runs=record.get("workflow_runs")
              if not isinstance(runs,list):
                  raise SystemExit("NOV15_OBSERVER_RUN_HISTORY_UNVERIFIED")
              for r in runs:
                  if r.get("name")==own:
                      if str(r.get("id"))==os.environ["GITHUB_RUN_ID"]:
                          seen=True
                      else:
                          previous.append(r.get("id"))
              if len(runs)<100:
                  complete=True
                  break
          if not complete or not seen or previous:
              raise SystemExit("NOV15_OBSERVER_ALREADY_STARTED_OR_HISTORY_UNVERIFIED")
          print("NOV15_OBSERVER_AUTHORIZED_AFTER_RUN_AND_ENCRYPTION_GATES")
          PY
      - name: Up to TWO bounded observed official PC GET requests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from diagnostics.kyoto_nov15_two_original_observer import observe
          receipt=observe("nov15_work_originals",
                          now_utc=datetime.now(timezone.utc).isoformat(),
                          allowed=True)
          print("NOV15_OBSERVER_STATE="+receipt["state"])
          print("NOV15_GET_ATTEMPTS="+str(receipt["http_requests_started"]))
          # Do not hide a failed/partial response behind green GitHub Actions.
          if receipt["state"]!="NOV15_MEETING_ORIGINALS_OBSERVED_NOT_RACECARD":
              raise SystemExit("NOV15_OFFICIAL_LINK_OBSERVATION_FAILED_CLOSED")
          PY
      - name: Encrypt originals and receipt prior to artifact upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,re,tarfile,io,secrets,shutil
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          source=Path("nov15_work_originals")
          out=Path("nov15_encrypted_evidence")
          out.mkdir(exist_ok=True)
          if not source.is_dir():
              (out/"safe_stop.json").write_text(json.dumps({"state":"NO_OFFICIAL_ORIGINALS",
                                            "HTTP_success_not_proven":True})+"\n")
              raise SystemExit("NO_ORIGINAL_EVIDENCE_TO_ENCRYPT")
          keyhex=os.environ.get("ARCHIVE_KEY","")
          if not re.fullmatch(r"[0-9a-fA-F]{64}",keyhex):
              raise SystemExit("ENCRYPTION_SECRET_INVALID_PLAINTEXT_NOT_UPLOADED")
          files=sorted(p for p in source.iterdir() if p.is_file() and not p.is_symlink())
          names={p.name for p in files}
          if not names <= {"official_selection.html","official_meeting.html","receipt.json"} or "receipt.json" not in names:
              raise SystemExit("UNEXPECTED_EVIDENCE_FILES_FAIL_CLOSED")
          contents=io.BytesIO()
          with tarfile.open(fileobj=contents,mode="w:gz") as t:
              for path in files:
                  t.add(path,arcname=path.name,recursive=False)
          aes=AESGCM(bytes.fromhex(keyhex))
          nonce=secrets.token_bytes(12)
          aad=(os.environ["GITHUB_REPOSITORY"]+"|"+os.environ["GITHUB_RUN_ID"]+"|20261115").encode()
          ciphertext=aes.encrypt(nonce,contents.getvalue(),aad)
          (out/"originals.tar.gz.aesgcm").write_bytes(ciphertext)
          manifest={"schema":"kyoto_nov15_encrypted_source_artifact.v1",
                    "day":"20261115",
                    "run_id":os.environ["GITHUB_RUN_ID"],
                    "nonce_hex":nonce.hex(),
                    "aad_utf8":aad.decode(),
                    "ciphertext_sha256":hashlib.sha256(ciphertext).hexdigest(),
                    "plaintext_not_uploaded":True,
                    "encryption":"AES-256-GCM"}
          (out/"manifest.json").write_text(json.dumps(manifest,sort_keys=True,indent=2)+"\n")
          shutil.rmtree(source)
          print("NOV15_ENCRYPTED_ARTIFACT_ONLY=TRUE")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-nov15-encrypted-observation-${{ github.run_id }}
          path: nov15_encrypted_evidence/
          retention-days: 30
          if-no-files-found: warn
