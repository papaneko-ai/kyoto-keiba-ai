name: Kyoto Nov15 gated official links observation encrypted originals
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/nov15_observation_explicit_activation.txt']
permissions:
  contents: read
  actions: read
concurrency:
  group: kyoto-nov15-source-acquisition-single-coordinator
  cancel-in-progress: false
jobs:
  capture-encrypted:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed offline source parsers and authenticated encryption
        run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Confirm explicit activation, encryption key and run history BEFORE JRA GET
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p nov15_encrypted_evidence
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          from urllib.request import Request,urlopen
          gate=Path("diagnostics/nov15_observation_explicit_activation.txt")
          if not gate.is_file() or gate.is_symlink() or gate.read_text().strip()!="NOV15-OBSERVE-TWO-ORIGINALS":
              raise SystemExit("NOV15_OBSERVATION_NOT_EXPLICITLY_ACTIVATED")
          if os.getenv("GITHUB_RUN_ATTEMPT")!="1":
              raise SystemExit("NOV15_OBSERVATION_RERUN_BLOCKED")
          from datetime import datetime,timezone
          from diagnostics.kyoto_nov15_two_original_observer import BEGIN,END
          now=datetime.now(timezone.utc)
          if not BEGIN <= now < END:
              raise SystemExit("NOV15_OBSERVER_OUTSIDE_TIME_WINDOW_NO_HTTP_RETRY_SAFE")
          secret=os.environ.get("ARCHIVE_KEY","")
          if not re.fullmatch(r"[0-9a-fA-F]{64}",secret):
              raise SystemExit("NOV15_ENCRYPTED_ARCHIVE_SECRET_MISSING_OR_INVALID_NO_HTTP")
          # Only completed failed runs with provably skipped HTTP steps can be retried.
          from diagnostics.kyoto_p1_github_attempt_history_gate import audit_previous_runs
          check=audit_previous_runs(
              repo=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GITHUB_TOKEN"],
              branch="jra-html-diagnostic-20261105",
              current_run_id=os.environ["GITHUB_RUN_ID"],
              workflow_name="Kyoto Nov15 gated official links observation encrypted originals",
              http_step="Up to TWO bounded observed official PC GET requests")
          print("NOV15_PROVEN_ZERO_HTTP_PRIOR_FAILURES="+str(len(check["prior_zero_http_runs"])))
          print("NOV15_OBSERVER_AUTHORIZED_AFTER_RUN_AND_ENCRYPTION_GATES")
          PY
      - name: Up to TWO bounded observed official PC GET requests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from diagnostics.kyoto_nov15_two_original_observer import observe
          receipt=observe("nov15_work_originals",
                          now_utc=datetime.now(timezone.utc).isoformat(),
                          allowed=True)
          print("NOV15_OBSERVER_STATE="+receipt["state"])
          print("NOV15_GET_ATTEMPTS="+str(receipt["http_requests_started"]))
          # Do not hide a failed/partial response behind green GitHub Actions.
          if receipt["state"]!="NOV15_MEETING_ORIGINALS_OBSERVED_NOT_RACECARD":
              raise SystemExit("NOV15_OFFICIAL_LINK_OBSERVATION_FAILED_CLOSED")
          PY
      - name: Encrypt originals and receipt prior to artifact upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,shutil
          from pathlib import Path
          from diagnostics.kyoto_nov15_encrypted_evidence import encrypt_evidence
          source=Path("nov15_work_originals")
          dest=Path("nov15_encrypted_evidence")
          if not source.is_dir():
              dest.mkdir(exist_ok=True)
              (dest/"safe_stop.json").write_text(json.dumps(
                  {"state":"NO_OFFICIAL_ORIGINALS","HTTP_success_not_proven":True})+"\n")
              raise SystemExit("NO_SOURCE_TO_ENCRYPT")
          encrypt_evidence(source,dest,key_hex=os.environ["ARCHIVE_KEY"],
              repo=os.environ["GITHUB_REPOSITORY"],run_id=os.environ["GITHUB_RUN_ID"])
          shutil.rmtree(source)
          print("NOV15_AUTHENTICATED_ENCRYPTED_ARTIFACT_ONLY=TRUE")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-nov15-encrypted-observation-${{ github.run_id }}
          path: nov15_encrypted_evidence/
          retention-days: 30
          if-no-files-found: warn
