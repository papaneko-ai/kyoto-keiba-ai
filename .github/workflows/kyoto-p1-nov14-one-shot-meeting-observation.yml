name: Kyoto Nov14 one bounded official JRA meeting navigation observation
on:
  workflow_dispatch:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths:
      - diagnostics/nov14_one_off_explicit_activation.txt
permissions:
  contents: read
concurrency:
  group: kyoto-nov14-single-official-meeting-observation
  cancel-in-progress: false
jobs:
  single-official-page:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test JRA official meeting link no-guessing and no-polling safeguards
        env:
          PYTHONPATH: .
        run: |
          python -m unittest -v tests.test_kyoto_p1_nov14_official_one_shot_nav
          python -m unittest -v tests.test_kyoto_p1_nov14_receipt_handoff
      - name: Reject premeeting date, stale run and rerun before any JRA HTTP
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import os
          from datetime import datetime,timezone
          from diagnostics.kyoto_race_day_http_gate import require_race_day_window
          require_race_day_window(now=datetime.now(timezone.utc),race_day="20261114",
            not_before_utc=datetime(2026,11,13,15,0,tzinfo=timezone.utc),
            latest_utc=datetime(2026,11,14,9,0,tzinfo=timezone.utc),
            run_attempt=os.environ.get("GITHUB_RUN_ATTEMPT"),
            event_name=os.environ.get("GITHUB_EVENT_NAME"))
          PY
      - name: Block Nov14 repeat GET after already-recorded failed one-shot
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from diagnostics.kyoto_nov14_attempt_guard import enforce_recorded_one_shot
          state=enforce_recorded_one_shot()
          print("NOV14_PRIOR_GET_ATTEMPT="+str(state["prior_attempted_GET"]))
          if not state["allow_JRA_GET"]:
              raise SystemExit("NOV14_ONE_SHOT_PREVIOUSLY_ATTEMPTED_NO_DUPLICATE_HTTP")
          PY
      - name: ONE limited official JRA GET only for Nov14 Kyoto meeting link
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from diagnostics.kyoto_p1_nov14_official_one_shot_nav import inspect_once
          r=inspect_once('jra_nov14_official_one_off',authorized_live_http=True)
          print('NOV14_OFFICIAL_MEETING_DISCOVERY_STATUS='+r['status'])
          print('JRA_HTTP_GET_LIMIT=ONE')
          print('NO_ODDS_OR_AUTOMATED_BETS=TRUE')
          print('ORIGINAL_SOURCE_BYTES_VALIDATED='+str(bool(r.get('source_sha256'))))
          PY
      - name: Independently bind original official selection receipt to next observed meeting URL
        env:
          PYTHONPATH: .
        run: |
          python -m diagnostics.kyoto_p1_nov14_receipt_handoff \
            --source-directory jra_nov14_official_one_off \
            --out jra_nov14_official_one_off/verified_meeting_handoff.json
          echo "NEXT_STAGE=OBSERVED_MEETING_ONLY_NEVER_GUESSED_RACECARD"
          echo "PRE_RACE_MARKETS_NOT_VERIFIED=TRUE"
      - name: Retain official original HTML and UTC SHA receipt with 30-day bounded artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-nov14-one-shot-meeting-link-source-proof
          path: jra_nov14_official_one_off/
          retention-days: 30
          if-no-files-found: warn
