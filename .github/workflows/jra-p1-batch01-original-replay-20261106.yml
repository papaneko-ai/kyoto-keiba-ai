name: Kyoto P1 independently replay batch 01 official original bytes
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/p1_batch01_replay_activation_20261106.txt']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 42165454077
          name: jra-p1-profile-batch-01-originals-20261106
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original_official_html
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Replay 6 source originals byte-for-byte, zero JRA HTTP
        run: |
          python diagnostics/jra_p1_batch01_original_replay.py \
            --artifact original_official_html \
            --out docs/diagnostics/jra_p1_profile_batches_20261106/replayed_batch_01
      - name: Persist structured rows and immutable provenance receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/jra_p1_profile_batches_20261106/replayed_batch_01
          git commit -m "Independently replay six verified JRA official profiles without new HTTP" || true
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
