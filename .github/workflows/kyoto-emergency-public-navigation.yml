name: Kyoto cancellation number evidence probe
on:
  push:
    branches: ['fix/impl30-nov29-source-diagnostics-20261128']
    paths: ['.github/workflows/kyoto-emergency-public-navigation.yml']
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '0b64019a0ca47bf1c389119e3169c06a4a033fef'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0
      - name: Inspect cancellation number and status in two already observed racecards
        env:
          PYTHONPATH: .
          KYOTO_TARGET_DAY: '20261129'
        run: |
          python - <<'PY'
          import json
          from urllib.request import build_opener,HTTPCookieProcessor
          from http.cookiejar import CookieJar
          from bs4 import BeautifulSoup
          from diagnostics.kyoto_nov15_two_original_observer import _read
          from diagnostics.kyoto_p1_nov14_official_one_shot_nav import NoRedirect
          from diagnostics.jra_one_shot_market_capture import RequestPacer
          from diagnostics.jra_pc_sp_benchmark import sp_rows
          client=build_opener(NoRedirect(),HTTPCookieProcessor(CookieJar()))
          pacer=RequestPacer(min_gap_seconds=2.0)
          for channel,url in [("PC","https://www.jra.go.jp/JRADB/accessD.html?CNAME=pw01dde0108202605081220261129/1B"),("SP","https://sp.jra.jp/JRADB/accessD.html?CNAME=sw01dde0108202605081220261129/A8")]:
              pacer.before_request()
              try:
                  raw=_read(client,url)
                  soup=BeautifulSoup(raw.decode("cp932",errors="replace"),"html.parser")
                  table=next(t for t in soup.select("table") if all(t.select_one("th."+x) for x in ("horse","num","waku"))) if channel=="PC" else soup.select("table")[0]
                  rows=[]
                  for tr in table.select("tr"):
                      n=tr.select_one("td.num" if channel=="PC" else ".uban")
                      a=tr.select_one('a[href*="/JRADB/accessU.html"]')
                      if not n or not a:continue
                      rows.append((n.get_text(" ",strip=True),a.get_text(strip=True)))
                      if "取消" in n.get_text(" ",strip=True) or "除外" in n.get_text(" ",strip=True) or a.get_text(strip=True)=="ビッグシーザー":
                          print(channel,"CANCELLED_NUMBER_CELL",str(n)[:3000])
                          print(channel,"CANCELLED_ROW_ATTRIBUTES",json.dumps(tr.attrs,ensure_ascii=False))
                          print(channel,"CANCELLED_NUMBER_PARENT",str(n.parent)[:500] if channel=="SP" else "")
                          print(channel,"CANCELLED_NAME_CELL",str(a.parent)[:800])
                  print(channel,"REGISTERED_ORDER",json.dumps(rows,ensure_ascii=False))
                  if channel=="SP":
                      try: print("SP_PARSE_COUNT",len(sp_rows(raw)))
                      except Exception as exc:print("SP_PARSE_ERROR",type(exc).__name__,str(exc)[:100])
              except Exception as exc:print(channel,"ERROR",type(exc).__name__,str(exc)[:100])
          PY
