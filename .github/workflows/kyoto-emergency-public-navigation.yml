name: Kyoto emergency public navigation diagnostic
on:
  push:
    branches: ['fix/impl30-nov29-source-diagnostics-20261128']
    paths: ['.github/workflows/kyoto-emergency-public-navigation.yml']
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0
      - name: Inspect bounded public navigation only
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json,re,time
          from urllib.request import Request,build_opener,HTTPRedirectHandler,HTTPCookieProcessor
          from urllib.error import HTTPError
          from urllib.parse import urlsplit,parse_qs
          from http.cookiejar import CookieJar
          from bs4 import BeautifulSoup
          class Boundary(HTTPRedirectHandler):
              def redirect_request(self,request,fp,code,msg,headers,newurl):
                  u=urlsplit(newurl)
                  print("REDIRECT_NOT_FOLLOWED",json.dumps({"code":code,"scheme":u.scheme,"host":u.hostname,"path":u.path,"query_keys":sorted(parse_qs(u.query))},ensure_ascii=False))
                  return None
          client=build_opener(Boundary(),HTTPCookieProcessor(CookieJar()))
          for label,url in [("PC_HOME","https://www.jra.go.jp/"),("PC_ENTRY","https://jra.jp/JRADB/accessD.html?CNAME=pw01dli00%2FF3"),("SP_HOME","https://sp.jra.jp/")]:
              time.sleep(2)
              try:
                  with client.open(Request(url,headers={"User-Agent":"KyotoRaceAI-Private-ReadOnly/0.1","Accept":"text/html"}),timeout=12) as response:
                      raw=response.read(1500001)
                      if response.status!=200 or response.geturl()!=url or len(raw)>1500000: continue
                  try: text=raw.decode("utf-8")
                  except UnicodeDecodeError: text=raw.decode("cp932",errors="replace")
                  soup=BeautifulSoup(text,"html.parser")
                  print(label,"bytes",len(raw))
                  for a in soup.select("a"):
                      title=a.get_text(" ",strip=True)
                      if "出馬表" in title and len(title)<35:
                          action=a.get("onclick","")
                          href=a.get("href","")
                          if re.fullmatch(r"[\w\s'\x22(),./:;?=%#&-]{0,200}",action) and re.fullmatch(r"[\w\s'\x22(),./:;?=%#&-]{0,200}",href):
                              print("ENTRY",json.dumps({"title":title,"action":action,"href":href},ensure_ascii=False))
                  for f in soup.select("form"):
                      print("FORM",json.dumps({"method":str(f.get("method","")),"action":str(f.get("action",""))[:150],"names":[str(i.get("name","")) for i in f.select("input") if i.get("name")]},ensure_ascii=False))
              except HTTPError as exc:
                  print(label,"HTTP",exc.code)
              except Exception as exc:
                  print(label,"ERROR",type(exc).__name__)
          PY
