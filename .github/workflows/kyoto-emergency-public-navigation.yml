name: Kyoto emergency exact collector navigation smoke
on:
  push:
    branches: ['fix/impl30-nov29-source-diagnostics-20261128']
    paths: ['.github/workflows/kyoto-emergency-public-navigation.yml']
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '0b64019a0ca47bf1c389119e3169c06a4a033fef'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0
      - name: Verify actual candidate public navigation and R12 roster only
        env:
          PYTHONPATH: .
          KYOTO_TARGET_DAY: '20261129'
        run: |
          python - <<'PY'
          import json,tempfile
          from pathlib import Path
          from datetime import datetime,timezone
          from diagnostics.kyoto_nov15_two_original_observer import observe,accept_observation
          from diagnostics.kyoto_g03_all_races import links,parse
          from diagnostics.kyoto_weekend_sp_discovery import discover
          from diagnostics.kyoto_nov29_public_forms import PC_ENTRY
          day="20261129"
          with tempfile.TemporaryDirectory() as tmp:
              root=Path(tmp)
              pc=observe(root/"pc",now_utc=datetime.now(timezone.utc).isoformat(),allowed=True,public_form_navigation=True,include_observed_racecard=True)
              print("PC_NAVIGATION",json.dumps({k:pc.get(k) for k in ("state","error_class","error_code","http_requests_started","racecard_original_fetched","observed_racecard_url")},ensure_ascii=False))
              if not pc.get("racecard_original_fetched"):raise SystemExit("PC_NAVIGATION_FAILED")
              proof=accept_observation(root/"pc")
              print("PC_PROVENANCE",proof["state"])
              observed=links((root/"pc/official_meeting.html").read_bytes(),PC_ENTRY,day)
              print("PC_UNIQUE_LINK_COUNT",len(observed))
              assert set(observed)==set(range(1,13))
              try:
                  data=parse((root/"pc/official_racecard.html").read_bytes(),day,12,pc["observed_racecard_url"],pc["racecard_captured_at_utc"])
                  print("PC_R12_ROSTER_COUNT",data["runner_count"])
                  print("PC_R12_START_TIME",data["start_time_jst"])
              except Exception as exc:
                  print("PC_R12_PARSE_ERROR",type(exc).__name__,str(exc)[:160])
                  raise
              sp=discover(root/"sp",day=day)
              counts={n:v["candidate_count"] for n,v in sp["per_race_observed_navigation_candidates"].items()}
              print("SP_NAVIGATION",json.dumps({"state":sp["state"],"counts":counts,"network_requests":sp["network_requests_started"]}))
              assert set(counts)==set(map(str,range(1,13))) and all(v==1 for v in counts.values())
              print("EXACT_CANDIDATE_NAVIGATION_OK")
          PY
