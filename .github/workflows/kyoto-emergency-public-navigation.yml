name: Kyoto emergency public navigation diagnostic
on:
  push:
    branches: ['fix/impl30-nov29-source-diagnostics-20261128']
    paths: ['.github/workflows/kyoto-emergency-public-navigation.yml']
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0
      - name: Inspect bounded public navigation only
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json,re,time
          from urllib.request import Request,build_opener,HTTPRedirectHandler,HTTPCookieProcessor
          from urllib.error import HTTPError
          from urllib.parse import urlsplit,parse_qs
          from http.cookiejar import CookieJar
          from bs4 import BeautifulSoup
          class Boundary(HTTPRedirectHandler):
              def redirect_request(self,request,fp,code,msg,headers,newurl):
                  u=urlsplit(newurl)
                  print("REDIRECT_NOT_FOLLOWED",json.dumps({"code":code,"scheme":u.scheme,"host":u.hostname,"path":u.path,"query_keys":sorted(parse_qs(u.query))},ensure_ascii=False))
                  return None
          client=build_opener(Boundary(),HTTPCookieProcessor(CookieJar()))
          from urllib.parse import urljoin,urlencode
          for label,url in [("PC_HOME","https://www.jra.go.jp/"),("SP_HOME","https://sp.jra.jp/")]:
              time.sleep(2)
              try:
                  with client.open(Request(url,headers={"User-Agent":"KyotoRaceAI-Private-ReadOnly/0.1","Accept":"text/html"}),timeout=12) as response:
                      raw=response.read(1500001)
                      if response.status!=200 or response.geturl()!=url or len(raw)>1500000: continue
                  try: text=raw.decode("utf-8")
                  except UnicodeDecodeError: text=raw.decode("cp932",errors="replace")
                  soup=BeautifulSoup(text,"html.parser")
                  hosts=("www.jra.go.jp","jra.jp") if label=="PC_HOME" else ("sp.jra.jp","app.jra.jp")
                  scripts=[]
                  for s in soup.select("script[src]"):
                      target=urljoin(url,s["src"])
                      u=urlsplit(target)
                      if u.scheme=="https" and u.hostname in hosts and u.path.startswith("/common/js/") and re.search(r"/common[^/]*\.js$",u.path) and not u.fragment:
                          if target not in scripts:scripts.append(target)
                  print(label,"COMMON_SCRIPT_SOURCES",json.dumps(scripts))
                  for target in scripts[:3]:
                      time.sleep(2)
                      try:
                          with client.open(Request(target,headers={"User-Agent":"KyotoRaceAI-Private-ReadOnly/0.1","Accept":"application/javascript"}),timeout=12) as res:
                              raw=res.read(500001)
                              if res.status!=200 or res.geturl()!=target or len(raw)>500000:continue
                          js=raw.decode("utf-8",errors="replace")
                          for m in re.finditer(r"(?:function\s+doAction\s*\(|doAction\s*=\s*function\s*\()",js):
                              excerpt=js[max(0,m.start()-120):m.start()+1800]
                              print(label,"DOACTION_DEFINITION",json.dumps(excerpt,ensure_ascii=False))
                          for line in js.splitlines():
                              if re.search(r"(?:jra\.jp|jra\.go\.jp)",line) and len(line)<300 and not "http:" in line:
                                  print(label,"HOST_CONSTANT",json.dumps(line.strip()))
                      except Exception as exc:
                          print(label,"SCRIPT_ERROR",type(exc).__name__)
                          break
              except Exception as exc:
                  print(label,"ERROR",type(exc).__name__)
          PY
