name: Impl26 Nov21 protected production pin offline release gate
on:
  push:
    branches:
      - release/impl26-nov21-sp12-verified-pin-20261120
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protected-schedule-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact eight slots, two independent evidence lanes and day pin guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path(".github/workflows/kyoto-20261121-22-two-source-production-observer.yml")
          s=p.read_text()
          expected=["15 0 21 11 *","15 1 21 11 *","5 2 21 11 *","50 2 21 11 *",
                    "15 0 22 11 *","15 1 22 11 *","10 2 22 11 *","55 2 22 11 *"]
          actual=[]
          for line in s.splitlines():
              if line.strip().startswith("- cron:"):
                  actual.append(line.split("'")[1])
          assert actual==expected,(actual,expected)
          candidate="de2544c1e9f9951a265419461267146b4023c2ab"
          previous="989aaba017c5450fed91b383421f5d2da53c6c69"
          assert s.count("COLLECTOR_SHA:")==2
          assert s.count(f"assert os.environ['COLLECTOR_SHA']=='{candidate}'")==2
          assert s.count(f"vars.KYOTO_NOV22_VERIFIED_COLLECTOR_SHA || '{previous}'")==2
          assert s.count("needs: pc-originals-independent")==1
          assert s.count("timeout-minutes: 20")==1 and s.count("timeout-minutes: 12")==1
          assert s.count("AES-GCM ciphertext or safe-stop receipt")==2
          assert s.count("KYOTO_TARGET_DAY:")==2
          assert s.count("tests.test_kyoto_sp_all12_observed_capture")==1
          assert "DAY22_CANDIDATE_NOT_PREFLIGHT_VERIFIED_NO_HTTP" in s
          assert s.count("actions/upload-artifact@v4")==4
          assert s.count("overwrite: true")==2
          assert s.count("if-no-files-found: error")==4
          assert "always() && steps.upload_pc_primary.outcome == 'failure'" in s
          assert "always() && steps.upload_sp_primary.outcome == 'failure'" in s
          for channel in ("pc", "sp"):
              marker="name: kyoto-"+channel+"-"
              assert s.count(marker)==2
              assert s.count("path: "+channel+"_sealed/")==2
          assert "path: pc_raw/" not in s and "path: sp_raw/" not in s
          assert "cancel-in-progress: false" in s
          print("NOV21_PIN_PROTECTED; NOV22_PREAPPROVAL_UNCHANGED; 8_SCHEDULES_UNCHANGED")
          PY
