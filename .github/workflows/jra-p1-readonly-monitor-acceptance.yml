name: Kyoto P1 read-only Streamlit monitor acceptance
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths:
      - '.github/workflows/jra-p1-readonly-monitor-acceptance.yml'
      - 'diagnostics/p1_readonly_monitor_app.py'
      - 'diagnostics/p1_monitor_viewmodel.py'
      - 'tests/test_p1_monitor_viewmodel.py'
      - 'diagnostics/p1_registry_reconcile.py'
      - 'tests/test_p1_registry_reconcile.py'
      - 'diagnostics/p2_historical_feature_matrix.py'
      - 'tests/test_p2_historical_feature_matrix.py'
      - 'docs/diagnostics/p2_historical_feature_matrix_20261107_148.csv'
      - 'diagnostics/jra_p1_historical_raw_inventory.py'
      - 'tests/test_jra_p1_historical_raw_inventory.py'
      - 'docs/diagnostics/jra_p1_batch14_96_profiles_20261106/feature_rows_148.json'
      - 'diagnostics/jra_p1_intake_bridge.py'
      - 'tests/test_jra_p1_intake_bridge.py'
      - 'docs/diagnostics/jra_p1_batch14_96_profiles_20261106/status.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Streamlit for isolated monitor testing
        run: python -m pip install 'streamlit>=1.38,<2'
      - name: Compile and validate actual archived receipt
        run: |
          python -m py_compile diagnostics/p1_readonly_monitor_app.py diagnostics/p1_monitor_viewmodel.py tests/test_p1_monitor_viewmodel.py diagnostics/p1_registry_reconcile.py tests/test_p1_registry_reconcile.py diagnostics/jra_p1_intake_bridge.py tests/test_jra_p1_intake_bridge.py diagnostics/p2_historical_feature_matrix.py tests/test_p2_historical_feature_matrix.py diagnostics/jra_p1_historical_raw_inventory.py tests/test_jra_p1_historical_raw_inventory.py
          python -m unittest discover -s tests -p 'test_p1_monitor_viewmodel.py' -v
          python -m unittest discover -s tests -p 'test_p1_registry_reconcile.py' -v
          python -m unittest discover -s tests -p 'test_p2_historical_feature_matrix.py' -v
          python -m unittest discover -s tests -p 'test_jra_p1_historical_raw_inventory.py' -v
          python -m unittest discover -s tests -p 'test_jra_p1_intake_bridge.py' -v
      - name: Inventory already-stored original HTML by SHA (no downloads)
        run: |
          python diagnostics/jra_p1_historical_raw_inventory.py \
            docs/diagnostics/jra_p1_batch14_96_profiles_20261106/feature_rows_148.json \
            docs/diagnostics \
            --output /tmp/p1_historical_original_availability.json
      - name: Retain original-availability evidence as a limited CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: p1-historical-original-availability
          path: /tmp/p1_historical_original_availability.json
          retention-days: 7
      - name: Run real Streamlit AppTest against repository status
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file('diagnostics/p1_readonly_monitor_app.py', default_timeout=20).run()
          assert not at.exception, [str(e.message) for e in at.exception]
          assert len(at.metric) >= 4, f'unexpected metrics {len(at.metric)}'
          assert at.error, 'must show prediction blocked state'
          assert any('77' in str(x.message) and '19' in str(x.message) for x in at.info), 'must distinguish 77 source-history and 19 verified empty'
          print('APPTEST_PASS: real 148-runner registry; 77 historical +19 verified-empty +52 missing; prediction blocked')
          PY
      - name: Launch Streamlit and verify HTTP health locally only
        run: |
          python -m streamlit run diagnostics/p1_readonly_monitor_app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/p1-streamlit.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health > /tmp/p1-health.txt; then
              cat /tmp/p1-health.txt
              exit 0
            fi
            sleep 1
          done
          cat /tmp/p1-streamlit.log
          exit 1
      - name: Ensure no JRA/network collecting logic was added to monitor
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['diagnostics/p1_readonly_monitor_app.py', 'diagnostics/p1_monitor_viewmodel.py']:
              s=Path(name).read_text()
              for token in ['requests.get(', 'urllib.request', 'socket.connect(', 'httpx.get(', 'subprocess.run(']:
                  assert token not in s, (name, token)
          print('MONITOR_READ_ONLY; historical JSON only; no JRA GET')
          PY
