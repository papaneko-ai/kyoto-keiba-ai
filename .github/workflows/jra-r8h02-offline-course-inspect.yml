name: Kyoto R8 horse02 offline course-token inspection
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/activation_r8h02_course_inspection_20261106.txt']
permissions:
  contents: write
  actions: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jra-html-diagnostic-20261105
      - uses: actions/download-artifact@v4
        with:
          run-id: 42171346385
          name: kyoto-r8h02-original-first-diagnostic
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: incident_originals
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Inspect two rejected course cells from SHA-matched original only
        run: python diagnostics/jra_r8h02_offline_course_inspection.py --artifact incident_originals --out docs/diagnostics/jra_p1_r8h02_diagnosis_20261106/course_cells.json
      - name: Commit offline course cell evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/jra_p1_r8h02_diagnosis_20261106/course_cells.json
          git commit -m "Record exact two unmatched JRA course field values from SHA original"
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
