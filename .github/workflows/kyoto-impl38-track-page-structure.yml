name: Impl38 inspect authenticated current official track source
on:
  push:
    branches: ['repair/impl38-track-page-structure-20261128']
    paths: ['.github/workflows/kyoto-impl38-track-page-structure.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'papaneko-ai/kyoto-keiba-ai' && github.ref == 'refs/heads/repair/impl38-track-page-structure-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KYOTO_TARGET_DAY: '20261128'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_AUX_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '58a75eab856c4eb81f28bb48c8750d3caa382d54'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Read only existing 15:30 original
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aux15" track-proof
          gh api 'repos/papaneko-ai/kyoto-keiba-ai/actions/runs/46117060392/artifacts?per_page=100' > "$RUNNER_TEMP/track-index.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"track-index.json").read_text())
          assert d["total_count"]==len(d["artifacts"])
          a=[x for x in d["artifacts"] if x["id"]==15252141771 and x["name"]=="kyoto-auxiliary-46117060392-20261128" and not x["expired"]]
          assert len(a)==1 and a[0]["digest"]=="sha256:e1d2c29a26b62adde8d743b9aee77aeae8cc071830f4fb586976fba0ebc44e1f"
          PY
          gh run download 46117060392 --repo papaneko-ai/kyoto-keiba-ai --name kyoto-auxiliary-46117060392-20261128 --dir "$RUNNER_TEMP/aux15"
      - name: Inspect exact same-day heading and current track fields
        env:
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
        run: |
          python - <<'PY'
          import json,os,re,tempfile
          from pathlib import Path
          from bs4 import BeautifulSoup
          from unittest.mock import patch
          from diagnostics.kyoto_nov15_encrypted_evidence import decrypt_evidence
          from diagnostics.kyoto_g05_official_track import parse_kyoto_track
          def denied(*a,**kw):raise AssertionError("network forbidden")
          def tag(t):return t.name+"".join("."+x for x in t.get("class",[]) if re.fullmatch(r"[A-Za-z0-9_-]{1,40}",x)) if getattr(t,"name",None) else ""
          def path(t):
              a=[]
              while getattr(t,"name",None) and len(a)<12:
                  a.append(tag(t));t=t.parent
              return "/".join(reversed(a))
          result={"source_http_requests":0}
          with tempfile.TemporaryDirectory() as td,patch("socket.socket.connect",side_effect=denied),patch("socket.create_connection",side_effect=denied):
              root=Path(td)/"raw";day="20261128"
              decrypt_evidence(Path(os.environ["RUNNER_TEMP"])/"aux15",root,key_hex=os.environ["ARCHIVE_KEY"],repo="papaneko-ai/kyoto-keiba-ai",run_id="46117060392")
              p=root/"g05_official_kyoto_track.html";raw=p.read_bytes();receipt=json.loads((root/"g05_track_receipt.json").read_text())
              replay=parse_kyoto_track(raw,day,receipt["source_url"],receipt["captured_at_utc"])
              assert replay["source_sha256"]==receipt["source_sha256"] and replay["same_day_official_meeting_heading_verified"]
              try:decoded=raw.decode("utf8",errors="strict")
              except UnicodeError:decoded=raw.decode("cp932",errors="strict")
              soup=BeautifulSoup(decoded,"html.parser")
              result["same_day_verified"]=True
              result["sections"]={}
              for t in soup.find_all(True):
                  s=t.get_text(" ",strip=True)
                  if len(s)>150 or not re.search(r"天候|馬場状態|芝.{0,12}(?:良|稍重|不良|重)|ダート.{0,12}(?:良|稍重|不良|重)|含水率|クッション値",s):continue
                  if t.name in ("a","script","style") or any(a.name in ("nav","footer") for a in t.parents):continue
                  result["sections"][path(t)]={"text":s,"parent":tag(t.parent),"children":[tag(c) for c in t.find_all(True,recursive=False)][:15]}
              result["sections"]=dict(list(result["sections"].items())[:100])
              result["old_observed_fields"]=[k for k in ("weather","turf_going","dirt_going","cushion_value","turf_moisture_finish_pct","turf_moisture_turn4_pct","dirt_moisture_finish_pct","dirt_moisture_turn4_pct") if replay[k] is not None]
          Path("track-proof/report.json").write_text(json.dumps(result,sort_keys=True,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(result,sort_keys=True,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impl38-track-page-structure
          path: track-proof/
          retention-days: 90
          if-no-files-found: error
