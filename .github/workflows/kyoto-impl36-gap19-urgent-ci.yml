name: Kyoto Impl36 GAP19 urgent still-prestart SP order
on:
  push:
    branches: ['impl36-gap19-urgent-prestart-order-20261127']
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONPATH: .
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - run: python -m unittest -v tests.test_kyoto_impl36_gap19_urgent tests.test_kyoto_impl31_sp_gap_plan tests.test_kyoto_sp_all12_observed_capture
