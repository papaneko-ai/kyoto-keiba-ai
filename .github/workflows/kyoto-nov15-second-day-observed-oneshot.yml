name: Kyoto Nov15 second-day PC original-observed one-shot diagnostic
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/nov15_pc_explicit_activation.txt']
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Exact text NOV15-ONE-SHOT-READ-ONLY (one dispatch per day, no rerun)'
        required: true
        default: 'NO'
      race_spec_path:
        description: 'Independently observed Nov15 PC race identity JSON in docs/diagnostics'
        required: true
      current_roster_path:
        description: 'Same-race Nov15 numbered roster JSON in docs/diagnostics'
        required: true
      official_selection_original_path:
        description: 'Saved JRA entry-selection HTML original in docs/diagnostics'
        required: true
      official_meeting_original_path:
        description: 'Saved Nov15 Kyoto meeting HTML original in docs/diagnostics'
        required: true
      race_start_utc:
        description: 'Independently checked Nov15 Kyoto race start (UTC with Z suffix)'
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: kyoto-20261115-separate-official-pc-one-shot
  cancel-in-progress: false
jobs:
  nov15-bounded-diagnostic:
    if: github.event_name == 'push' || github.event.inputs.confirmation == 'NOV15-ONE-SHOT-READ-ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SPEC: ${{ inputs.race_spec_path || 'docs/diagnostics/nov15_pc_observed_race_spec.json' }}
      ROSTER: ${{ inputs.current_roster_path || 'docs/diagnostics/nov15_pc_current_roster.json' }}
      OFFICIAL_SELECTION: ${{ inputs.official_selection_original_path || 'docs/diagnostics/nov15_pc_official_selection.html' }}
      OFFICIAL_MEETING: ${{ inputs.official_meeting_original_path || 'docs/diagnostics/nov15_pc_official_meeting.html' }}
      START_UTC: ${{ inputs.race_start_utc || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing HTML parser only
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Before any JRA GET verify event identity, one attempt and original-observed Nov15 navigation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nov15_pc_one_shot
          python - <<'PY'
          import json,os,re,sys
          from pathlib import Path
          from urllib.request import Request,urlopen
          from diagnostics.kyoto_nov14_nov15_second_day_handoff import classify_day14_capture

          for key in ("SPEC","ROSTER","OFFICIAL_SELECTION","OFFICIAL_MEETING"):
              p=os.environ[key]
              if (not re.fullmatch(r"docs/diagnostics/[A-Za-z0-9_./-]+\.(json|html)",p)
                  or ".." in p.split("/") or not Path(p).is_file() or Path(p).is_symlink()):
                  raise SystemExit("NOV15_SAVED_ORIGINAL_PATH_REQUIRED:"+key)
          for key in ("SPEC","ROSTER"):
              if not os.environ[key].endswith(".json"):
                  raise SystemExit("NOV15_JSON_REQUIRED:"+key)
          for key in ("OFFICIAL_SELECTION","OFFICIAL_MEETING"):
              if not os.environ[key].endswith(".html"):
                  raise SystemExit("NOV15_HTML_REQUIRED:"+key)
          if os.environ.get("GITHUB_RUN_ATTEMPT")!="1":
              raise SystemExit("NOV15_NO_WORKFLOW_RERUN")
          if os.environ.get("GITHUB_EVENT_NAME")=="push":
              gate=Path("diagnostics/nov15_pc_explicit_activation.txt")
              if not gate.is_file() or gate.read_text(encoding="utf8").strip()!="NOV15-ONE-SHOT-READ-ONLY":
                  raise SystemExit("NOV15_PUSH_EXPLICIT_ACTIVATION_MISSING")
              if not os.environ["START_UTC"]:
                  settings=Path("docs/diagnostics/nov15_pc_verified_start_utc.txt")
                  if not settings.is_file():
                      raise SystemExit("NOV15_VERIFIED_START_NOT_PROVIDED")
                  start=settings.read_text(encoding="utf8").strip()
                  if not re.fullmatch(r"2026-11-15T[0-2]\d:[0-5]\d:[0-5]\dZ",start):
                      raise SystemExit("NOV15_START_UTC_FILE_INVALID")
                  with open(os.environ["GITHUB_ENV"],"a",encoding="utf8") as out:
                      out.write("START_UTC="+start+"\n")
          elif os.environ.get("GITHUB_EVENT_NAME")!="workflow_dispatch":
              raise SystemExit("NOV15_UNEXPECTED_TRIGGER")
          repo=os.environ["GITHUB_REPOSITORY"]
          # Repository-level endpoint works even if this new workflow is not
          # registered on the default branch. Query the entire development
          # branch run history, not only the first 100 entries.
          expected_name="Kyoto Nov15 second-day PC original-observed one-shot diagnostic"
          expected_file="kyoto-nov15-second-day-observed-oneshot.yml"
          known_other_capture_names={
              "JRA observed PC-SP prereace odds one-shot (manual diagnostic only)",
          }
          prior=[]
          current_seen=False
          recent_other=[]
          complete=False
          for page in range(1,26):
              url=(f"https://api.github.com/repos/{repo}/actions/runs"
                   f"?branch=jra-html-diagnostic-20261105&per_page=100&page={page}")
              request=Request(url,headers={
                  "Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28",
                  "User-Agent":"KyotoAI-Nov15-SingleTrialGuard"
              })
              with urlopen(request,timeout=12) as response:
                  records=json.load(response).get("workflow_runs")
              if not isinstance(records,list):
                  raise SystemExit("NOV15_RUN_AUDIT_RESPONSE_INVALID")
              for item in records:
                  if not isinstance(item,dict) or "id" not in item:
                      raise SystemExit("NOV15_RUN_AUDIT_ENTRY_INVALID")
                  run_id=str(item["id"])
                  name=item.get("name")
                  path=item.get("path") or ""
                  own=(name==expected_name or
                       path.split("@",1)[0].endswith("/"+expected_file))
                  if own:
                      if run_id==os.environ["GITHUB_RUN_ID"]:
                          current_seen=True
                      else:
                          prior.append(run_id)
                  if (name in known_other_capture_names
                      and (item.get("created_at") or "")>="2026-11-14T10:00:00Z"):
                      recent_other.append(run_id)
              if len(records)<100:
                  complete=True
                  break
          if not complete or not current_seen:
              raise SystemExit("NOV15_PRIOR_RUN_AUDIT_INCOMPLETE")
          if prior or recent_other:
              raise SystemExit("NOV15_PRIOR_DISPATCH_OR_OTHER_CAPTURE_ALREADY_EXISTS_NO_REPEAT")
          # This is a recorded, day14-only failure, not proof of day15 success.
          incident=Path("docs/diagnostics/nov14_existing_attempt_safe_stop_20261113.md").read_text()
          if "43142384975" not in incident or "attempted_GET=1" not in incident:
              raise SystemExit("NOV14_INCIDENT_NOT_LOCKED")
          state=classify_day14_capture({"attempted_GET":1,"status":"FAILED_CLOSED"})
          assert state["nov14_retry_authorized"] is False
          print("NOV14_EXISTING_ATTEMPT_NOT_REPEATED=TRUE")
          print("NOV15_INDEPENDENT_RUN_CHECKED=TRUE")
          print("JRA_GET_BEFORE_OFFLINE_EVIDENCE_GATES=0")
          PY
          if [ -z "$START_UTC" ]; then
            START_UTC="$(cat docs/diagnostics/nov15_pc_verified_start_utc.txt)"
            export START_UTC
          fi
          python -m diagnostics.kyoto_nov14_nov15_second_day_handoff \
            --spec "$SPEC" \
            --roster "$ROSTER" \
            --selection-original "$OFFICIAL_SELECTION" \
            --meeting-original "$OFFICIAL_MEETING" \
            --verified-start-utc "$START_UTC" \
            --receipt-output nov15_pc_one_shot/nov15_preflight_receipt.json
          python -m unittest discover -s tests -p 'test_kyoto_nov14_nov15_second_day_handoff.py' -v
      - name: Single bounded Nov15 observed PC racecard and market fetch
        shell: bash
        run: |
          set -euo pipefail
          python -m diagnostics.jra_one_shot_market_capture \
            --channel PC \
            --verified-start-utc "$START_UTC" \
            --active-roster-json "$ROSTER" \
            --race-spec-json "$SPEC" \
            --authorized-live-http \
            --out nov15_pc_one_shot/captured
          echo NOV15_SOURCE_ONLY_NOT_LIVE_CERTIFICATION=TRUE
          echo NO_AUTOMATED_RETRY=TRUE
          echo NO_REAL_BETS=TRUE
      - name: Always preserve original receipts and reasons for safe-stop
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-nov15-observed-pc-one-shot-${{ github.run_id }}
          path: nov15_pc_one_shot/
          retention-days: 30
          if-no-files-found: warn
