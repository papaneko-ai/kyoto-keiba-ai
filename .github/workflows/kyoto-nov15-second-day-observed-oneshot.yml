name: Kyoto Nov15 second-day PC original-observed one-shot diagnostic
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/nov15_pc_explicit_activation.txt']
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Exact text NOV15-ONE-SHOT-READ-ONLY (one dispatch per day, no rerun)'
        required: true
        default: 'NO'
      race_spec_path:
        description: 'Independently observed Nov15 PC race identity JSON in docs/diagnostics'
        required: true
      current_roster_path:
        description: 'Same-race Nov15 numbered roster JSON in docs/diagnostics'
        required: true
      observer_run_id:
        description: 'Nov15 encrypted observation workflow run ID; original HTML stays out of public Git'
        required: true
      race_start_utc:
        description: 'Independently checked Nov15 Kyoto race start (UTC with Z suffix)'
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: kyoto-nov15-source-acquisition-single-coordinator
  cancel-in-progress: false
jobs:
  nov15-bounded-diagnostic:
    if: github.event_name == 'push' || github.event.inputs.confirmation == 'NOV15-ONE-SHOT-READ-ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SPEC: ${{ inputs.race_spec_path || 'docs/diagnostics/nov15_pc_observed_race_spec.json' }}
      ROSTER: ${{ inputs.current_roster_path || 'docs/diagnostics/nov15_pc_current_roster.json' }}
      OFFICIAL_SELECTION: nov15_decrypted/official_selection.html
      OFFICIAL_MEETING: nov15_decrypted/official_meeting.html
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
      OBSERVER_RUN: ${{ inputs.observer_run_id || '' }}
      GH_TOKEN: ${{ github.token }}
      START_UTC: ${{ inputs.race_start_utc || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing HTML parser only
        run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Download and authenticate AES-GCM source originals from preceding observation run
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OBSERVER_RUN" ]; then
            if [ ! -f docs/diagnostics/nov15_observer_run_id.txt ]; then
              echo "NOV15_PRIOR_OBSERVER_RUN_REQUIRED_NO_HTTP"
              exit 1
            fi
            OBSERVER_RUN="$(cat docs/diagnostics/nov15_observer_run_id.txt)"
          fi
          if ! [[ "$OBSERVER_RUN" =~ ^[0-9]+$ ]]; then
            echo "NOV15_INVALID_OBSERVER_RUN_ID"
            exit 1
          fi
          if ! [[ "$ARCHIVE_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "NOV15_ARCHIVE_ENCRYPTION_SECRET_MISSING_NO_HTTP"
            exit 1
          fi
          mkdir -p nov15_encrypted_download
          # Identify the actual observation workflow. Do not guess artifact names or
          # permit another run to masquerade as the trusted source.
          OBSERVER_ARTIFACT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$OBSERVER_RUN" | \
            python -m diagnostics.kyoto_nov15_observer_artifact_identity --run-id "$OBSERVER_RUN")"
          gh run download "$OBSERVER_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$OBSERVER_ARTIFACT" \
            --dir nov15_encrypted_download
          python -m diagnostics.kyoto_nov15_encrypted_evidence \
            --decrypt \
            --source nov15_encrypted_download \
            --destination nov15_decrypted \
            --source-run-id "$OBSERVER_RUN"
          python - <<'PY'
          from diagnostics.kyoto_nov15_two_original_observer import accept_observation
          r=accept_observation("nov15_decrypted")
          if r["state"]!="TWO_ORIGINALS_MATCH_RECEIPT_ONLY":
              raise SystemExit("NOV15_OBSERVATION_ORIGINALS_INVALID")
          print("NOV15_ENCRYPTED_OBSERVATION_ORIGINALS_RESTORED_FOR_THIS_RUN")
          print("NOV15_NO_JRA_HTTP_DURING_SOURCE_TRANSFER")
          PY
      - name: Before any JRA GET verify event identity, one attempt and original-observed Nov15 navigation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nov15_pc_one_shot
          python - <<'PY'
          import json,os,re,sys
          from pathlib import Path
          from urllib.request import Request,urlopen
          from diagnostics.kyoto_nov14_nov15_second_day_handoff import classify_day14_capture

          for key in ("SPEC","ROSTER"):
              p=os.environ[key]
              if (not re.fullmatch(r"docs/diagnostics/[A-Za-z0-9_./-]+\.json",p)
                  or ".." in p.split("/") or not Path(p).is_file() or Path(p).is_symlink()):
                  raise SystemExit("NOV15_SAVED_RACE_IDENTITY_REQUIRED:"+key)
          for key in ("OFFICIAL_SELECTION","OFFICIAL_MEETING"):
              p=Path(os.environ[key])
              if (p.parent!=Path("nov15_decrypted") or not p.is_file() or
                  p.is_symlink() or p.name not in ("official_selection.html","official_meeting.html")):
                  raise SystemExit("NOV15_ENCRYPTED_SOURCE_NOT_RESTORED:"+key)
          if os.environ.get("GITHUB_RUN_ATTEMPT")!="1":
              raise SystemExit("NOV15_NO_WORKFLOW_RERUN")
          if os.environ.get("GITHUB_EVENT_NAME")=="push":
              gate=Path("diagnostics/nov15_pc_explicit_activation.txt")
              if not gate.is_file() or gate.read_text(encoding="utf8").strip()!="NOV15-ONE-SHOT-READ-ONLY":
                  raise SystemExit("NOV15_PUSH_EXPLICIT_ACTIVATION_MISSING")
              if not os.environ["START_UTC"]:
                  settings=Path("docs/diagnostics/nov15_pc_verified_start_utc.txt")
                  if not settings.is_file():
                      raise SystemExit("NOV15_VERIFIED_START_NOT_PROVIDED")
                  start=settings.read_text(encoding="utf8").strip()
                  if not re.fullmatch(r"2026-11-15T[0-2]\d:[0-5]\d:[0-5]\dZ",start):
                      raise SystemExit("NOV15_START_UTC_FILE_INVALID")
                  with open(os.environ["GITHUB_ENV"],"a",encoding="utf8") as out:
                      out.write("START_UTC="+start+"\n")
          elif os.environ.get("GITHUB_EVENT_NAME")!="workflow_dispatch":
              raise SystemExit("NOV15_UNEXPECTED_TRIGGER")
          from diagnostics.kyoto_p1_github_attempt_history_gate import audit_previous_runs
          state=audit_previous_runs(
              repo=os.environ["GITHUB_REPOSITORY"],
              token=os.environ["GITHUB_TOKEN"],
              branch="jra-html-diagnostic-20261105",
              current_run_id=os.environ["GITHUB_RUN_ID"],
              workflow_name="Kyoto Nov15 second-day PC original-observed one-shot diagnostic",
              http_step="Single bounded Nov15 observed PC racecard and market fetch")
          print("NOV15_PRE_HTTP_RETRY_COUNT="+str(len(state["prior_zero_http_runs"])))
          # This is a recorded, day14-only failure, not proof of day15 success.
          incident=Path("docs/diagnostics/nov14_existing_attempt_safe_stop_20261113.md").read_text()
          if "43142384975" not in incident or "attempted_GET=1" not in incident:
              raise SystemExit("NOV14_INCIDENT_NOT_LOCKED")
          state=classify_day14_capture({"attempted_GET":1,"status":"FAILED_CLOSED"})
          assert state["nov14_retry_authorized"] is False
          print("NOV14_EXISTING_ATTEMPT_NOT_REPEATED=TRUE")
          print("NOV15_INDEPENDENT_RUN_CHECKED=TRUE")
          print("JRA_GET_BEFORE_OFFLINE_EVIDENCE_GATES=0")
          PY
          if [ -z "$START_UTC" ]; then
            START_UTC="$(cat docs/diagnostics/nov15_pc_verified_start_utc.txt)"
            export START_UTC
          fi
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          from diagnostics.jra_one_shot_market_capture import ObservedRaceSpec
          from diagnostics.jra_odds_source_archive import aware_utc
          spec=ObservedRaceSpec(**json.loads(Path(os.environ["SPEC"]).read_text(encoding="utf8"))).validate(require_channels=("PC",))
          now=datetime.now(timezone.utc)
          start=aware_utc(os.environ["START_UTC"])
          opening=aware_utc(spec.normal_sales_open_utc)
          if (now < opening or now >= start-timedelta(minutes=10) or
              start.astimezone(__import__("zoneinfo").ZoneInfo("Asia/Tokyo")).strftime("%Y%m%d")!="20261115"):
              raise SystemExit("NOV15_PC_OUTSIDE_MARKET_WINDOW_NO_HTTP_RETRY_SAFE")
          print("NOV15_MARKET_WINDOW_PRE_GET_ACCEPTED")
          PY
          python -m diagnostics.kyoto_nov14_nov15_second_day_handoff \
            --spec "$SPEC" \
            --roster "$ROSTER" \
            --selection-original "$OFFICIAL_SELECTION" \
            --meeting-original "$OFFICIAL_MEETING" \
            --verified-start-utc "$START_UTC" \
            --receipt-output nov15_pc_one_shot/nov15_preflight_receipt.json
          python -m unittest discover -s tests -p 'test_kyoto_nov14_nov15_second_day_handoff.py' -v
      - name: Single bounded Nov15 observed PC racecard and market fetch
        shell: bash
        run: |
          set -euo pipefail
          python -m diagnostics.jra_one_shot_market_capture \
            --channel PC \
            --verified-start-utc "$START_UTC" \
            --active-roster-json "$ROSTER" \
            --race-spec-json "$SPEC" \
            --auto-repair-broken-pc-link \
            --authorized-live-http \
            --out nov15_pc_one_shot/captured
          python -m diagnostics.kyoto_nov15_capture_acceptance \
            --directory nov15_pc_one_shot/captured \
            --spec "$SPEC"
          echo NOV15_SOURCE_ONLY_NOT_LIVE_CERTIFICATION=TRUE
          echo NO_AUTOMATED_RETRY=TRUE
          echo NO_REAL_BETS=TRUE
      - name: Always encrypt complete capture receipts and source HTML before upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nov15_pc_one_shot
          if [ ! -f nov15_pc_one_shot/nov15_preflight_receipt.json ]; then
            printf '{"state":"STOPPED_BEFORE_SOURCE_PREFLIGHT","no_real_source_claim":true}\n' > nov15_pc_one_shot/nov15_preflight_receipt.json
          fi
          python -m diagnostics.kyoto_nov15_full_capture_seal \
            --source nov15_pc_one_shot \
            --destination nov15_encrypted_capture
          echo NOV15_NO_PLAINTEXT_SOURCE_ARTIFACT=TRUE
      - name: Upload AES-GCM sealed originals and receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-nov15-encrypted-capture-${{ github.run_id }}
          path: nov15_encrypted_capture/
          retention-days: 30
          if-no-files-found: warn
