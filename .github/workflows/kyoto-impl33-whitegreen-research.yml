name: Kyoto Impl33 public workout source sample
on:
  push:
    branches: ['fix/impl33-whitegreen-research-20261126']
permissions:
  contents: read
jobs:
  isolated-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONPATH: .
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_AUX_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0
      - name: Verify exact source and regression tests
        run: |
          set -euo pipefail
          mkdir -p workout_probe
          git rev-parse HEAD > workout_probe/head.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m unittest discover -s tests -p 'test_kyoto_impl3*_workout_intake.py' -v 2>&1 | tee workout_probe/intake.log
          python -m unittest discover -s tests -p 'test_kyoto_impl33_whitegreen_probe.py' -v 2>&1 | tee workout_probe/probe_tests.log
      - name: Two observed public sample URLs only, no JRA HTTP or credentials
        run: python -m diagnostics.kyoto_impl33_whitegreen_probe --out workout_probe/receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-impl33-whitegreen-research-${{ github.run_id }}
          path: workout_probe/
          retention-days: 30
          if-no-files-found: error
