name: Nov22 actual JRA paired markets independently verify encrypted source
on:
  push:
    branches: [capture/nov22-remaining-races-real-market-originals-20261122]
    paths:
      - 'diagnostics/kyoto_nov22_market_original_independent_verify.py'
      - '.github/workflows/kyoto-nov22-verify-actual-market-originals.yml'
permissions:
  contents: read
  actions: read
jobs:
  encrypted-12r-pair-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
      KYOTO_JRA_ARCHIVE_AES256_HEX: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47'
      - name: Download ciphertext-only actual JRA market originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nov22_market_source
          gh run download 44983969532 --repo "$GITHUB_REPOSITORY" --name kyoto-nov22-actual-market-originals-44983969532 --dir nov22_market_source
      - name: Independently check original SHA/size and actual market pair receipts for all 12R
        run: python -m diagnostics.kyoto_nov22_market_original_independent_verify
      - name: Retain offline independent receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-nov22-independent-market-proof-${{ github.run_id }}
          path: nov22_market_recheck/
          if-no-files-found: warn
          retention-days: 90
