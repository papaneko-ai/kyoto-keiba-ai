name: Kyoto implementation18 external timer no-JRA probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kyoto-implementation18-external-timer-probe.yml'
  workflow_dispatch:
    inputs:
      sent_unix:
        required: false
        description: 'UTC UNIX epoch at external timer send time'
        type: string
permissions:
  contents: read
jobs:
  timestamp-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Record actual GitHub event, startup latency and source
        shell: bash
        env:
          SENT_UNIX: ${{ inputs.sent_unix }}
        run: |
          set -euo pipefail
          mkdir -p external_timer_probe_receipt
          python - <<'PY'
          import json,os,re,time
          from datetime import datetime,timezone
          from pathlib import Path
          actual=os.environ["GITHUB_EVENT_NAME"]
          sent=os.environ.get("SENT_UNIX") or ""
          now=time.time()
          if sent:
              assert re.fullmatch(r'[0-9]{10}',sent),'INVALID_SEND_TIME'
              latency=round(now-int(sent),2)
              assert -30 < latency < 86400,'SENT_TIME_IMPLAUSIBLE'
          else:
              latency=None
          report={
              "event":actual,"run_id":os.environ["GITHUB_RUN_ID"],
              "head_sha":os.environ["GITHUB_SHA"],
              "started_observed_utc":datetime.fromtimestamp(now,timezone.utc).isoformat(),
              "external_timer_send_unix":int(sent) if sent else None,
              "post_to_job_seconds":latency,
              "external_provider_proven":False,
              "scheduled_provider_log_verified":False,
              "jra_http_requests":0,
              "data_collection_performed":False,
              "result":"PASS_NO_JRA_DIAGNOSTIC"
          }
          Path("external_timer_probe_receipt/receipt.json").write_text(json.dumps(report,indent=2,sort_keys=True))
          print("PROBE_EVENT="+actual)
          print("JRA_HTTP_REQUESTS=0")
          print("EXTERNAL_PROVIDER_PROVEN=False")
          PY
      - name: Save probe receipt even if invalid input
        if: always()
        shell: bash
        run: |
          mkdir -p external_timer_probe_receipt
          if [ ! -f external_timer_probe_receipt/receipt.json ]; then
            echo '{"result":"FAILED_OR_UNVERIFIED","external_provider_proven":false,"jra_http_requests":0}' > external_timer_probe_receipt/receipt.json
          fi
      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto18-external-timer-probe-${{ github.run_id }}
          path: external_timer_probe_receipt/
          if-no-files-found: error
          retention-days: 30
