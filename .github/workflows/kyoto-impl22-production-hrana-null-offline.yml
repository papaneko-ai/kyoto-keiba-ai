name: Kyoto Nov21-22 production collector Hrana NULL offline regression
on:
  push:
    branches:
      - fix/impl22-prod-collector-hrana-null-20261119
    paths:
      - diagnostics/kyoto_turso_capture_claims.py
      - tests/test_kyoto_turso_capture_claims.py
      - tests/test_kyoto_impl22_production_null_regression.py
      - .github/workflows/kyoto-impl22-production-hrana-null-offline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-claim-safe-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate production claim reader and weekend runtime without outbound HTTP
        run: python -m unittest -v tests.test_kyoto_impl22_production_null_regression tests.test_kyoto_turso_capture_claims tests.test_kyoto_weekend_remote_claim_runtime tests.test_kyoto_weekend_production_workflow tests.test_kyoto_g06_claim_execution
