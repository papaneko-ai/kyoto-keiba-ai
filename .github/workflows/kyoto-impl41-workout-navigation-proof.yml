name: Kyoto Impl41 workout navigation evidence targeted proof
on:
  push:
    branches: ['fix/impl41-workout-navigation-evidence-20261128']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONPATH: .:tests
      KYOTO_TARGET_DAY: '20261128'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_AUX_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Test changed navigation checkpoint and original capture boundary
        run: python -m unittest -v tests.test_kyoto_impl33_workout_runtime.Runtime.test_index_checkpoint_precedes_discovery_no_extra_http tests.test_kyoto_impl33_workout_runtime.Runtime.test_index_original_survives_parser_exception tests.test_kyoto_impl33_workout_runtime.Runtime.test_index_seal_failure_does_not_stop_race_capture tests.test_kyoto_impl33_workout_runtime.Runtime.test_capture_independent_of_roster tests.test_kyoto_impl33_workout_runtime.Runtime.test_checkpoint_recoverable_and_idempotent
