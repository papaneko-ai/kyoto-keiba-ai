name: Impl38 G05 exact current-card nested layout inspection
on:
  push:
    branches: ['repair/impl38-g05-actual-layout-20261128']
    paths: ['.github/workflows/kyoto-impl38-g05-layout.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'papaneko-ai/kyoto-keiba-ai' && github.ref == 'refs/heads/repair/impl38-g05-actual-layout-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KYOTO_TARGET_DAY: '20261128'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_AUX_HTTP_APPROVED: 'NO'
      KYOTO_POSTRACE_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'c3b15355ba5a184e22cd87c34bc645538ce33200'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Reuse exact prior authenticated auxiliary artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aux" layout-proof
          gh api 'repos/papaneko-ai/kyoto-keiba-ai/actions/runs/46112551733/artifacts?per_page=100' > "$RUNNER_TEMP/aux-index.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"aux-index.json").read_text())
          assert d["total_count"]==len(d["artifacts"])
          a=[x for x in d["artifacts"] if x["id"]==15250785307 and x["name"]=="kyoto-auxiliary-46112551733-20261128" and not x["expired"]]
          assert len(a)==1 and a[0]["digest"]=="sha256:444a678b0c8a98f475b369bd3acd858b3be96e1adf64527bc8ca5f4adf780b2c"
          PY
          gh run download 46112551733 --repo papaneko-ai/kyoto-keiba-ai --name kyoto-auxiliary-46112551733-20261128 --dir "$RUNNER_TEMP/aux"
      - name: Nested weight and track markup (no raw names or actual values)
        env:
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
        run: |
          python - <<'PY'
          import json,os,re,tempfile
          from pathlib import Path
          from collections import Counter
          from bs4 import BeautifulSoup
          from unittest.mock import patch
          from diagnostics.kyoto_nov15_encrypted_evidence import decrypt_evidence
          from diagnostics.kyoto_g03_independent_partial import verify_partial
          from diagnostics.kyoto_g05_conditions import _MASS
          def denied(*a,**kw):raise AssertionError("network forbidden")
          def tag(t):
              if t is None or not getattr(t,"name",None):return ""
              return t.name+"".join("."+x for x in t.get("class",[]) if re.fullmatch(r"[A-Za-z0-9_-]{1,40}",x))
          def path(t,root):
              a=[]
              while t is not None and t is not root and len(a)<8:
                  a.append(tag(t));t=t.parent
              return "/".join(reversed(a))
          def fmt(s):
              s=re.sub(r"\s+"," ",s).strip()
              if re.fullmatch(r"[0-9０-９+＋−ー－\-()（）±.・ kgＫＧｋｇキロ計不未発表取消除外馬体重:\s:：]+",s) and len(s)<=50:
                  return re.sub(r"[0-9０-９]","N",s)
              return "other"
          result={"source_http_requests":0,"races":{}}
          with tempfile.TemporaryDirectory() as td,patch("socket.socket.connect",side_effect=denied),patch("socket.create_connection",side_effect=denied):
              raw=Path(td)/"raw";day="20261128"
              decrypt_evidence(Path(os.environ["RUNNER_TEMP"])/"aux",raw,key_hex=os.environ["ARCHIVE_KEY"],repo="papaneko-ai/kyoto-keiba-ai",run_id="46112551733")
              for n in verify_partial(raw,expected_day=day)["verified_race_numbers"]:
                  p=raw/f"g03_official_racecard_{n:02d}.html"
                  soup=BeautifulSoup(p.read_bytes().decode("cp932",errors="replace"),"html.parser")
                  tables=[t for t in soup.select("table") if all(t.select_one("th."+k) for k in ("horse","num","waku"))]
                  assert len(tables)==1
                  counts={}
                  for tr in tables[0].select("tr"):
                      h=tr.select_one("td.horse")
                      if h is None:continue
                      for t in h.find_all(True):
                          s=t.get_text(" ",strip=True)
                          k=path(t,h)
                          if not k:continue
                          c=counts.setdefault(k,Counter())
                          c[fmt(s)]+=1
                  conditions={}
                  for t in soup.find_all(True):
                      # Restrict to short dedicated label/value text, outside horse rows.
                      if t.find_parent("table") is not None:continue
                      s=t.get_text(" ",strip=True)
                      if len(s)>80 or not re.search(r"(?:芝|ダート|ダ)\s*(?:馬場|コース)?\s*[:：]?\s*(?:良|稍重|重|不良)|馬場状態",s):continue
                      k=path(t,soup)
                      if len(k)>300:continue
                      labels=sorted(set(m.group(0) for m in re.finditer(r"芝|ダート|馬場状態|馬場|稍重|不良|良|重|[:：]",s)))
                      if labels:conditions[k]={"labels":labels,"length":len(s)}
                  result["races"][str(n)]={"nested_cells":{k:dict(v) for k,v in counts.items()},"track_markup":conditions}
          Path("layout-proof/report.json").write_text(json.dumps(result,sort_keys=True,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(result,sort_keys=True,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impl38-g05-layout-proof
          path: layout-proof/
          retention-days: 90
          if-no-files-found: error
