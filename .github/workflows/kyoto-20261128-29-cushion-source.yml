name: Kyoto Nov28-29 independent official cushion source
on:
  workflow_run:
    workflows: ['Kyoto Nov28-29 independent encrypted original collection', 'Kyoto Nov28-29 afternoon auxiliary refresh']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      race_day:
        type: choice
        required: true
        options: ['20261128', '20261129']
      confirmation:
        required: true
        description: Enter NOV28-29-CUSHION-SOURCE-ONLY
permissions:
  contents: read
jobs:
  cushion-source-only:
    if: ${{ github.repository == 'papaneko-ai/kyoto-keiba-ai' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.confirmation == 'NOV28-29-CUSHION-SOURCE-ONLY') || (github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && (startsWith(github.event.workflow_run.created_at, '2026-11-28') || startsWith(github.event.workflow_run.created_at, '2026-11-29')) && ((github.event.workflow_run.event == 'schedule' && contains(fromJSON('["kyoto-native:15 0 28 11 *","kyoto-native:15 1 28 11 *","kyoto-native:15 0 29 11 *","kyoto-native:15 1 29 11 *","kyoto-native:30 3 28 11 *","kyoto-native:30 3 29 11 *"]'), github.event.workflow_run.display_title)) || (github.event.workflow_run.event == 'workflow_dispatch' && (contains(github.event.workflow_run.created_at, 'T00:') || contains(github.event.workflow_run.created_at, 'T01:') || contains(github.event.workflow_run.created_at, 'T03:')))))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    concurrency:
      group: kyoto-20261128-29-source-${{ (github.event_name == 'workflow_dispatch' && inputs.race_day == '20261128' || github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.created_at, '2026-11-28')) && '20261128' || '20261129' }}
      cancel-in-progress: false
      queue: max
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: ${{ (github.event_name == 'workflow_dispatch' && inputs.race_day == '20261128' || github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.created_at, '2026-11-28')) && '20261128' || '20261129' }}
      KYOTO_CUSHION_HTTP_APPROVED: 'YES'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_AUX_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '47cd7f9e881aa989b9f932373cfaf5278dea223a'
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Independently capture exactly one official cushion fragment
        env:
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '47cd7f9e881aa989b9f932373cfaf5278dea223a'
          python -m diagnostics.kyoto_impl36_cushion_capture --day "$KYOTO_TARGET_DAY" --out cushion_sealed
      - name: Preserve ciphertext only
        id: upload_cushion
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-cushion-${{ github.run_id }}-${{ env.KYOTO_TARGET_DAY }}
          path: cushion_sealed/
          retention-days: 90
          if-no-files-found: error
      - name: Retry identical encrypted archive only on upload failure
        if: ${{ always() && steps.upload_cushion.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-cushion-${{ github.run_id }}-${{ env.KYOTO_TARGET_DAY }}
          path: cushion_sealed/
          retention-days: 90
          if-no-files-found: error
          overwrite: true
