name: Kyoto F11 explained source-bound ranking F12 integrated acceptance
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths:
      - 'diagnostics/kyoto_f11_explained_ranking_bridge.py'
      - 'tests/test_kyoto_f11_explained_ranking_bridge.py'
      - '.github/workflows/kyoto-f11-explained-rank-f12-integrated.yml'
permissions:
  contents: read
jobs:
  F11-source-bound-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTML parser only
        run: python -m pip install beautifulsoup4
      - name: Execute existing P4/P5 original-source tests and F11 to F12 integration
        env:
          PYTHONPATH: .:tests
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_p5_source_bound_race_ranking_lab tests.test_kyoto_f11_explained_ranking_bridge
          echo F11_TO_F12_SOURCE_BOUND_LAB_INTEGRATION=PASS
          echo REAL_JRA_LIVE_PRE_RACE=NOT_PROVEN
      - name: Record exact unmodified F11 rubric SHA
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('docs/diagnostics/kyoto_final_completion_criteria_v1.json')
          r=json.loads(p.read_text())
          f=next(x for x in r['criteria'] if x['id']=='F11')
          assert f['points']==5 and f['title']=='推奨レースの選択と説明'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='92bae5c1d61d6ac00a5380dd8d5e08beb59f96c898b03c05a3c8bf8721ced632'
          print('F11_UNCHANGED_FIXED_ACCEPTANCE_CRITERION=PASS')
          PY

      - name: Produce complete source-bound P4->F11->F12 synthetic witness
        env:
          PYTHONPATH: .:tests
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from test_p5_source_bound_race_ranking_lab import SourceBoundRankingTests
          from diagnostics.kyoto_f11_explained_ranking_bridge import rank_f11,handoff_f11_to_f12
          fixture=SourceBoundRankingTests(methodName='test_real_p4_receipt_deterministic_ranking')
          fixture.setUp()
          try:
              comparisons=[fixture.report(1,1.2),fixture.report(2,0.9),
                           fixture.report(3,0.5),fixture.report(4,-0.2)]
              rank=rank_f11(comparisons=comparisons,day_budget_yen=10000,
                  ticket_type='QUINELLA',observed_utc='2026-11-14T03:00:00Z',
                  cutoff_utc='2026-11-14T03:05:00Z',
                  confidence_by_race={i:0.75 for i in range(1,5)})
              budget=handoff_f11_to_f12(ranking=rank,exposure_target_yen=3500)
              assert [r['race'] for r in rank['selected']]==[1,2,3]
              assert budget['f12_plan']['spent_yen']==3500
              out=Path('f11_f12_source_bound_witness')
              out.mkdir()
              data={
                  'schema':'kyoto_F11_F12_source_bound_offline_witness.v1',
                  'ci_run_id':os.environ['GITHUB_RUN_ID'],
                  'ci_head_sha':os.environ['GITHUB_SHA'],
                  'p4_comparisons':comparisons,'f11':rank,
                  'f12_handoff':budget,'source_scope':'SYNTHETIC_P4_MARKET_NOT_AUTHENTICATED_JRA',
                  'official_pre_race_data_verified':False,
                  'actual_paper_trade_registered':False,
                  'real_purchase_authorized':False
              }
              (out/'F11_F12_witness.json').write_text(
                  json.dumps(data,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
              print('F11_EXPLAINED_RANKED_3_OF_4_F12_SPENT_3500_UNSPENT_6500=PASS')
          finally:
              fixture.doCleanups()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kyoto-f11-f12-integrated-synthetic-source-witness
          path: f11_f12_source_bound_witness/
          retention-days: 7
          if-no-files-found: error
