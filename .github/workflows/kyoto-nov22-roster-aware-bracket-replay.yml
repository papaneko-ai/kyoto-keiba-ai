name: Nov22 actual roster-aware bracket numerical JRA market verification
on:
  push:
    branches: [capture/nov22-remaining-races-real-market-originals-20261122]
    paths:
      - 'diagnostics/kyoto_nov22_roster_aware_actual_bracket.py'
      - '.github/workflows/kyoto-nov22-roster-aware-bracket-replay.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify-actual-frame-eligible-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      KYOTO_JRA_ARCHIVE_AES256_HEX: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: actual
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2dce4f5fa9d0ce48e460a95664fe3207c7f95ba6
          path: frozen
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Acquire saved source only (no JRA HTTP)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frozen/market_src frozen/card_src
          gh run download 44983969532 --repo "$GITHUB_REPOSITORY" --name kyoto-nov22-actual-market-originals-44983969532 --dir frozen/market_src
          gh run download 44966013490 --repo "$GITHUB_REPOSITORY" --name kyoto-nov22-real-observed-all12-encrypted-44966013490 --dir frozen/card_src
      - name: Replay independently roster-aware same-frame market price parser on true Kyoto JRA source
        shell: bash
        run: |
          set -euo pipefail
          cd frozen
          PYTHONPATH=. python ../actual/diagnostics/kyoto_nov22_roster_aware_actual_bracket.py
      - name: Preserve independent per-race numeric outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-nov22-actual-bracket-roster-verified-${{ github.run_id }}
          path: frozen/roster_aware_result/
          retention-days: 90
          if-no-files-found: warn
