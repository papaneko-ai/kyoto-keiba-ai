name: Kyoto Impl36 cushion independent runtime preflight
on:
  push:
    branches: ['impl36-cushion-runtime-integration-20261127']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KYOTO_TARGET_DAY: '20261128'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: New runtime and affected encryption regression
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_kyoto_impl36_cushion_capture tests.test_kyoto_nov15_encrypted_evidence
