name: Kyoto P1 independent batch07 original replay
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/p1_batch07_replay_activation_20261106.txt']
permissions:
  contents: write
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 42167817939
          name: kyoto-p1-batch07-20261106
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: jra_originals
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Replay exact original SHA and prior form with zero HTTP
        run: |
          python diagnostics/jra_p1_batches07_08_original_replay.py \
            --batch batch_07 --artifact jra_originals \
            --out docs/diagnostics/jra_p1_profile_batches_20261106/replayed_batch_07
      - name: Save normalized historical form and SHA proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/jra_p1_profile_batches_20261106/replayed_batch_07
          git commit -m "Replay JRA official batch07 original six sources" || true
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
