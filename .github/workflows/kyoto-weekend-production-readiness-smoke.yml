name: Kyoto weekend fail-closed release containment NO JRA HTTP
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kyoto-weekend-production-readiness-smoke.yml'
      - '.github/workflows/kyoto-20261121-22-two-source-production-observer.yml'
      - 'docs/diagnostics/KYOTO_20261116_INDEPENDENT_RELEASE_BLOCKERS.json'
      - 'tests/test_kyoto_weekend_main_release_guard.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assert-no-unsafe-production-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute the actual two release stops and inspect open critical incidents offline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p weekend_guard_evidence
          python -m unittest -v tests.test_kyoto_weekend_main_release_guard 2>&1 | tee weekend_guard_evidence/containment_tests.log
          git rev-parse HEAD > weekend_guard_evidence/main_head.txt
          sha256sum weekend_guard_evidence/containment_tests.log > weekend_guard_evidence/tests.sha256
          echo 'RELEASE_STATE=BLOCKED_BY_UNRESOLVED_CRITICAL_INCIDENTS'
          echo 'REAL_JRA_HTTP=NOT_ATTEMPTED'
      - name: Retain immutable containment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-weekend-release-containment-${{ github.run_id }}
          path: weekend_guard_evidence/
          if-no-files-found: error
          retention-days: 30
