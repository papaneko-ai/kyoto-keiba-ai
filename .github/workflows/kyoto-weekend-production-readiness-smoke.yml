name: Kyoto Nov21-22 repaired source-only observation release readiness
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kyoto-weekend-production-readiness-smoke.yml'
      - '.github/workflows/kyoto-20261121-22-two-source-production-observer.yml'
      - 'docs/diagnostics/KYOTO_20261116_INDEPENDENT_RELEASE_BLOCKERS.json'
      - 'tests/test_kyoto_weekend_main_release_guard.py'
      - 'tests/test_kyoto_preparation_five_conditions.py'
      - 'docs/diagnostics/KYOTO_PREPARATION_FIVE_CONDITIONS_20261116.json'
      - 'docs/diagnostics/KYOTO_PREDICTABLE_FAILURE_MATRIX_20261116.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-only-main-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source-only risk boundary on actual main YAML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source_only_proof
          python -m unittest -v tests.test_kyoto_weekend_main_release_guard 2>&1 | tee source_only_proof/main_policy.log
          sha256sum source_only_proof/main_policy.log > source_only_proof/main_policy.sha256
          git rev-parse HEAD > source_only_proof/main_sha.txt
      - name: Keep independent main contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-main-observation-policy-${{ github.run_id }}
          path: source_only_proof/
          if-no-files-found: error
          retention-days: 30
  pre-weekend-settings-hazard-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
      DAY22_COLLECTOR_CANDIDATE: ${{ vars.KYOTO_NOV22_VERIFIED_COLLECTOR_SHA }}
    steps:
      - name: Check Saturday and Sunday critical settings without JRA requests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,urllib.request
          key=os.getenv("ARCHIVE_KEY","")
          if not re.fullmatch(r"[0-9a-fA-F]{64}",key):
              raise SystemExit("ARCHIVE_AES256_SECRET_MISSING_OR_INVALID")
          repo=os.environ["GITHUB_REPOSITORY"]
          headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "Accept":"application/vnd.github+json",
                   "X-GitHub-Api-Version":"2022-11-28"}
          for filename in ("kyoto-20261121-22-two-source-production-observer.yml",
                           "kyoto-20261121-22-result-handoff.yml"):
              req=urllib.request.Request("https://api.github.com/repos/"+repo+
                  "/actions/workflows/"+filename,headers=headers)
              with urllib.request.urlopen(req,timeout=12) as response:
                  obj=json.load(response)
              if obj.get("state")!="active":
                  raise SystemExit("WORKFLOW_NOT_ACTIVE:"+filename)
          candidate=os.getenv("DAY22_COLLECTOR_CANDIDATE","").strip()
          if candidate:
              if not re.fullmatch(r"[0-9a-f]{40}",candidate):
                  raise SystemExit("DAY22_OVERRIDE_SHA_MALFORMED")
              endpoint="https://api.github.com/repos/"+repo+"/actions/workflows/kyoto-weekend-20261121-22-preflight.yml/runs?per_page=100"
              with urllib.request.urlopen(urllib.request.Request(endpoint,headers=headers),timeout=12) as response:
                  history=json.load(response)
              if not any(r.get("head_sha")==candidate and r.get("conclusion")=="success"
                         for r in history.get("workflow_runs",[])):
                  raise SystemExit("DAY22_OVERRIDE_HAS_NO_MATCHING_PASSING_PREFLIGHT")
          print("DAY21_22_CRITICAL_SECRET_FORMAT_VALID=TRUE")
          print("DAY21_22_SCHEDULED_WORKFLOWS_ACTIVE=TRUE")
          print("DAY22_OVERRIDE_VERIFIED_OR_BASELINE_FALLBACK=TRUE")
          print("JRA_HTTP_REQUESTS=0")
          PY
  pinned-collector-fault-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 247e3b22987ec76d84afe22862ea98c8607cb2d6
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Test exact source SHA under both fault-injection and historical fixture dates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pinned_collector_proof
          test "$(git rev-parse HEAD)" = "247e3b22987ec76d84afe22862ea98c8607cb2d6"
          KYOTO_TARGET_DAY=20261121 python -m unittest -v tests.test_kyoto_weekend_interruption_and_pacing tests.test_kyoto_weekend_race_parity tests.test_kyoto_weekend_retry_guard tests.test_kyoto_safe_stop_artifact tests.test_kyoto_weekend_end_to_end tests.test_kyoto_weekend_day21_artifact_triage tests.test_kyoto_weekend_postflight tests.test_kyoto_weekend_production_workflow tests.test_kyoto_weekend_capture tests.test_kyoto_weekend_sp_discovery 2>&1 | tee pinned_collector_proof/new_cases.log
          KYOTO_TARGET_DAY=20261115 python -m unittest -v tests.test_kyoto_nov15_two_original_observer tests.test_kyoto_nov15_offline_race_links tests.test_kyoto_sp_observed_source tests.test_kyoto_nov15_encrypted_evidence 2>&1 | tee pinned_collector_proof/history.log
          KYOTO_TARGET_DAY=20261122 python -m unittest -v tests.test_kyoto_weekend_sp_discovery tests.test_kyoto_weekend_handoff_workflow tests.test_kyoto_nov15_encrypted_evidence tests.test_kyoto_weekend_postflight tests.test_kyoto_weekend_day21_triage tests.test_kyoto_weekend_day21_artifact_triage 2>&1 | tee pinned_collector_proof/sunday_fallback.log
          git rev-parse HEAD > pinned_collector_proof/collector_sha.txt
          sha256sum pinned_collector_proof/*.log > pinned_collector_proof/testlogs.sha256
          python -m unittest -v tests.test_kyoto_predictable_failure_gate 2>&1 | tee pinned_collector_proof/coverage_integrity.log
          python -m diagnostics.kyoto_predictable_failure_gate --report pinned_collector_proof/predictable_failure_matrix_run.json 2>&1 | tee pinned_collector_proof/coverage_execution.log
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('pinned_collector_proof/predictable_failure_matrix_run.json').read_text())
          assert r["passing"]==r["count"]==30
          assert r["live_jra_proven"] is False
          assert r["prediction_ready"] is False
          print("PINNED_COLLECTOR_PREDICTABLE_FAILURE_COVERAGE_30_30")
          PY
          echo 'OFFICIAL_JRA_HTTP_REQUESTS=0'
      - name: Keep fault-injection logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-pinned-collector-regressions-${{ github.run_id }}
          path: pinned_collector_proof/
          if-no-files-found: error
          retention-days: 30
  five-condition-pre-experiment-acceptance:
    if: always()
    needs: [source-only-main-policy, pre-weekend-settings-hazard-check, pinned-collector-fault-rehearsal]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_CONTRACT: ${{ needs.source-only-main-policy.result }}
      SETTINGS_GATE: ${{ needs.pre-weekend-settings-hazard-check.result }}
      FROZEN_COLLECTOR: ${{ needs.pinned-collector-fault-rehearsal.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate the five fixed conditions and actual upstream CI outcomes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p five_condition_evidence
          python -m unittest -v tests.test_kyoto_preparation_five_conditions 2>&1 | tee five_condition_evidence/static_contract_tests.log
          python - <<'PY'
          import json,os,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          policy=json.loads(Path("docs/diagnostics/KYOTO_PREPARATION_FIVE_CONDITIONS_20261116.json").read_text())
          jobs={"source-only-main-policy":os.getenv("SOURCE_CONTRACT"),
                "pre-weekend-settings-hazard-check":os.getenv("SETTINGS_GATE"),
                "pinned-collector-fault-rehearsal":os.getenv("FROZEN_COLLECTOR")}
          green=all(x=="success" for x in jobs.values())
          items=[{"id":x["id"],"verified":green,"description":x["description"]}
                 for x in policy["conditions"]]
          observed={"schema":"kyoto_fixed_five_preparation_receipt.v1",
                    "utc":datetime.now(timezone.utc).isoformat(),
                    "main_sha":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
                    "collector_sha":policy["collector_sha"],
                    "prerequisite_job_conclusions":jobs,
                    "criteria_total":len(items),
                    "criteria_verified":sum(x["verified"] for x in items),
                    "pre_experiment_percent":round(100*sum(x["verified"] for x in items)/len(items)),
                    "not_real_live_jra_success":True,
                    "not_prediction_release":True,"conditions":items}
          Path("five_condition_evidence/receipt.json").write_text(json.dumps(observed,indent=2,sort_keys=True)+"\n")
          print("FIXED_PREPARATION_CRITERIA="+str(observed["criteria_verified"])+"/"+str(observed["criteria_total"]))
          print("PRE_EXPERIMENT_PREPARATION_PERCENT="+str(observed["pre_experiment_percent"]))
          if len(items)!=5 or not green:
              raise SystemExit("FIXED_FIVE_PREPARATION_GATES_NOT_VERIFIED")
          PY
          sha256sum five_condition_evidence/receipt.json > five_condition_evidence/receipt.sha256
      - name: Retain five-condition evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-five-fixed-criteria-${{ github.run_id }}
          path: five_condition_evidence/
          if-no-files-found: warn
          retention-days: 30
