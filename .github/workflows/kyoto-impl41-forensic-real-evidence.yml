name: Kyoto Impl41 exact forensic continuity evidence probe
on:
  push:
    branches: ['probe/impl41-forensic-real-evidence-20261128']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: ${{ github.repository == 'papaneko-ai/kyoto-keiba-ai' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_POSTRACE_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 'c289c5ec4e6ad322a7e08acf173da3352ed23dba'
          path: trusted-reader
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '5a16e23d0f2148581dbe0b965d4672b22735602e'
          path: trusted-postrace-reader
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Diagnose exact GitHub log routes without exposing logs or credentials
        run: |
          python - <<'PY'
          import subprocess,tempfile,re,json,os
          repo=os.environ["GITHUB_REPOSITORY"]
          rid="46133297877";jid="140943012372"
          routes={
            "job_api":["gh","api",f"repos/{repo}/actions/jobs/{jid}/logs"],
            "run_view":["gh","run","view",rid,"--repo",repo,"--job",jid,"--log"],
            "run_api":["gh","api",f"repos/{repo}/actions/runs/{rid}/logs"],
          }
          rows=[]
          for name,args in routes.items():
            try:
              with tempfile.TemporaryFile() as f:
                x=subprocess.run(args,stdout=f,stderr=subprocess.PIPE,timeout=12)
                size=f.tell();f.seek(0);head=f.read(4)
                error=x.stderr.decode("utf8",errors="replace")
                statuses=re.findall(r"(?:HTTP |status code: |status code )([1-5][0-9]{2})",error)
                rows.append({"route":name,"exit":x.returncode,"bytes":size,"http_status":statuses,"zip":head==b"PK\x03\x04","not_found":"not found" in error.lower(),"permission":"permission" in error.lower() or "resource not accessible" in error.lower()})
            except Exception as e:rows.append({"route":name,"error_class":type(e).__name__})
          print("FORENSIC_LOG_ROUTES="+json.dumps(rows,sort_keys=True))
          PY
