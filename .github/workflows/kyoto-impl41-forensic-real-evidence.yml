name: Kyoto Impl41 exact forensic continuity evidence probe
on:
  push:
    branches: ['probe/impl41-forensic-real-evidence-20261128']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: ${{ github.repository == 'papaneko-ai/kyoto-keiba-ai' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_POSTRACE_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 'c289c5ec4e6ad322a7e08acf173da3352ed23dba'
          path: trusted-reader
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '5a16e23d0f2148581dbe0b965d4672b22735602e'
          path: trusted-postrace-reader
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Reopen real archived incident and preserve bounded job logs
        run: |
          python -m diagnostics.kyoto_incident_recovery --run-id 46133297877 --reader trusted-reader --cushion-reader trusted-reader --postrace-reader trusted-postrace-reader --out incident
          python - <<'PY'
          import json,os
          from pathlib import Path
          from diagnostics.kyoto_forensic_continuity import restore
          out=Path('incident')
          d=json.loads((out/'report.json').read_bytes())
          m=d['forensic_evidence']
          bind={'id':46133297877,'head_sha':d['workflow_head_sha']}
          reopened=restore(out,os.environ['ARCHIVE_KEY'],bind)
          lane=d['lanes']['postrace']
          assert d['source_run_id']==46133297877
          assert m['state']=='SEALED_COMPLETE_LOG_SET'
          assert len(reopened['logs'])>=1
          assert lane['artifact_authenticated'] is True and lane['artifact_id']==15258294810
          assert len(lane['postrace_navigation_replay'])==13
          assert lane['receipt_failure_refs']['refs']
          assert d['open_repair_obligations'] and all(x['state']=='OPEN_REPAIR_REQUIRED' and not x['root_cause_proved'] for x in d['open_repair_obligations'])
          assert d['new_source_http_requests']==0 and d['automatic_code_promotion'] is False
          print('FORENSIC_REAL_PROBE='+json.dumps({'source_run_id':46133297877,'source_artifact_id':lane['artifact_id'],'candidate':'74c28dc14c71e204516fa8297233282f75a22ef0','restored_logs':len(reopened['logs']),'receipt_failure_refs':len(lane['receipt_failure_refs']['refs']),'observed_navigation_candidates':len(lane['postrace_navigation_replay']),'open_obligations':len(d['open_repair_obligations']),'ciphertext_sha256':m['ciphertext_sha256'],'source_http_requests':0},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-impl41-exact-forensic-probe
          path: incident/
          if-no-files-found: error
          retention-days: 90
