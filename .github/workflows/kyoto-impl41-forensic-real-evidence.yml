name: Kyoto Impl41 exact forensic continuity evidence probe
on:
  push:
    branches: ['probe/impl41-forensic-real-evidence-20261128']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: ${{ github.repository == 'papaneko-ai/kyoto-keiba-ai' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_POSTRACE_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Verify only new log fallback on exact completed source run
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from diagnostics.kyoto_incident_recovery import forensic_job_log
          from diagnostics.kyoto_forensic_continuity import capture,restore
          repo=os.environ['GITHUB_REPOSITORY'];rid=46133297877
          assert repo=='papaneko-ai/kyoto-keiba-ai'
          def api(s):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{rid}'+s],timeout=15))
          run=api('');jobs=api('/jobs?per_page=100');arts=api('/artifacts?per_page=100')
          assert run['id']==rid and run['head_sha']=='e1a682fd0d185830751508448e444c80eaca5567' and run['status']=='completed'
          assert [j['id'] for j in jobs['jobs']]==[140943012372]
          assert [a['id'] for a in arts['artifacts']]==[15258294810]
          out=Path('forensic-proof');key=os.environ['ARCHIVE_KEY']
          manifest,cache=capture(run,jobs,arts,out,key,lambda jid:forensic_job_log(rid,jid))
          restored=restore(out,key,run)
          assert manifest['state'] in ('SEALED_COMPLETE_LOG_SET','SEALED_WITH_RENDERED_LOGS')
          row=manifest['log_index'][0]
          assert row['state']=='LOG_BYTES_PRESERVED' and row['bytes']>0
          assert str(row['job_id']) in restored['logs']
          assert (row['job_id'] in cache)==(row['log_format']=='JOB_API_RAW')
          print('FORENSIC_FALLBACK_VERIFIED='+json.dumps({'candidate':'bc1defff39609c9de65afb199abb3f3f50d16f71','source_run_id':rid,'job_id':row['job_id'],'format':row['log_format'],'bytes':row['bytes'],'log_sha256':row['sha256'],'ciphertext_sha256':manifest['ciphertext_sha256'],'state':manifest['state'],'restored':True,'source_http_requests':0},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-impl41-verified-log-fallback
          path: forensic-proof/
          if-no-files-found: error
          retention-days: 90
