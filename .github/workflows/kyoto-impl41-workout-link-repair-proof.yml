name: Kyoto Impl41 workout observed-link repair proof
on:
  push:
    branches: ['fix/impl41-workout-observed-link-recovery-20261128']
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .:tests
      KYOTO_TARGET_DAY: '20261128'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_AUX_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Check targeted candidate generation and application
        run: python -m unittest -v tests.test_kyoto_impl41_workout_link_repair
      - name: Reopen real preday archive and apply observed links offline
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
          KYOTO_TARGET_DAY: '20261129'
        run: python -m diagnostics.kyoto_impl41_actual_workout_link_proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-actual-workout-link-repair
          path: actual-proof/
          if-no-files-found: error
          retention-days: 90
