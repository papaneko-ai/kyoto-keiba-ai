name: Kyoto G06 twelve-race paired odds offline gate
on:
  push:
    branches:
      - experiment/multisource-hybrid-20261117
    paths:
      - 'diagnostics/kyoto_g06_twelve_race_dual_market_gate.py'
      - 'tests/test_kyoto_g06_twelve_race_dual_market_gate.py'
      - '.github/workflows/kyoto-g06-twelve-race-paired-odds.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - name: Run G06 twelve-race paired-market tests and historical guard
        run: |
          mkdir -p g06_proof
          python -m unittest -v tests.test_kyoto_g06_twelve_race_dual_market_gate tests.test_jra_market_source_chain tests.test_jra_odds_matrix_parser 2>&1 | tee g06_proof/log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-g06-12r-offline-${{ github.run_id }}
          path: g06_proof/
