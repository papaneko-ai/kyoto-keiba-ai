name: Kyoto Impl36 cushion daily integration contract
on:
  push:
    branches: ['release/impl36-cushion-day-sidecar-20261127']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kyoto-20261128-29-result-handoff.yml'
      - '.github/workflows/kyoto-20261128-29-postrace-evidence.yml'
      - '.github/workflows/kyoto-20261128-29-auxiliary-refresh.yml'
      - '.github/workflows/kyoto-20261128-29-workout-source.yml'
      - '.github/workflows/kyoto-impl36-cushion-day-deploy-contract.yml'
      - 'tests/test_kyoto_impl36_cushion_day_deploy.py'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Verify exact original handoff bytes and all protected schedules
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path
          # Immutable already-deployed PR140 is the baseline. Permit only the
          # reviewed exact incident repair; cushion sidecar and schedules stay byte-identical.
          base='5a7378a9b0a6c078c65d0c9b51cb8d3b2852a46e'
          old_pin=b'15d66874903400e50c4a4350b34aed42133a3738'
          new_pin=b'37f47235d1f5803ea897844924ce2ed78b6b5457'
          handoff_pin=b'c289c5ec4e6ad322a7e08acf173da3352ed23dba'
          saturday=b'3f4b3d77357745ead05a9f78db34eb6ac2d78637'
          names=('two-source-production-observer','auxiliary-refresh','result-handoff','postrace-evidence','workout-source','cushion-source')
          for name in names:
              p='.github/workflows/kyoto-20261128-29-'+name+'.yml'
              old=subprocess.check_output(['git','show',base+':'+p])
              new=Path(p).read_bytes()
              expected=old
              if name=='two-source-production-observer':
                  assert old.count(b"SUNDAY_OVERRIDE_SHA: '"+old_pin+b"'")==1
                  expected=old.replace(b"SUNDAY_OVERRIDE_SHA: '"+old_pin+b"'",b"SUNDAY_OVERRIDE_SHA: '"+new_pin+b"'")
              elif name=='result-handoff':
                  assert old.count(b"ref: '"+saturday+b"'")==1
                  expected=old.replace(b"ref: '"+saturday+b"'",b"ref: '"+handoff_pin+b"'")
                  marker=b'\n  cushion-day-reconciliation:'
                  assert old.count(marker)==new.count(marker)==1
                  assert old.split(marker)[1]==new.split(marker)[1]
              elif name=='auxiliary-refresh':
                  assert old.count(b"ref: '"+saturday+b"'")==1
                  aux_pin=b'c289c5ec4e6ad322a7e08acf173da3352ed23dba'
                  expected=old.replace(b"ref: '"+saturday+b"'",b"ref: '"+aux_pin+b"'")
                  assert old.count(b"test \"$(git rev-parse HEAD)\" = '"+saturday+b"'")==1
                  expected=expected.replace(b"test \"$(git rev-parse HEAD)\" = '"+saturday+b"'",b"test \"$(git rev-parse HEAD)\" = '"+aux_pin+b"'")
              elif name=='postrace-evidence':
                  old_postrace=b'1fa2a43fcd17f5100b0b9b9b3dde43dec5a2981f'
                  new_postrace=b'b800308169173d9e82cf93db9bf7b381e361cc76'
                  assert old.count(old_postrace)==2
                  expected=old.replace(old_postrace,new_postrace)
              elif name=='workout-source':
                  old_workout=b'3274283595eac679f6a5e5fb9d658c2080149f62'
                  new_workout=b'bd800bc30db60919e274eadac419016c963e77de'
                  assert old.count(old_workout)==2
                  expected=old.replace(old_workout,new_workout)
              assert new==expected,(name,'unexpected production delta')
          print('SIX_WORKFLOWS_EXACT_BASE_DELTA; CUSHION_SIDECAR_UNCHANGED')
          PY
          python -m unittest -v tests.test_kyoto_impl36_cushion_day_deploy
