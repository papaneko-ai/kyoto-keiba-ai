name: Impl26 final broad integrated bug audit
on:
  push:
    branches: [audit/impl26-broad-final-suite-20261120]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  full-static-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: de2544c1e9f9951a265419461267146b4023c2ab
          path: collector
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile every production Python source file in main and frozen collector
        run: |
          python -m compileall -q main/diagnostics main/tests collector/diagnostics collector/tests
          python - <<'PY'
          from pathlib import Path
          from ast import parse
          from collections import Counter
          counts=Counter()
          for root in (Path("main"),Path("collector")):
              for p in root.rglob("*.py"):
                  parse(p.read_bytes(),filename=str(p))
                  counts[root.name]+=1
          print("STATIC_AST_PARSED",dict(counts))
          PY
      - name: Check obvious unresolved names across the full Python tree
        run: |
          python -m pip install 'ruff>=0.9,<1'
          ruff check --select F821,F822,F823 --output-format concise main collector
      - name: Source-contract tests and immutable 40-risk fail-closed guard
        working-directory: main
        run: |
          python -m unittest -v tests.test_kyoto_weekend_main_release_guard tests.test_kyoto_preparation_five_conditions tests.test_kyoto_impl26_incident_metadata tests.test_kyoto_impl26_incident_lifecycle
          python -I audit/verify_impl26_final_gate.py
          if python -I audit/verify_impl26_final_gate.py --require-go; then echo "PREMATURE_GO" && exit 1; fi
      - name: Parse every production workflow YAML and verify exactly eight capture schedules
        run: |
          python -m pip install 'PyYAML>=6,<7'
          python - <<'PY'
          import yaml
          from pathlib import Path
          docs=list(Path("main/.github/workflows").glob("*.yml"))
          for path in docs:
              yaml.safe_load(path.read_text())
          content=Path("main/.github/workflows/kyoto-20261121-22-two-source-production-observer.yml").read_text()
          assert sum(x.lstrip().startswith("- cron:") for x in content.splitlines())==8
          print("ALL_WORKFLOWS_YAML_PARSED",len(docs))
          PY
  collector-full12-and-aes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: '20261121'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: de2544c1e9f9951a265419461267146b4023c2ab
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Twelve race acquisition G03/G04/G05/G06 and independent SP source
        run: |
          python -m unittest -q \
            tests.test_kyoto_g04_all_horse_profiles \
            tests.test_kyoto_g05_conditions \
            tests.test_kyoto_g05_official_track \
            tests.test_kyoto_g05_weekend_bridge \
            tests.test_kyoto_weekend_race_parity \
            tests.test_kyoto_sp_all12_observed_capture \
            tests.test_kyoto_weekend_end_to_end \
            tests.test_kyoto_weekend_postflight \
            tests.test_kyoto_weekend_capture \
            tests.test_kyoto_nov15_encrypted_evidence \
            tests.test_kyoto_nov15_full_capture_seal \
            tests.test_kyoto_sp_observed_source
      - name: Ground full-market and 12R collector unit tests
        run: |
          python -m unittest -q \
            tests.test_kyoto_g06_all12_capture \
            tests.test_kyoto_g06_claim_execution \
            tests.test_kyoto_weekend_sp_discovery \
            tests.test_kyoto_g06_gap_recovery_plan \
            tests.test_kyoto_g06_missing_market_retry \
            tests.test_kyoto_g06_full_twelve_reparse_e2e \
            tests.test_kyoto_impl25_g06_market_sealing_reserve \
            tests.test_kyoto_impl25_g06_interrupted_rescue \
            tests.test_kyoto_impl25_g06_racewise_isolation \
            tests.test_kyoto_g06_nested_bundle \
            tests.test_kyoto_g06_item_level_recovery \
            tests.test_kyoto_impl25_c10_auxiliary_coverage \
            tests.test_kyoto_impl25_c11_per_family_proof
  destructive-and-turso:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: '20261121'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: de2544c1e9f9951a265419461267146b4023c2ab
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Fault injection, partial-source preservation, pacing and concurrency
        run: |
          python -m unittest -q \
            tests.test_kyoto_weekend_retry_guard \
            tests.test_kyoto_weekend_interruption_and_pacing \
            tests.test_kyoto_safe_stop_artifact \
            tests.test_kyoto_impl23_claim_preflight \
            tests.test_kyoto_impl23_lease_window \
            tests.test_kyoto_impl23_lease_clock \
            tests.test_kyoto_impl23_claim_evidence \
            tests.test_kyoto_impl23_pc_to_g06_real_lease \
            tests.test_kyoto_impl23_weekend_entrypoint_claim \
            tests.test_kyoto_impl23_production_claim_activation \
            tests.test_kyoto_impl23_claim_continuation
      - name: Thirty known risk simulations and safe stop
        run: |
          python -m unittest -q tests.test_kyoto_predictable_failure_gate
          python -m diagnostics.kyoto_predictable_failure_gate --report failure_matrix.json
          python - <<'PY'
          import json
          v=json.load(open("failure_matrix.json"))
          assert v["count"]==v["passing"]==30
          assert v["prediction_ready"] is False and v["live_jra_proven"] is False
          PY
  time-and-night-before:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: '20261121'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: de2544c1e9f9951a265419461267146b4023c2ab
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Time-budget boundary and source-only overnight handoff tests
        run: |
          python -m unittest -q \
            tests.test_kyoto_weekend_interruption_and_pacing \
            tests.test_kyoto_sp_all12_observed_capture \
            tests.test_kyoto_weekend_day21_artifact_triage \
            tests.test_kyoto_weekend_handoff_workflow \
            tests.test_kyoto_weekend_day21_triage \
            tests.test_kyoto_weekend_postflight
      - name: Prove offline audit cannot issue a JRA HTTP request
        run: |
          python - <<'PY'
          import os
          assert os.getenv("KYOTO_WEEKEND_HTTP_APPROVED") != "YES"
          assert not os.getenv("ARCHIVE_KEY")
          print("FINAL_AUDIT_OFFLINE_ONLY")
          PY

  final-verdict:
    if: always()
    needs: [full-static-and-contracts, collector-full12-and-aes, destructive-and-turso, time-and-night-before]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect actual GitHub job conclusions
        shell: bash
        run: |
          mkdir -p impl26_final_audit
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > impl26_final_audit/jobs.json
      - name: Generate evidence-based final NO_GO/GO instead of assuming green CI is completion
        run: |
          python -m audit.impl26_final_report \
            --jobs impl26_final_audit/jobs.json \
            --output impl26_final_audit/verdict.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-impl26-final-six-gate-verdict-${{ github.run_id }}
          path: impl26_final_audit/
          retention-days: 90
          if-no-files-found: error
