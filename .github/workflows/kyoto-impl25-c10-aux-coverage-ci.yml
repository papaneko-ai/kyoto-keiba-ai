name: Kyoto Impl25 C10 auxiliary coverage independent CI
on:
  pull_request:
    paths:
      - '.github/workflows/kyoto-impl25-c10-aux-coverage-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-source-coverage-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 325b2143bb42298d4216e57650525d4635503f94
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Verify immutable candidate SHA
        run: test "$(git rev-parse HEAD)" = "325b2143bb42298d4216e57650525d4635503f94"
      - name: Run no-JRA-HTTP auxiliary source evidence and existing source regressions
        env:
          KYOTO_TARGET_DAY: '20261121'
        run: |
          set -euo pipefail
          python -m unittest -q \
            tests.test_kyoto_impl25_c10_auxiliary_coverage \
            tests.test_kyoto_g05_conditions \
            tests.test_kyoto_g05_official_track \
            tests.test_kyoto_impl25_c09_sp_coverage \
            tests.test_kyoto_weekend_capture \
            tests.test_kyoto_weekend_end_to_end \
            tests.test_kyoto_weekend_postflight \
            tests.test_kyoto_impl25_g06_market_sealing_reserve \
            tests.test_kyoto_impl25_g04_market_time_reserve \
            tests.test_kyoto_nov15_encrypted_evidence
      - name: Assert C10 inventory cannot invent training source or new HTTP
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('diagnostics/kyoto_impl25_c10_auxiliary_coverage.py').read_text()
          cap=Path('diagnostics/kyoto_weekend_capture.py').read_text()
          assert 'NO_INDEPENDENTLY_CONFIRMED_SOURCE' in s
          assert '"workout_source_independently_verified":False' in s
          assert '"no_auxiliary_http_started":True' in s
          assert 'save_auxiliary_coverage(root/"pc_originals",day)' in cap
          assert 'encrypt_evidence(src,dst' in cap
          assert 'active_claims_for_weekend(day)' in cap
          print('C10_SAVED_FIELDS_SOURCE_PROOF_WITHOUT_FABRICATED_WORKOUT')
          PY
