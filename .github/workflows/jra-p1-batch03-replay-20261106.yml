name: Kyoto P1 replay batch 03 official originals
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/p1_batch03_replay_activation_20261106.txt']
permissions:
  contents: write
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 42166373514
          name: jra-p1-profile-batch-03-originals-20261106
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: official_originals
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Verify exact source SHA without JRA requests
        run: |
          python diagnostics/jra_next_batches_original_replay.py \
            --batch batch_03 --artifact official_originals \
            --out docs/diagnostics/jra_p1_profile_batches_20261106/replayed_batch_03
      - name: Persist verified structured records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/jra_p1_profile_batches_20261106/replayed_batch_03
          git commit -m "Independently replay JRA official batch03 source originals" || true
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
