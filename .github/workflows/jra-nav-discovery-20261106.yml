name: Inspect JRA current racecard navigation tokens
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/navigation_activation_20261106.txt']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: One source page and offline navigation inspection
        run: |
          python diagnostics/jra_future_racecard_probe.py --out jra_nav_tmp
          python diagnostics/jra_nav_discovery_20261106.py --html jra_nav_tmp/future_kyoto_r7.html --out jra_nav_tmp/nav.json
      - name: Persist only discovered official navigation metadata
        run: |
          mkdir -p docs/diagnostics
          cp jra_nav_tmp/nav.json docs/diagnostics/JRA_LIVE_NAV_DISCOVERY_20261106.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/JRA_LIVE_NAV_DISCOVERY_20261106.json
          git commit -m "Record official JRA race selection navigation links" || true
          git push origin HEAD:jra-html-diagnostic-20261105
