name: Kyoto P1-FB one official SP horse profile structural proof
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/activate_p1_fb_sp_profile_diagnostic.txt']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jra-html-diagnostic-20261105
      - run: python -m pip install beautifulsoup4
      - run: python diagnostics/jra_p1_fb_one_sp_profile_diagnostic.py --out sp_profile_original
      - name: Persist evidence metadata and inspect raw only in expiring artifact
        if: always()
        run: |
          if test -f sp_profile_original/receipt.json; then
            mkdir -p docs/diagnostics/jra_p1_fb_offline_20261106
            cp sp_profile_original/receipt.json docs/diagnostics/jra_p1_fb_offline_20261106/sp_profile_receipt.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/diagnostics/jra_p1_fb_offline_20261106/sp_profile_receipt.json
            git commit -m "Record official SP horse-profile real source structure"
            git pull --rebase origin jra-html-diagnostic-20261105
            git push origin HEAD:jra-html-diagnostic-20261105
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-p1-fb-sp-profile-original
          path: sp_profile_original/
          retention-days: 3
