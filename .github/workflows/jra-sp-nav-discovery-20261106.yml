name: JRA official SP navigation discovery
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/sp_nav_activation_20261106.txt']
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: One official mobile source request and offline link discovery
        run: python diagnostics/jra_sp_nav_probe.py --out sp_nav_probe
      - name: Persist metadata and discovered official links
        run: |
          mkdir -p docs/diagnostics
          cp sp_nav_probe/receipt.json docs/diagnostics/JRA_SP_NAV_RECEIPT_20261106.json
          if test -f sp_nav_probe/navigation.json; then cp sp_nav_probe/navigation.json docs/diagnostics/JRA_SP_NAV_LINKS_20261106.json; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/JRA_SP_NAV_*.json
          git commit -m "Record official mobile racecard links" || true
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
      - name: Temporary HTML original
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-sp-nav-original-20261106
          path: sp_nav_probe/
          retention-days: 3
