name: Kyoto Impl25 per-race market input isolation independent CI
on:
  pull_request:
    paths:
      - '.github/workflows/kyoto-impl25-g06-racewise-isolation-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immutable-candidate-recovery-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: '20261121'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c2e7acd00b1e0d4c3a56c9ea1c4a642146789bd6
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Confirm immutable candidate and run no JRA HTTP
        run: test "$(git rev-parse HEAD)" = "c2e7acd00b1e0d4c3a56c9ea1c4a642146789bd6"
      - name: Run isolated invalid race and previously accepted capture regression
        run: |
          set -euo pipefail
          python -m unittest -q \
            tests.test_kyoto_impl25_g06_racewise_isolation \
            tests.test_kyoto_impl25_g06_interrupted_rescue \
            tests.test_kyoto_impl25_independent_track_continuation \
            tests.test_kyoto_impl25_g04_priority \
            tests.test_kyoto_weekend_capture \
            tests.test_kyoto_weekend_end_to_end \
            tests.test_kyoto_weekend_postflight \
            tests.test_kyoto_weekend_interruption_and_pacing \
            tests.test_kyoto_g04_all_horse_profiles \
            tests.test_kyoto_g05_conditions \
            tests.test_kyoto_g05_official_track \
            tests.test_kyoto_g05_weekend_bridge \
            tests.test_kyoto_g06_claim_execution \
            tests.test_kyoto_impl23_weekend_entrypoint_claim \
            tests.test_kyoto_impl23_claim_preflight \
            tests.test_kyoto_impl23_lease_window \
            tests.test_kyoto_impl23_lease_clock \
            tests.test_kyoto_impl23_claim_evidence \
            tests.test_kyoto_impl23_pc_to_g06_real_lease \
            tests.test_kyoto_impl23_production_claim_activation \
            tests.test_kyoto_impl23_claim_continuation \
            tests.test_kyoto_weekend_race_parity \
            tests.test_kyoto_nov15_encrypted_evidence \
            tests.test_kyoto_weekend_retry_guard
      - name: Independent source-only deployment contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('diagnostics/kyoto_weekend_capture.py').read_text()
          a=Path('diagnostics/kyoto_g03_to_g06_input_adapter.py').read_text()
          assert 'skip_invalid_races=True,rejections=rejected_inputs' in s
          assert 'LOCAL_G03_INPUT_REJECTED' in a
          assert 'source_inputs=records_from_g03(' in s
          assert 'active_claims_for_weekend(day)' in s
          assert 'encrypt_evidence(src,dst' in s
          assert 'bundle_interrupted_g06(' in s
          print('ISOLATED_RACE_QUARANTINE_WITH_VERIFIED_PEER_CONTINUATION')
          PY
