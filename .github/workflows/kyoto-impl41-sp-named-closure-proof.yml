name: Kyoto Impl41 independent SP named roster closure proof
on:
  push:
    branches: ['fix/impl41-sp-named-closure-proof-20261128']
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KYOTO_TARGET_DAY: '20261129'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_AUX_HTTP_APPROVED: 'NO'
      KYOTO_POSTRACE_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '5a16e23d0f2148581dbe0b965d4672b22735602e'
          path: trusted-reader
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Verify candidate against actual pinned SP reader and encrypted fixture
        run: |
          cd trusted-reader
          PYTHONPATH="$PWD" python ../diagnostics/kyoto_impl41_sp_named_closure_proof.py ../diagnostics/kyoto_weekend_closure_review.py
