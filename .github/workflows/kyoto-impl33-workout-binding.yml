name: Kyoto Impl33 historical workout to official roster binding
on:
  push:
    branches: ['fix/impl33-whitegreen-binding-20261126']
permissions:
  contents: read
  actions: read
jobs:
  binding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: '20261122'
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Verify new binding tests
        run: |
          set -euo pipefail
          mkdir -p workout_binding
          git rev-parse HEAD > workout_binding/head.txt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m unittest discover -s tests -p 'test_kyoto_impl33_workout_binding.py' -v 2>&1 | tee workout_binding/tests.log
      - name: Reuse previous official original without any JRA HTTP
        run: gh run download 44966013490 --name kyoto-nov22-real-observed-all12-encrypted-44966013490 --repo "$GITHUB_REPOSITORY" --dir pc_archive
      - name: Bind one public source to authenticated archived official roster
        env:
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
        run: python -m diagnostics.kyoto_impl33_workout_binding_runner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-impl33-workout-binding-${{ github.run_id }}
          path: workout_binding/
          retention-days: 90
          if-no-files-found: error
