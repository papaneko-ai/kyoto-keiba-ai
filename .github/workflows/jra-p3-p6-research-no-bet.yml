name: Kyoto P3-P6 research mechanics and no-bet acceptance
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths:
      - '.github/workflows/jra-p3-p6-research-no-bet.yml'
      - 'diagnostics/p3_p6_research_no_bet.py'
      - 'diagnostics/p3_p6_research_no_bet_cli.py'
      - 'tests/test_p3_p6_research_no_bet.py'
      - 'diagnostics/p6_virtual_settlement_fixture_lab.py'
      - 'tests/test_p6_virtual_settlement_fixture_lab.py'
      - 'diagnostics/p6_fixture_durable_ledger.py'
      - 'tests/test_p6_fixture_durable_ledger.py'
      - 'docs/diagnostics/p2_historical_feature_matrix_20261107_148.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-and-historical-no-bet:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile numerical and no-bet guard code
        run: |
          python -m py_compile diagnostics/p3_p6_research_no_bet.py diagnostics/p3_p6_research_no_bet_cli.py tests/test_p3_p6_research_no_bet.py diagnostics/p6_virtual_settlement_fixture_lab.py tests/test_p6_virtual_settlement_fixture_lab.py diagnostics/p6_fixture_durable_ledger.py tests/test_p6_fixture_durable_ledger.py
      - name: Test probabilities, frames, odds arithmetic and strict refusal
        run: |
          python -m unittest discover -s tests -p 'test_p3_p6_research_no_bet.py' -v
          python -m unittest discover -s tests -p 'test_p6_virtual_settlement_fixture_lab.py' -v
          python -m unittest discover -s tests -p 'test_p6_fixture_durable_ledger.py' -v
      - name: Process actual historical CSV into no-bet receipt
        run: |
          python diagnostics/p3_p6_research_no_bet_cli.py \
            --features docs/diagnostics/p2_historical_feature_matrix_20261107_148.csv \
            --receipt /tmp/kyoto-p3-p6-historical-no-bet.json
      - name: Verify no virtual purchase or historical prediction was generated
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/kyoto-p3-p6-historical-no-bet.json').read_text())
          assert x['runner_count']==148
          assert x['suggested_races']==[]
          assert x['quinella_tickets']==[] and x['bracket_tickets']==[]
          assert x['virtual_investment_yen']==0
          assert x['ledger_events_written']==0
          assert x['prediction_ready'] is False and x['actual_purchase'] is False
          assert x['model_calibrated'] is False and x['market_verified'] is False
          print('P3_P6_HISTORICAL_NO_BET_PASS; no network/real orders')
          PY
      - name: Run P6 fixture-only freeze → preliminary → final → correction replay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from diagnostics.p6_virtual_settlement_fixture_lab import freeze_fixture, settle_fixture
          f=freeze_fixture(
              scenario_id='LAB-CI-SETTLEMENT',ticket_type='QUINELLA',
              frozen_utc='2026-11-13T04:00:00Z',cutoff_utc='2026-11-14T04:50:00Z',
              model_version='unvalidated-lab-fixture',source_sha256='a'*64,
              tickets=[{'pair':[1,2],'stake_yen':200,'probability':.15,'odds':5.0}]
          )
          prelim={'scenario_id':'LAB-CI-SETTLEMENT','source_kind':'FIXTURE','version':1,
                  'state':'RESULT_PRELIMINARY','payout_per_100':{},'refunded_pairs':[]}
          final={**prelim,'version':2,'state':'PAYOUT_FINAL','payout_per_100':{'1-2':500}}
          revised={**final,'version':3,'payout_per_100':{'1-2':400}}
          a=settle_fixture(f,[prelim])
          b=settle_fixture(f,[prelim,final])
          c=settle_fixture(f,[prelim,final,revised,revised])
          assert a['profit_yen'] is None
          assert b['payout_yen']==1000 and b['profit_yen']==800
          assert c['payout_yen']==800 and c['profit_yen']==600
          assert c['official_confirmation'] is False and c['fixture_only'] is True
          out={'schema':'kyoto_p6_fixture_replay_receipt.v1','frozen_sha256':f['frozen_sha256'],
               'preliminary':a,'final':b,'correction':c,'actual_jra_requests':0,
               'actual_purchases':0,'real_world_model_performance_evidence':False}
          Path('/tmp/kyoto-p6-fixture-replay.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\\n')
          print('P6_LAB_REPLAY_PASS; preliminary not settled; correction not double-counted')
          PY
      - name: Retain P6 synthetic replay proof separately from historical data
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-p6-fixture-only-settlement-replay
          path: /tmp/kyoto-p6-fixture-replay.json
          retention-days: 7
      - name: Verify durable P6 fixture journal across process restart
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from diagnostics.p6_fixture_durable_ledger import append_record
          from diagnostics.p6_virtual_settlement_fixture_lab import freeze_fixture
          f=freeze_fixture(scenario_id='LAB-CI-DURABLE',ticket_type='QUINELLA',
              frozen_utc='2026-11-13T04:00:00Z',cutoff_utc='2026-11-14T04:50:00Z',
              model_version='research-fixture',source_sha256='a'*64,
              tickets=[{'pair':[1,2],'stake_yen':200,'probability':.3,'odds':5.0}])
          path=Path('/tmp/kyoto-p6-fixture-durable.jsonl')
          s=append_record(path,'FROZEN',f,expected_head='0'*64)
          for version,amount in [(1,500),(2,400)]:
              event={'scenario_id':'LAB-CI-DURABLE','source_kind':'FIXTURE',
                     'version':version,'state':'PAYOUT_FINAL',
                     'payout_per_100':{'1-2':amount},'refunded_pairs':[]}
              s=append_record(path,'RESULT_EVENT',event,expected_head=s['head'])
          Path('/tmp/kyoto-p6-fixture-expected-head.txt').write_text(s['head']+'\\n')
          PY
          python - <<'PY'
          from pathlib import Path
          from diagnostics.p6_fixture_durable_ledger import read_journal
          a=read_journal('/tmp/kyoto-p6-fixture-durable.jsonl')
          assert len(a['entries'])==3
          assert a['result']['payout_yen']==800
          assert a['result']['profit_yen']==600
          assert a['head']==Path('/tmp/kyoto-p6-fixture-expected-head.txt').read_text().strip()
          print('P6_DURABLE_FIXTURE_RESTART_PASS')
          PY
      - name: Save durability witness only (never official prediction or result)
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-p6-fixture-journal-and-head
          path: |
            /tmp/kyoto-p6-fixture-durable.jsonl
            /tmp/kyoto-p6-fixture-expected-head.txt
          retention-days: 7
      - name: Retain reproducible no-bet research receipt
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-p3-p6-historical-no-bet
          path: /tmp/kyoto-p3-p6-historical-no-bet.json
          retention-days: 7
