name: Kyoto P1 offline original replay batch06
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/p1_batch06_replay_activation_20261106.txt']
permissions:
  contents: write
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 42167373275
          name: kyoto-p1-batch06-source-20261106
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original_html
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Independent source SHA identity replay without live HTTP
        run: |
          python diagnostics/jra_p1_batches05_06_original_replay.py \
            --batch batch_06 --artifact original_html \
            --out docs/diagnostics/jra_p1_profile_batches_20261106/replayed_batch_06
      - name: Preserve normalized evidence rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/jra_p1_profile_batches_20261106/replayed_batch_06
          git commit -m "Verify exact JRA batch06 source originals and normalize performance" || true
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
