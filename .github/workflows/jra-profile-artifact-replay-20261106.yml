name: Offline replay three saved official JRA horse profile originals
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/profile_replay_activation_20261106.txt']
permissions:
  contents: write
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jra-real-horse-profile-evidence-20261106
          run-id: 42162996333
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: saved_profile_origins
      - name: Install offline parser only
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Verify original SHA and replay pre-race horse history parser
        run: |
          python diagnostics/jra_profile_artifact_replay.py \
            --artifact saved_profile_origins \
            --out jra_profile_replay
      - name: Preserve independent replay receipt
        run: |
          mkdir -p docs/diagnostics/jra_profile_replay_20261106
          cp jra_profile_replay/*.json docs/diagnostics/jra_profile_replay_20261106/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/jra_profile_replay_20261106/
          git commit -m "Replay 3 source-backed horse profiles without new JRA calls" || true
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
