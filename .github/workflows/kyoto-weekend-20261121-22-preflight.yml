name: Kyoto Nov21-22 capture release preflight no official HTTP
on:
  push:
    branches: [jra-html-diagnostic-20261105, fix/nov22-frozen-sp-real-anchor-source-20261122, fix/nov22-sp-reuse-saved-real-r1-20261122, fix/nov22-sp-app-host-official-20261122]
    paths:
      - 'diagnostics/kyoto_weekend_capture.py'
      - 'tests/test_kyoto_weekend_capture.py'
      - 'tests/test_kyoto_weekend_production_workflow.py'
      - 'tests/test_kyoto_weekend_sp_discovery.py'
      - 'tests/test_kyoto_weekend_day21_triage.py'
      - 'tests/test_kyoto_weekend_day21_artifact_triage.py'
      - 'diagnostics/kyoto_weekend_day21_artifact_triage.py'
      - 'tests/test_kyoto_weekend_postflight.py'
      - 'tests/test_kyoto_weekend_handoff_workflow.py'
      - 'tests/test_kyoto_weekend_end_to_end.py'
      - 'tests/test_kyoto_weekend_interruption_and_pacing.py'
      - 'tests/test_kyoto_predictable_failure_gate.py'
      - 'tests/test_kyoto_reverse_fmea_gate.py'
      - 'tests/test_kyoto_weekend_race_parity.py'
      - 'tests/test_kyoto_weekend_retry_guard.py'
      - 'diagnostics/kyoto_weekend_retry_guard.py'
      - 'diagnostics/kyoto_reverse_fmea_gate.py'
      - 'docs/diagnostics/KYOTO_REVERSE_FMEA_GAP_REGISTER_20261116.json'
      - 'diagnostics/kyoto_predictable_failure_gate.py'
      - 'docs/diagnostics/KYOTO_PREDICTABLE_FAILURE_MATRIX_20261116.json'
      - 'diagnostics/kyoto_sp_observed_source.py'
      - 'diagnostics/kyoto_weekend_capture.py'
      - 'diagnostics/kyoto_weekend_postflight.py'
      - 'diagnostics/kyoto_weekend_day21_triage.py'
      - '.github/workflows/kyoto-20261121-22-result-handoff.yml'
      - 'diagnostics/kyoto_weekend_sp_discovery.py'
      - 'diagnostics/kyoto_nov15_encrypted_evidence.py'
      - '.github/workflows/kyoto-20261121-22-two-source-production-observer.yml'
      - '.github/workflows/kyoto-weekend-20261121-22-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weekend-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
      KYOTO_TARGET_DAY: '20261121'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing parser and authenticated crypto
        run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Real-workflow modules offline acceptance and bounded transport regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p weekend_preflight_proof
          KYOTO_TARGET_DAY=20261121 python -m unittest -v tests.test_kyoto_weekend_capture tests.test_kyoto_safe_stop_artifact tests.test_kyoto_weekend_production_workflow tests.test_kyoto_weekend_sp_discovery tests.test_kyoto_weekend_day21_triage tests.test_kyoto_weekend_day21_artifact_triage tests.test_kyoto_weekend_postflight tests.test_kyoto_weekend_handoff_workflow tests.test_kyoto_weekend_end_to_end tests.test_kyoto_weekend_interruption_and_pacing 2>&1 | tee weekend_preflight_proof/tests.log
          KYOTO_TARGET_DAY=20261115 python -m unittest -v tests.test_kyoto_sp_observed_source tests.test_kyoto_nov15_offline_race_links 2>&1 | tee -a weekend_preflight_proof/tests.log
          KYOTO_TARGET_DAY=20261122 python -m unittest -v tests.test_kyoto_nov15_encrypted_evidence tests.test_kyoto_weekend_sp_discovery tests.test_kyoto_weekend_postflight tests.test_kyoto_weekend_day21_triage 2>&1 | tee -a weekend_preflight_proof/tests.log
      - name: Prove actual weekend PC and SP target same Kyoto 12R, not 11R
        shell: bash
        run: |
          set -euo pipefail
          KYOTO_TARGET_DAY=20261121 python -m unittest -v tests.test_kyoto_weekend_retry_guard tests.test_kyoto_weekend_race_parity 2>&1 | tee weekend_preflight_proof/race_parity.log
      - name: Independently check matrix omissions and execute all 30 foreseeable-failure cases
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_kyoto_predictable_failure_gate 2>&1 | tee weekend_preflight_proof/coverage_gate_selftests.log
          python -m diagnostics.kyoto_predictable_failure_gate --report weekend_preflight_proof/predictable_failure_execution.json 2>&1 | tee weekend_preflight_proof/coverage_execution.log
          sha256sum weekend_preflight_proof/coverage_gate_selftests.log weekend_preflight_proof/coverage_execution.log weekend_preflight_proof/predictable_failure_execution.json > weekend_preflight_proof/coverage_evidence_sha256.txt
      - name: Independently enumerate real source functions and freeze unresolved FMEA gaps
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_kyoto_reverse_fmea_gate 2>&1 | tee weekend_preflight_proof/reverse_fmea_guard_tests.log
          python -m diagnostics.kyoto_reverse_fmea_gate --report weekend_preflight_proof/reverse_fmea_report.json 2>&1 | tee weekend_preflight_proof/reverse_fmea_execution.log
          sha256sum weekend_preflight_proof/reverse_fmea_guard_tests.log weekend_preflight_proof/reverse_fmea_execution.log weekend_preflight_proof/reverse_fmea_report.json > weekend_preflight_proof/reverse_fmea_evidence_sha256.txt
      - name: Record checked version and hash of offline test log
        if: always()
        shell: bash
        run: |
          mkdir -p weekend_preflight_proof
          git rev-parse HEAD > weekend_preflight_proof/head.txt
          sha256sum weekend_preflight_proof/tests.log > weekend_preflight_proof/tests.sha256 || true
      - name: Retain full dry-run evidence whether successful or not
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-nov21-22-preflight-${{ github.run_id }}
          path: weekend_preflight_proof/
          if-no-files-found: error
          retention-days: 30
