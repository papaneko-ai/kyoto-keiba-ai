name: Nov22 rescue preserve real-source capture opportunity
on:
  pull_request:
    paths:
      - '.github/workflows/kyoto-20261121-22-two-source-production-observer.yml'
      - 'tests/test_kyoto_nov22_recover_live_capture_preflight.py'
      - '.github/workflows/kyoto-nov22-source-opportunity-recovery-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-8-slots-and-preserved-negative-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate all protected invariants and no fake source success
        run: python -m unittest -v tests.test_kyoto_nov22_recover_live_capture_preflight
      - name: Strict existing production pin and ciphertext protection
        run: |
          python -m pip install 'PyYAML>=6,<7'
          python - <<'PY'
          from pathlib import Path
          import yaml
          x=Path('.github/workflows/kyoto-20261121-22-two-source-production-observer.yml').read_text()
          d=yaml.safe_load(x)
          assert set(d['jobs'])=={'pc-originals-independent','sp-originals-independent'}
          assert d['jobs']['pc-originals-independent']['timeout-minutes']==20
          assert d['jobs']['sp-originals-independent']['timeout-minutes']==12
          assert d['jobs']['sp-originals-independent']['needs']=='pc-originals-independent'
          print('NOV22_SOURCE_OPPORTUNITY_STRICT_PIN_PASS')
          PY
