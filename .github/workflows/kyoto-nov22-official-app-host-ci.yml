name: Nov22 actual official JRA mobile app host and full SP provenance
on:
  push:
    branches: [fix/nov22-sp-app-host-official-20261122]
  pull_request:
permissions:
  contents: read
jobs:
  exact-sp-public-host:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Verify official mobile hostname, zero external domain HTTP, saved R1 original, legacy all12 AES
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_kyoto_nov22_app_jra_official_host tests.test_kyoto_nov22_preserve_saved_sp_r1 tests.test_kyoto_nov22_real_sp_token_source tests.test_kyoto_sp_all12_observed_capture tests.test_kyoto_weekend_sp_discovery
      - name: Strict encrypted source data and timestamp compatibility
        run: python -m unittest -v tests.test_kyoto_weekend_postflight tests.test_kyoto_nov15_encrypted_evidence
