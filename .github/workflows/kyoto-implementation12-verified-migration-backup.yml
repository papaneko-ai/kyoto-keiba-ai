name: Kyoto Implementation12 verified migration source and history backup
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths:
      - 'docs/diagnostics/kyoto_predata_readiness_rubric_v1.json'
      - 'diagnostics/kyoto_predata_readiness.py'
      - 'tests/test_r01_predata_source_contract_acceptance.py'
      - 'tests/test_r08_full_market_predata_acceptance.py'
      - 'tests/test_r02_prerace_feature_acceptance.py'
      - 'tests/test_r07_calibration_uncertainty_acceptance.py'
      - 'tests/test_kyoto_predata_readiness.py'
      - 'tests/test_r10_risk_strategy_comparison_acceptance.py'
      - 'tests/test_r04_model_families_acceptance.py'
      - 'tests/test_r14_evolution_integration_acceptance.py'
      - 'tests/test_r15_safe_mobile_acceptance.py'
      - 'diagnostics/p8_r15_safe_mobile_viewmodel.py'
      - 'diagnostics/kyoto_new_mobile_paper_ui.py'
      - 'diagnostics/p7_r14_evolution_integration_acceptance.py'
      - 'diagnostics/p3_r04_model_families_lab.py'
      - 'diagnostics/p5_r10_risk_strategy_comparison.py'
      - 'diagnostics/p3_r07_calibration_uncertainty_acceptance.py'
      - 'diagnostics/p2_prerace_feature_contract.py'
      - '.github/workflows/kyoto-ai-always-run-continuity.yml'
      - 'docs/KYOTO_AI_20261113_IMPLEMENTATION12_COMPLETE_MIGRATION_PACK.md'
      - 'docs/KYOTO_AI_20261113_IMPLEMENTATION12_START_INSTRUCTIONS.md'
      - 'docs/KYOTO_AI_IMPLEMENTATION13_MIGRATION_AND_PRE_DATA_PROGRESS_20261113.md'
      - 'docs/KYOTO_AI_PERMANENT_RESEARCH_REUSE_AND_SECTION_HANDOFF_POLICY.md'
      - 'docs/KYOTO_AI_PRE_DATA_READINESS_PROGRESS_AGREEMENT_20261113.md'
      - '.github/workflows/kyoto-implementation12-verified-migration-backup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-commit-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create and verify tracked source ZIP and Git refs bundle
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/kyoto-implementation12"
          mkdir -p "$root"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "jra-html-diagnostic-20261105"
          git archive --format=zip --output="$root/tracked-repository-source.zip" HEAD
          git bundle create "$root/git-history.bundle" --all
          git bundle verify "$root/git-history.bundle"
          unzip -t "$root/tracked-repository-source.zip" > "$root/ZIP_TEST_LOG.txt"
          printf 'repository=papaneko-ai/kyoto-keiba-ai\nbranch=%s\nhead=%s\nrun_id=%s\nsource=tracked_files_only\nrun_attempt=%s\nretention_days=90\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$root/RECOVERY_MANIFEST.txt"
          printf '%s\n' "$GITHUB_SHA" > "$root/EXACT_SOURCE_HEAD.txt"
          cat > "$root/RESTORE_INSTRUCTIONS.txt" <<'EOF'
          KYOTO AI Implementation12 migration and source recovery
          Verify: sha256sum -c SHA256SUMS.txt
          Check:  unzip -t tracked-repository-source.zip
          Git:    git bundle verify git-history.bundle
          Restore the recorded branch from the bundle into a NEW directory.
          Check the restored commit equals EXACT_SOURCE_HEAD.txt before any execution.
          Do not overwrite protected main/Turso/Streamlit or configure real betting.
          Not included: external Turso DB, GitHub/Streamlit Secrets, historical
          JRA HTML stored as Actions artifacts, external provider settings.
          Artifacts expire; save a copy independently if long-term recovery is needed.
          EOF
          (cd "$root" && sha256sum tracked-repository-source.zip git-history.bundle ZIP_TEST_LOG.txt \
            RECOVERY_MANIFEST.txt EXACT_SOURCE_HEAD.txt RESTORE_INSTRUCTIONS.txt > SHA256SUMS.txt)
          (cd "$root" && sha256sum -c SHA256SUMS.txt)
          # Verify the same manifest after moving it to a separate restore path.
          restore="$RUNNER_TEMP/kyoto-restore-probe"
          mkdir -p "$restore"
          cp "$root/"{tracked-repository-source.zip,git-history.bundle,ZIP_TEST_LOG.txt,RECOVERY_MANIFEST.txt,EXACT_SOURCE_HEAD.txt,RESTORE_INSTRUCTIONS.txt,SHA256SUMS.txt} "$restore/"
          (cd "$restore" && sha256sum -c SHA256SUMS.txt && unzip -t tracked-repository-source.zip >/dev/null)
          git -C "$restore" init -q
          git -C "$restore" bundle verify "$restore/git-history.bundle"
          test "$(cat "$restore/EXACT_SOURCE_HEAD.txt")" = "$GITHUB_SHA"
          ROOT="$root" python - <<'PY'
          import os,pathlib,zipfile
          root=pathlib.Path(os.environ["ROOT"])
          with zipfile.ZipFile(root/"tracked-repository-source.zip") as z:
              required={
                "docs/KYOTO_AI_20261113_IMPLEMENTATION12_COMPLETE_MIGRATION_PACK.md",
                "docs/KYOTO_AI_20261113_IMPLEMENTATION12_START_INSTRUCTIONS.md",
                "docs/KYOTO_AI_IMPLEMENTATION13_MIGRATION_AND_PRE_DATA_PROGRESS_20261113.md",
                "docs/KYOTO_AI_PERMANENT_RESEARCH_REUSE_AND_SECTION_HANDOFF_POLICY.md",
                "docs/diagnostics/kyoto_20261113_generated_evo_candidate_16tests_checkpoint.json",
                "diagnostics/p7_evo_bounded_candidate_constructor.py",
                "diagnostics/p3_offline_model_tournament.py",
                "diagnostics/p3_three_window_selection_lab.py",
                "docs/KYOTO_AI_PRE_DATA_READINESS_PROGRESS_AGREEMENT_20261113.md",
                "docs/diagnostics/kyoto_predata_readiness_rubric_v1.json",
                "diagnostics/kyoto_predata_readiness.py",
                "tests/test_kyoto_predata_readiness.py",
                "tests/test_p3_three_window_selection_lab.py",
                "diagnostics/p3_lab_calibration_audit.py",
                "diagnostics/p2_p3_p5_offline_feature_bridge.py",
                "diagnostics/p2_first_second_feature_discovery_lab.py",
                "diagnostics/p3_p5_p6_synthetic_pipeline_lab.py",
                "diagnostics/p3_p5_p6_synthetic_day_lab.py",
                "tests/test_p3_p5_p6_synthetic_day_lab.py",
                "tests/test_p3_p5_p6_synthetic_pipeline_lab.py",
                "tests/test_p2_first_second_feature_discovery_lab.py",
                "tests/test_p2_p3_p5_offline_feature_bridge.py",
                "tests/test_p3_lab_calibration_audit.py",
                "tests/test_p3_offline_model_tournament.py",
                "tests/test_r06_pair_frame_fixed_acceptance.py",
                "tests/test_r11_predata_freeze_acceptance.py",
                "tests/test_r13_predata_durable_accounting_acceptance.py",
                "diagnostics/p7_add_ensemble_candidate_constructor.py",
                "tests/test_p7_add_ensemble_candidate_constructor.py",
                "diagnostics/kyoto_nov15_capture_acceptance.py",
                "tests/test_kyoto_nov15_capture_acceptance.py",
                "tests/test_kyoto_nov15_two_stage_encrypted_pipeline_lab.py",
                "diagnostics/p7_hybrid_shadow_evolution_cycle.py",
                ".github/workflows/kyoto-implementation12-verified-migration-backup.yml",
                ".github/workflows/kyoto-ai-always-run-continuity.yml",
              }
              absent=required-set(z.namelist())
              assert not absent, f"Missing migration requirements: {sorted(absent)}"
              assert z.testzip() is None
          assert (root/"EXACT_SOURCE_HEAD.txt").read_text().strip()==os.environ["GITHUB_SHA"]
          print("MIGRATION_SOURCE_ZIP=VERIFIED")
          print("MIGRATION_GIT_BUNDLE=VERIFIED")
          print("MIGRATION_SHA256=VERIFIED")
          print("MIGRATION_HEAD="+os.environ["GITHUB_SHA"])
          print("JRA_EXTERNAL_GET=0")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-implementation12-exact-source-gitbundle-sha256-${{ github.run_id }}
          path: ${{ runner.temp }}/kyoto-implementation12/
          retention-days: 90
          if-no-files-found: error
