name: Kyoto offline safety unit tests
on:
  push:
    branches:
      - jra-html-diagnostic-20261105
    paths:
      - 'diagnostics/scheduler_core.py'
      - 'diagnostics/jra_runner_offline.py'
      - 'diagnostics/jra_prior_form_offline.py'
      - 'diagnostics/jra_roster_crosswalk.py'
      - 'diagnostics/jra_pre_race_audit.py'
      - 'diagnostics/jra_racecard_bridge.py'
      - 'tests/test_scheduler_core.py'
      - 'tests/test_jra_runner_offline.py'
      - 'tests/test_jra_prior_form_offline.py'
      - 'tests/test_jra_roster_crosswalk.py'
      - 'tests/test_jra_pre_race_audit.py'
      - 'tests/test_jra_racecard_bridge.py'
      - 'diagnostics/jra_evidence_pipeline.py'
      - 'tests/test_jra_evidence_pipeline.py'
      - 'diagnostics/jra_release_window.py'
      - 'tests/test_jra_release_window.py'
      - 'diagnostics/jra_racecard_12r_registry.py'
      - 'tests/test_jra_racecard_12r_registry.py'
      - 'diagnostics/jra_freeze_live_roster.py'
      - 'tests/test_jra_frozen_live_roster.py'
      - 'tests/test_jra_pc_sp_11r_evidence.py'
      - 'docs/diagnostics/JRA_KYOTO_R7_PRERACE_FROZEN_20261106.json'
      - '.github/workflows/kyoto-offline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Install offline parser dependency
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Verify isolated parser and scheduler without live HTTP or Turso
        run: |
          python -m unittest discover -s tests -p 'test_scheduler_core.py' -v
          python -m unittest discover -s tests -p 'test_jra_runner_offline.py' -v
          python -m unittest discover -s tests -p 'test_jra_prior_form_offline.py' -v
          python -m unittest discover -s tests -p 'test_jra_roster_crosswalk.py' -v
          python -m unittest discover -s tests -p 'test_jra_pre_race_audit.py' -v
          python -m unittest discover -s tests -p 'test_jra_racecard_bridge.py' -v
          python -m unittest discover -s tests -p 'test_jra_evidence_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_jra_release_window.py' -v
          python -m unittest discover -s tests -p 'test_jra_racecard_12r_registry.py' -v
          python -m unittest discover -s tests -p 'test_jra_frozen_live_roster.py' -v
          python -m unittest discover -s tests -p 'test_jra_pc_sp_11r_evidence.py' -v
