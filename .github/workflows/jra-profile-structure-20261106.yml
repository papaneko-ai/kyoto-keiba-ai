name: Inspect saved genuine JRA profile empty-history and abnormal finish
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/profile_structure_activation_20261106.txt']
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jra-real-horse-profile-evidence-20261106
          run-id: 42162996333
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original_html
      - run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Offline exact JRA raw original structure inspection
        run: python diagnostics/jra_profile_structure_audit_20261106.py --artifact original_html --out docs/diagnostics/JRA_PROFILE_SPECIAL_CASES_20261106.json
      - name: Persist short structured original evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/JRA_PROFILE_SPECIAL_CASES_20261106.json
          git commit -m "Record genuine JRA new-horse absent history and abnormal finish structure" || true
          git pull --rebase origin jra-html-diagnostic-20261105
          git push origin HEAD:jra-html-diagnostic-20261105
