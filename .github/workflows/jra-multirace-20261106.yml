name: JRA 2026-11-07 Kyoto multi-race prerace capture
on:
  push:
    branches: [jra-html-diagnostic-20261105]
    paths: ['diagnostics/multi_activation_20261106.txt']
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated parser
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Capture exactly three independently identified official racecards
        run: python diagnostics/jra_multi_capture_20261106.py --out jra_multirace_capture
      - name: Persist small structured pre-race evidence and receipts
        run: |
          mkdir -p docs/diagnostics/multirace_20261106
          cp jra_multirace_capture/*.json docs/diagnostics/multirace_20261106/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/multirace_20261106/
          git commit -m "Freeze three official Kyoto pre-race snapshots with timestamps" || true
          git push origin HEAD:jra-html-diagnostic-20261105
      - name: Retain original source pages for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-multirace-prerace-originals-20261106
          path: jra_multirace_capture/
          retention-days: 3
          if-no-files-found: warn
