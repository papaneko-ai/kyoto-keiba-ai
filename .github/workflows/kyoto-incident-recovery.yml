name: Kyoto automatic incident evidence and repair worklist
on:
  workflow_run:
    workflows:
      - Kyoto Nov28-29 independent encrypted original collection
      - Kyoto Nov28-29 afternoon auxiliary refresh
      - Kyoto Nov28-29 postrace result and payout evidence
      - Kyoto Nov28-29 independent workout source collection
      - Kyoto Nov28-29 independent official cushion source
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact completed source run ID for evidence-only replay
        required: true
        type: string
  push:
    branches: ['fix/impl37-root-cause-recovery-20261128']
    paths:
      - 'diagnostics/kyoto_incident_recovery.py'
      - 'diagnostics/kyoto_cushion_trigger_evidence.py'
      - 'tests/test_kyoto_cushion_trigger_evidence.py'
      - 'diagnostics/kyoto_forensic_continuity.py'
      - 'diagnostics/kyoto_repair_control.py'
      - 'diagnostics/kyoto_incident_g05_replay.py'
      - 'tests/test_kyoto_incident_recovery.py'
      - '.github/workflows/kyoto-incident-recovery.yml'
  pull_request:
    branches: [main]
    paths:
      - 'diagnostics/kyoto_incident_recovery.py'
      - 'diagnostics/kyoto_cushion_trigger_evidence.py'
      - 'tests/test_kyoto_cushion_trigger_evidence.py'
      - 'diagnostics/kyoto_forensic_continuity.py'
      - 'diagnostics/kyoto_repair_control.py'
      - 'diagnostics/kyoto_incident_g05_replay.py'
      - 'tests/test_kyoto_incident_recovery.py'
      - '.github/workflows/kyoto-incident-recovery.yml'
permissions:
  contents: read
  actions: read
jobs:
  offline:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - run: python -m unittest -v tests.test_kyoto_incident_recovery tests.test_kyoto_cushion_trigger_evidence
  diagnose:
    needs: offline
    if: ${{ always() && (needs.offline.result == 'success' || ((github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') && needs.offline.result == 'skipped')) && github.repository == 'papaneko-ai/kyoto-keiba-ai' && ((github.event_name == 'workflow_run' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/fix/impl37-root-cause-recovery-20261128')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
      SOURCE_RUN_ID: ${{ github.event_name == 'push' && '46087080554' || github.event.workflow_run.id || inputs.run_id }}
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 'c289c5ec4e6ad322a7e08acf173da3352ed23dba'
          path: trusted-reader
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '47cd7f9e881aa989b9f932373cfaf5278dea223a'
          path: trusted-cushion-reader
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '5a16e23d0f2148581dbe0b965d4672b22735602e'
          path: trusted-postrace-reader
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Reopen exact authenticated source artifacts without source HTTP
        run: python -m diagnostics.kyoto_incident_recovery --run-id "$SOURCE_RUN_ID" --reader trusted-reader --cushion-reader trusted-cushion-reader --postrace-reader trusted-postrace-reader --out incident
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-incident-recovery
          path: incident/
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: diagnose
    if: ${{ always() && github.repository == 'papaneko-ai/kyoto-keiba-ai' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      DIAGNOSIS_RESULT: ${{ needs.diagnose.result }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: kyoto-incident-recovery
          path: incident
      - name: Preserve sanitized diagnosis in permanent issue ledger
        run: |
          python - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          assert repo=='papaneko-ai/kyoto-keiba-ai'
          rid=int(os.environ['SOURCE_RUN_ID']); assert rid>0
          try:
              assert os.environ['DIAGNOSIS_RESULT']=='success'
              summary=Path('incident/summary.md').read_text()
              raw=Path('incident/report.json').read_bytes().rstrip(b'\n')
              d=json.loads(raw); assert d['source_run_id']==rid
              marker=f"<!-- kyoto-incident:{rid}:{hashlib.sha256(raw).hexdigest()} -->"
              assert summary.startswith(marker+'\n') and len(summary.encode())<=60000
          except Exception:
              marker=f"<!-- kyoto-incident-incomplete:{rid}:{os.environ['GITHUB_RUN_ID']} -->"
              Path('incident').mkdir(exist_ok=True)
              summary=marker+'\n診断未完了・要修復。取得成功または原因解決とは扱わない。\n'
              summary+=f'- Source run: {rid}; diagnosis job: {os.environ["DIAGNOSIS_RESULT"]}\n'
              summary+=f'- 元の実行: https://github.com/{repo}/actions/runs/{rid}\n'
              summary+='- 次の処置: 元実行のjob/原本/ログを再開封し、未取得の証拠を特定する。\n'
              if Path('incident/forensic.json').is_file():
                  summary+='- 暗号化診断証拠のmanifestが保存されている。診断artifactから復元する。\n'
              Path('incident/summary.md').write_text(summary)
          pages=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',f'repos/{repo}/issues/141/comments?per_page=100'],text=True,timeout=30))
          if not any(marker in c.get('body','') for page in pages for c in page):
              with Path('incident/summary.md').open('a') as f:f.write(f'\n診断原本: https://github.com/{repo}/actions/runs/{os.environ["GITHUB_RUN_ID"]}\n')
              subprocess.run(['gh','issue','comment','141','--repo',repo,'--body-file','incident/summary.md'],check=True,timeout=30)
          PY
