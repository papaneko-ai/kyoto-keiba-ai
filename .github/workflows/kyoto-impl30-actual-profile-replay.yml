name: Impl30 actual Nov22 profile evidence replay
on:
  push:
    branches: ['fix/impl30-actual-profile-replay-20261124']
  pull_request:
    branches: ['fix/impl29-weekend-20261128-29']
    paths:
      - 'diagnostics/kyoto_impl30_actual_profile_replay.py'
      - '.github/workflows/kyoto-impl30-actual-profile-replay.yml'
permissions:
  contents: read
  actions: read
jobs:
  actual-archive-replay:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
      KYOTO_POSTRACE_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Download exact saved encrypted archives and parser receipt
        run: |
          set -euo pipefail
          gh run download 44966013490 --repo "$GITHUB_REPOSITORY" --name kyoto-nov22-real-observed-all12-encrypted-44966013490 --dir nov22_cards
          gh run download 44984067104 --repo "$GITHUB_REPOSITORY" --name kyoto-nov22-observed-horse-profiles-44984067104 --dir nov22_profiles
          gh run download 44966654858 --repo "$GITHUB_REPOSITORY" --name kyoto-nov22-jp-start-real12-44966654858 --dir nov22_parser
      - name: Reanalyse actual source bytes only; no JRA requests
        run: python -m diagnostics.kyoto_impl30_actual_profile_replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impl30-actual-profile-replay-${{ github.run_id }}
          path: actual_profile_replay/report.json
          if-no-files-found: error
          retention-days: 90
