name: Kyoto Impl33 generic workout discovery and canonical bridge
on:
  push:
    branches: ['fix/impl33-workout-generic-intake-20261126']
permissions:
  contents: read
  actions: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      KYOTO_WEEKEND_HTTP_APPROVED: 'NO'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.18'
      - run: python -m pip install --no-deps beautifulsoup4==4.15.0 soupsieve==4.1.3 typing-extensions==4.16.0 cryptography==46.0.7 cffi==2.1.1 pycparser==3.12
      - name: Verify discovery and canonical bridge
        run: |
          set -euo pipefail
          mkdir -p generic_workout
          git rev-parse HEAD > generic_workout/head.txt
          python -m unittest discover -s tests -p 'test_kyoto_impl33_workout_generic.py' -v 2>&1 | tee generic_workout/tests.log
      - name: Reuse pre-day source archive
        run: gh run download 45755377155 --name kyoto-impl33-upcoming-workout-45755377155 --repo "$GITHUB_REPOSITORY" --dir previous_upcoming
      - name: Reparse actual pre-day originals, without source HTTP
        env:
          ARCHIVE_KEY: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
        run: python -m diagnostics.kyoto_impl33_workout_generic_replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-impl33-generic-workout-${{ github.run_id }}
          path: generic_workout/
          retention-days: 90
          if-no-files-found: error
