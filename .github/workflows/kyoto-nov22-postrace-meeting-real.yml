name: Nov22 official actual Kyoto meeting result refund original capture
on:
  push:
    branches: [fix/nov22-remaining-full-acquisition-evidence-20261122]
    paths:
      - 'diagnostics/kyoto_nov22_postrace_actual_meeting.py'
      - '.github/workflows/kyoto-nov22-postrace-meeting-real.yml'
permissions:
  contents: read
  actions: read
jobs:
  actual-observed-meeting:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      GH_TOKEN: ${{ github.token }}
      KYOTO_JRA_ARCHIVE_AES256_HEX: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Reuse observed official JRA result/payout menus, SHA and encrypted origin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p observed_menus
          gh run download 44988118961 -R "$GITHUB_REPOSITORY" -n kyoto-nov22-actual-postrace-menu-originals-44988118961 -D observed_menus
      - name: Fetch only observed Kyoto 5th meeting Day6 results and payout originals
        run: python -m diagnostics.kyoto_nov22_postrace_actual_meeting
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyoto-nov22-observed-meeting-result-payout-${{ github.run_id }}
          path: meeting_result_payout/sealed/
          retention-days: 90
          if-no-files-found: warn
