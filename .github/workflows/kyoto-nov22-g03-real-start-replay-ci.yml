name: Nov22 G03 actual Japanese start and encrypted 12R real replay
on:
  push:
    branches: [fix/nov22-g03-official-jp-start-format-20261122]
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  strict-start-and-real-source:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GH_TOKEN: ${{ github.token }}
      KYOTO_JRA_ARCHIVE_AES256_HEX: ${{ secrets.KYOTO_JRA_ARCHIVE_AES256_HEX }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3fcfbb04598f2ffe93803cc189a165a1811531fc
          path: replay
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5' 'cryptography>=43,<47'
      - name: Real time format and all established G03 negative tests
        shell: bash
        run: |
          set -euo pipefail
          cd source
          PYTHONPATH=. python -m unittest -v tests.test_kyoto_nov22_g03_official_japanese_start tests.test_kyoto_g03_all_races
      - name: Download SHA/UTC-protected actual Kyoto 12R source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/nov22_all12_source
          gh run download 44966013490 --repo "$GITHUB_REPOSITORY" --name kyoto-nov22-real-observed-all12-encrypted-44966013490 --dir source/nov22_all12_source
      - name: Execute changed strict G03 parser on twelve actual official racecards
        shell: bash
        run: |
          set -euo pipefail
          cd source
          PYTHONPATH=. python ../replay/diagnostics/kyoto_nov22_replay_frozen_g03.py
      - name: Archive safe receipts and rejection count
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyoto-nov22-jp-start-real12-${{ github.run_id }}
          path: source/nov22_frozen_g03_replay/
          if-no-files-found: warn
          retention-days: 30
