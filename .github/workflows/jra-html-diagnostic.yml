name: JRA HTML diagnostic (branch only)
on:
  push:
    branches:
      - jra-html-diagnostic-20261105
    paths:
      - 'diagnostics/capture_jra_public_html.py'
      - 'diagnostics/discover_jra_links.py'
      - 'diagnostics/inspect_jra_action.py'
      - 'diagnostics/capture_jra_actions.py'
      - 'diagnostics/inspect_jra_selection.py'
      - 'diagnostics/follow_kyoto_result.py'
      - 'diagnostics/follow_kyoto_all_races.py'
      - 'diagnostics/inspect_kyoto_payout.py'
      - 'diagnostics/extract_kyoto_payouts.py'
      - 'diagnostics/probe_kyoto_historical_odds.py'
      - 'diagnostics/probe_kyoto_bet_types.py'
      - 'diagnostics/inspect_odds_tables.py'
      - 'diagnostics/extract_kyoto_odds_matrix.py'
      - 'diagnostics/inventory_jra_features.py'
      - 'diagnostics/inspect_predictive_field_structure.py'
      - 'diagnostics/probe_runner_history.py'
      - '.github/workflows/jra-html-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Capture two public JRA HTML pages once
        run: python3 diagnostics/capture_jra_public_html.py
      - name: Inspect racing-page links from live HTML
        run: python3 diagnostics/discover_jra_links.py
      - name: Inspect live action definition and forms (no POST)
        run: python3 diagnostics/inspect_jra_action.py
      - name: Open official racing entries odds and results once
        run: python3 diagnostics/capture_jra_actions.py
      - name: Inspect captured race selection structure offline
        run: python3 diagnostics/inspect_jra_selection.py
      - name: Follow one Kyoto historical results link
        run: python3 diagnostics/follow_kyoto_result.py
      - name: Follow official Kyoto all-race results link
        run: python3 diagnostics/follow_kyoto_all_races.py
      - name: Inspect real Kyoto race payouts offline
        run: python3 diagnostics/inspect_kyoto_payout.py
      - name: Extract genuine Kyoto quinella and bracket payouts
        run: python3 diagnostics/extract_kyoto_payouts.py
      - name: Probe a real Kyoto historical odds link once
        run: python3 diagnostics/probe_kyoto_historical_odds.py
      - name: Inspect historical Kyoto race 1 quinella and bracket-quinella odds
        run: python3 diagnostics/probe_kyoto_bet_types.py
      - name: Inspect official captured odds tables offline
        run: python3 diagnostics/inspect_odds_tables.py
      - name: Extract validated historic Kyoto odds matrices
        run: python3 diagnostics/extract_kyoto_odds_matrix.py
      - name: Inventory real race and prediction feature HTML
        run: python3 diagnostics/inventory_jra_features.py
      - name: Inspect source fields and links usable by prediction model
        run: python3 diagnostics/inspect_predictive_field_structure.py
      - name: Probe genuine runner history and racecard paths
        run: python3 diagnostics/probe_runner_history.py
      - name: Upload HTML and connection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jra-public-html-diagnostic
          path: |
            jra_capture/
            jra_link_discovery/
            jra_action_capture/
            jra_feature_discovery/
          retention-days: 3
          if-no-files-found: error
